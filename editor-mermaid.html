    <div class="sec" id="secColunas">Colunas (${t.cols.length})</div>
    <div class="list" id="cols">${t.cols.map((c,i)=>colRow(c,i)).join('')||'<p class="empty-note">Nenhuma coluna ainda.</p>'}</div>
    <button class="btn sm" id="aCol" style="margin-top:8px">${ico('plus')} Adicionar coluna</button>
    <div class="sec">Relações (${rels.length})</div>
    <div class="list" id="tabRels">${rels.length?rels.map(r=>{
      const dir=r.from===t.id?'→':'←', outro=r.from===t.id?r.to:r.from;
      return `<button class="item" data-rel="${r.id}"><span class="k">${dir}</span>
        <span class="t">${esc(r.label||'(sem rótulo)')}</span><span class="s">${esc(outro)}</span></button>`;
    }).join(''):'<p class="empty-note">Nenhuma relação ainda.</p>'}</div>
    <div class="sec">Ações</div>
    <div class="list">
      <button class="btn" id="aLinkT">${ico('link')} Relacionar com outra tabela</button>
      <button class="btn" id="aDupT">${ico('copy')} Duplicar tabela</button>
      <button class="btn dan" id="aDelT">${ico('trash')} Excluir tabela</button>
    </div>`;
  const fn=$('#fTn');
  fn.addEventListener('change',()=>{
    const novo=slug(fn.value).toUpperCase();
    if(!novo){fn.value=t.id;return;}
    if(novo!==t.id&&tableById(novo)){toast('Já existe uma tabela com esse nome');fn.value=t.id;return;}
    pushUndo(); const velho=t.id; t.id=novo; t.label=novo;
    doc.relations.forEach(r=>{if(r.from===velho)r.from=novo;if(r.to===velho)r.to=novo;});
    sel={kind:'table',id:novo}; $('#sheetTag').textContent=novo; fn.value=novo; afterChange();
  });
  wireCols(t);
  $('#aCol').onclick=()=>{pushUndo();t.cols.push({type:'varchar',name:'coluna_'+(t.cols.length+1),keys:[],note:''});afterChange();paintTable();};
  $('#tabRels').onclick=e=>{const b=e.target.closest('[data-rel]');if(b)select({kind:'rel',id:b.dataset.rel},true);};
  $('#aLinkT').onclick=()=>{closeSheet();setLinkMode(true,t.id);};
  $('#aDupT').onclick=()=>{duplicarSel();openInspector();};
  $('#aDelT').onclick=confirmDelete;
}
function colRow(c,i){
  return `<div class="colrow" data-i="${i}">
    <input class="cty" value="${esc(c.type)}" data-f="type" placeholder="tipo" spellcheck="false" autocapitalize="off">
    <input class="cnm" value="${esc(c.name)}" data-f="name" placeholder="nome" spellcheck="false" autocapitalize="off">
    <div class="keychips">${['PK','FK','UK'].map(k=>
      `<button class="kc ${c.keys.includes(k)?'on':''}" data-key="${k}">${k}</button>`).join('')}</div>
    <button class="mini" data-act="up">${ico('up')}</button>
    <button class="mini" data-act="del">${ico('trash')}</button>
  </div>
  <input class="fld mono" style="margin:-2px 0 4px;padding:8px 10px;font-size:12px" data-i="${i}" data-f="note"
         value="${esc(c.note)}" placeholder="comentário (opcional)">`;
}
function wireCols(t){
  const box=$('#cols'); if(!box) return;
  box.querySelectorAll('input[data-f]').forEach(inp=>{
    const i=+inp.closest('[data-i]').dataset.i, f=inp.dataset.f;
    bindLive(inp,v=>{ if(t.cols[i]) t.cols[i][f]=v; });
  });
  box.onclick=e=>{
    const row=e.target.closest('.colrow'); if(!row)return;
    const i=+row.dataset.i, c=t.cols[i]; if(!c)return;
    const kb=e.target.closest('[data-key]');
    if(kb){
      pushUndo();
      const k=kb.dataset.key;
      const j=c.keys.indexOf(k); if(j>=0)c.keys.splice(j,1); else c.keys.push(k);
      kb.classList.toggle('on'); afterChange(); return;
    }
    const ab=e.target.closest('[data-act]');
    if(!ab){
      if(!e.target.closest('input')) select({kind:'col',id:t.id+'#'+i},true);
      return;
    }
    pushUndo();
    if(ab.dataset.act==='del') t.cols.splice(i,1);
    if(ab.dataset.act==='up'&&i>0){ const [m]=t.cols.splice(i,1); t.cols.splice(i-1,0,m); }
    afterChange(); paintTable();
  };
}

/* ---------- destaque de sintaxe ----------
   Técnica de sobreposição: um <pre> colorido embaixo e o <textarea> por cima
   com o texto transparente. Funciona porque as duas caixas usam exatamente a
   mesma fonte, tamanho, entrelinha e padding. Mexeu num, mexe no outro. */
const PALAVRAS=['flowchart','graph','erDiagram','sequenceDiagram','classDiagram','stateDiagram-v2',
'stateDiagram','journey','gantt','pie','mindmap','timeline','gitGraph','quadrantChart',
'requirementDiagram','C4Context','C4Container','C4Component','kanban','block-beta','packet-beta',
'sankey-beta','xychart-beta','radar-beta','treemap-beta','venn-beta','ishikawa-beta',
'architecture-beta','treeView-beta','zenuml','subgraph','end','direction','classDef','class',
'style','linkStyle','click','participant','actor','Note','note','loop','alt','else','opt','par',
'critical','rect','activate','deactivate','autonumber','section','title','state','commit','branch',
'checkout','merge','cherry-pick','tag','axis','curve','max','min','set','union','service','group',
'requirement','functionalRequirement','element','dateFormat','axisFormat','excludes','todayMarker',
'x-axis','y-axis','bar','line','showData','accTitle','accDescr','Person','System','System_Ext','Rel',
'done','active','crit','milestone','satisfies','derives','verifies','contains','traces','refines'];
const HL_RE=new RegExp([
  '(?<com>%%[^\\n]*)',
  '(?<str>"(?:[^"\\\\]|\\\\.)*")',
  '(?<card>[|}o][|o{](?:--|\\.\\.)[|o{][|o{]?)',
  '(?<op><?[-=.]{2,}[>xo]?)',
  '(?<kw>\\b(?:'+PALAVRAS.map(w=>w.replace(/[-]/g,'\\-')).join('|')+')\\b)',
  '(?<num>\\b\\d+(?:\\.\\d+)?\\b)',
  '(?<br>[\\[\\]{}()])',
  '(?<pun>[:,;|@#])'
].join('|'),'g');
function realce(codigo){
  let saida='',ultimo=0,m;
  HL_RE.lastIndex=0;
  while((m=HL_RE.exec(codigo))!==null){
    if(m[0]===''){ HL_RE.lastIndex++; continue; }
    saida+=esc(codigo.slice(ultimo,m.index));
    const g=m.groups||{};
    const tipo=Object.keys(g).find(k=>g[k]!=null)||'pun';
    saida+='<span class="t-'+tipo+'">'+esc(m[0])+'</span>';
    ultimo=m.index+m[0].length;
  }
  saida+=esc(codigo.slice(ultimo));
  return saida+'\n';
}
function sincronizarRealce(){
  const ca=$('#codeArea'), hl=$('#codeHL');
  if(!ca||!hl) return;
  hl.innerHTML=realce(ca.value);
  hl.scrollTop=ca.scrollTop; hl.scrollLeft=ca.scrollLeft;
}
function definirCodigo(v){
  const ca=$('#codeArea'); if(!ca) return;
  ca.value=v; sincronizarRealce();
}

/* =====================================================================
   12. CRIAÇÃO E CONEXÃO
   ===================================================================== */
function criarNo(label,shape,de){
  pushUndo();
  const id=freeId('n');
  doc.nodes.push({id,label:label||'Nova etapa',shape:shape||'round',cls:null});
  if(de&&nodeById(de)) doc.edges.push({id:uid('e'),from:de,to:id,label:'',type:'arrow'});
  const g=de?doc.groups.find(x=>x.nodes.includes(de)):null; if(g) g.nodes.push(id);
  sel={kind:'node',id}; afterChange(); haptic(12);
  return id;
}
function criarTabela(nome){
  pushUndo();
  let id=slug(nome||'').toUpperCase();
  if(!id||tableById(id)){ let i=1; id=id||'TABELA'; let base=id; while(tableById(id)){i++;id=base+'_'+i;} }
  doc.tables.push({id,label:id,cols:[{type:'uuid',name:'id',keys:['PK'],note:''}]});
  sel={kind:'table',id}; afterChange(); haptic(12);
  return id;
}
function irParaCodigo(){ const t=$$('.tab').find(x=>x.dataset.tab==='code'); if(t) t.click(); }
function addElement(){
  if(doc.tipo==='raw'){
    if(sel&&sel.kind==='txt'){ duplicarLinhaAtual(); return; }
    irParaCodigo(); return;
  }
  if(doc.tipo==='er') return composerTabela();
  composerNo(sel&&sel.kind==='node'?sel.id:null);
}
function setLinkMode(on,from){
  linkMode=on; linkFrom=on?(from||null):null;
  if(on&&from) sel={kind:doc.tipo==='er'?'table':'node',id:from};
  setRail(); paintActionBar(); drawSelection();
  if(on) haptic(12);
}
function createLink(a,b){
  pushUndo();
  if(doc.tipo==='er'){
    const r={id:uid('r'),from:a,to:b,cardL:'||',cardR:'o{',identifying:true,label:''};
    doc.relations.push(r); sel={kind:'rel',id:r.id};
  }else{
    const e={id:uid('e'),from:a,to:b,label:'',type:'arrow'};
    doc.edges.push(e); sel={kind:'edge',id:e.id};
  }
  afterChange(); paintActionBar(); haptic(14);
  const alvo=sel.id, tipo=sel.kind;
  quickText(doc.tipo==='er'?'Verbo da relação':'Rótulo da ligação','',
    v=>{ const o=tipo==='rel'?relById(alvo):edgeById(alvo); if(o)o.label=v; },
    false, doc.tipo==='er'?'ex.: contém, faz':'ex.: sim, não, após 5 min','Pular');
}

/* =====================================================================
   13. EXPORTAR / IMPORTAR / SALVAR
   ===================================================================== */
function download(txt,nome,mime,isBlob){
  const blob=isBlob?txt:new Blob([txt],{type:mime||'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast('Baixando '+nome);
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); toast('Copiado'); }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta);
    ta.select(); try{document.execCommand('copy');toast('Copiado');}catch(_){toast('Não consegui copiar');}
    ta.remove();
  }
}
async function shareCode(){
  const txt=serialize(doc);
  if(navigator.share){ try{ await navigator.share({title:doc.nome,text:txt}); return; }catch(e){} }
  copyText(txt);
}
function svgString(){
  if(!currentSVG) return null;
  const c=currentSVG.cloneNode(true);
  c.querySelectorAll('.sellayer,.hitlayer').forEach(n=>n.remove());
  const bg=document.createElementNS('http://www.w3.org/2000/svg','rect');
  bg.setAttribute('width','100%');bg.setAttribute('height','100%');
  bg.setAttribute('fill',cssVar('--ink'));
  c.insertBefore(bg,c.firstChild);
  const st=document.createElementNS('http://www.w3.org/2000/svg','style');
  st.textContent='text,tspan{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif}';
  c.insertBefore(st,c.firstChild);
  c.setAttribute('xmlns','http://www.w3.org/2000/svg');
  return '<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(c);
}
function exportSVG(){
  const s=svgString(); if(!s){toast('Nada para exportar');return;}
  download(s,slug(doc.nome)+'.svg','image/svg+xml');
}
function exportPNG(){
  const s=svgString(); if(!s){toast('Nada para exportar');return;}
  const w=currentSVG.width.baseVal.value||900, h=currentSVG.height.baseVal.value||600;
  const scale=Math.min(3,Math.max(2,1400/w));
  const img=new Image();
  img.onload=()=>{
    const cv=document.createElement('canvas');
    cv.width=Math.round(w*scale); cv.height=Math.round(h*scale);
    const ctx=cv.getContext('2d');
    ctx.fillStyle=cssVar('--ink'); ctx.fillRect(0,0,cv.width,cv.height);
    ctx.drawImage(img,0,0,cv.width,cv.height);
    cv.toBlob(b=>{ if(b) download(b,slug(doc.nome)+'.png',null,true); else toast('Falhou gerar PNG'); },'image/png');
  };
  img.onerror=()=>toast('Não consegui converter para PNG. Use o SVG.');
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
}
$('#fileIn').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const nome=f.name.replace(/\.(mmd|mermaid|md|markdown|txt)$/i,'');
      if(/\.(md|markdown)$/i.test(f.name)){ loadDoc(blankMD(nome,String(r.result))); }
      else { const novo=parseMermaid(r.result); novo.nome=nome; loadDoc(novo); }
      closeSheet(); toast('Importado');
    }catch(err){ toast('Arquivo inválido: '+(err.message||err)); }
  };
  r.readAsText(f); e.target.value='';
});

const KEY='mermaid-editor:doc', THEME_KEY='mermaid-editor:theme';
/* Guarda no storage do ambiente quando existe e cai para localStorage quando
   o arquivo é aberto direto no navegador. Tudo protegido: se os dois falharem,
   o editor segue funcionando só na memória. */
const store={
  async get(k){
    try{ if(window.storage&&window.storage.get){ const r=await window.storage.get(k); if(r&&r.value!=null) return r.value; } }catch(e){}
    try{ const v=localStorage.getItem(k); if(v!=null) return v; }catch(e){}
    return null;
  },
  async set(k,v){
    let ok=false;
    try{ if(window.storage&&window.storage.set){ await window.storage.set(k,v); ok=true; } }catch(e){}
    try{ localStorage.setItem(k,v); ok=true; }catch(e){}
    return ok;
  }
};
function hasStore(){ return true; }
async function save(){
  try{ await store.set(KEY,JSON.stringify({doc,theme:document.body.className})); }catch(e){}
}
async function loadSaved(){
  try{ const v=await store.get(KEY); return v?JSON.parse(v):null; }catch(e){ return null; }
}


/* =====================================================================
   13.5 CAMADA DE INTERAÇÃO
   Barra de ações contextuais, diálogos leves e criação encadeada.
   Princípio: selecionar é barato (não abre painel); as cinco coisas
   que se faz o tempo todo cabem num toque; o painel completo continua
   a um toque de distância para todo o resto.
   ===================================================================== */

/* ---------- diálogo no estilo alerta do iOS ---------- */
function alertUI(o){
  const w=$('#alertWrap');
  const t=$('#alertTitle'); t.textContent=o.title||''; t.hidden=!o.title;
  const m=$('#alertMsg');   m.textContent=o.msg||'';   m.hidden=!o.msg;
  const f=$('#alertFields'); f.innerHTML=''; if(o.build) o.build(f);
  const b=$('#alertBtns');
  b.className=o.buttons.length===2?'two':'';
  b.innerHTML=o.buttons.map((x,i)=>'<button class="abtn '+(x.style||'')+'" data-i="'+i+'">'+esc(x.label)+'</button>').join('');
  b.onclick=ev=>{
    const el=ev.target.closest('[data-i]'); if(!el) return;
    const cfg=o.buttons[+el.dataset.i];
    const campo=f.querySelector('input,textarea');
    const r=cfg.onClick?cfg.onClick(campo?campo.value.trim():'',f):undefined;
    if(r!==false) closeAlert();
  };
  const linha=f.querySelector('input');
  if(linha) linha.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'){ ev.preventDefault(); const bs=b.querySelectorAll('.abtn'); bs[bs.length-1].click(); }
  });
  w.hidden=false;
  requestAnimationFrame(()=>w.classList.add('show'));
  setTimeout(()=>{const c=f.querySelector('input,textarea'); if(c){c.focus(); if(c.select)c.select();}},130);
}
function closeAlert(){
  const w=$('#alertWrap'); w.classList.remove('show');
  setTimeout(()=>{ w.hidden=true; $('#alertFields').innerHTML=''; },260);
}
$('#alertScrim').onclick=closeAlert;

function quickText(titulo,valor,aplicar,multiline,placeholder,rotuloCancelar){
  alertUI({
    title:titulo,
    build(c){
      const el=document.createElement(multiline?'textarea':'input');
      el.className='afield'; el.value=valor||'';
      if(placeholder) el.placeholder=placeholder;
      if(multiline) el.rows=3; else el.type='text';
      el.setAttribute('enterkeyhint','done');
      c.appendChild(el);
    },
    buttons:[
      {label:rotuloCancelar||'Cancelar',style:'cancel'},
      {label:'Salvar',style:'primary',onClick:v=>{ pushUndo(); aplicar(v); afterChange(); paintActionBar(); }}
    ]
  });
}

/* ---------- criação encadeada ---------- */
function composerNo(de){
  let forma='round';
  const comuns=['round','rhombus','stadium','cylinder','subroutine','parallel'];
  alertUI({
    title:de?'Próxima etapa':'Nova etapa',
    msg:de?('Sai de '+de):null,
    build(c){
      const i=document.createElement('input');
      i.className='afield'; i.type='text'; i.placeholder='O que acontece aqui';
      i.setAttribute('enterkeyhint','done'); c.appendChild(i);
      const row=document.createElement('div'); row.className='ashapes';
      row.innerHTML=comuns.map(k=>'<button class="ashape '+(k===forma?'sel':'')+'" data-s="'+k+'" aria-label="'+SHAPES[k].nome+'">'+shapeSvg(k)+'</button>').join('');
      row.onclick=e=>{
        const b=e.target.closest('[data-s]'); if(!b) return;
        forma=b.dataset.s;
        row.querySelectorAll('.ashape').forEach(x=>x.classList.toggle('sel',x===b));
      };
      c.appendChild(row);
    },
    buttons:[
      {label:'Cancelar',style:'cancel'},
      {label:'Adicionar e continuar',onClick:v=>{ const id=criarNo(v,forma,de); paintActionBar(); setTimeout(()=>composerNo(id),320); }},
      {label:'Adicionar',style:'primary',onClick:v=>{ const id=criarNo(v,forma,de); select({kind:'node',id}); }}
    ]

}
function composerTabela(){
  alertUI({
    title:'Nova tabela',
    msg:'Já vem com uma coluna id como chave primária.',
    build(c){
      const i=document.createElement('input');
      i.className='afield mono'; i.type='text'; i.placeholder='PEDIDO';
      i.autocapitalize='characters'; i.spellcheck=false; i.setAttribute('enterkeyhint','done');
      c.appendChild(i);
    },
    buttons:[
      {label:'Cancelar',style:'cancel'},
      {label:'Criar',style:'primary',onClick:v=>{ const id=criarTabela(v); select({kind:'table',id},true); }}
    ]
  });
}

/* ---------- excluir e duplicar ---------- */
function deleteSel(){
  if(!sel) return;
  if(sel.kind==='txt'){ excluirLinhaAtual(); closeSheet(); return; }
  if(sel.kind==='col'){
    const c=colunaDe(sel);
    if(!c){ sel=null; paintActionBar(); return; }
    pushUndo();
    c.tab.cols.splice(c.idx,1);
    sel={kind:'table',id:c.tab.id};
    closeSheet(); afterChange(); paintActionBar(); haptic(18);
    toast('Coluna excluída — dá para desfazer');
    return;
  }
  pushUndo();
  if(sel.kind==='node'){
    doc.nodes=doc.nodes.filter(n=>n.id!==sel.id);
    doc.edges=doc.edges.filter(x=>x.from!==sel.id&&x.to!==sel.id);
    doc.groups.forEach(g=>g.nodes=g.nodes.filter(i=>i!==sel.id));
    doc.groups=doc.groups.filter(g=>g.nodes.length);
  }
  if(sel.kind==='edge')  doc.edges=doc.edges.filter(x=>x.id!==sel.id);
  if(sel.kind==='table'){
    doc.tables=doc.tables.filter(t=>t.id!==sel.id);
    doc.relations=doc.relations.filter(r=>r.from!==sel.id&&r.to!==sel.id);
  }
  if(sel.kind==='rel')   doc.relations=doc.relations.filter(x=>x.id!==sel.id);
  sel=null; closeSheet(); afterChange(); paintActionBar(); haptic(18);
  toast('Excluído — dá para desfazer no topo');
}
function confirmDelete(){
  if(!sel) return;
  const composto=sel.kind==='node'||sel.kind==='table';
  const t=sel.kind==='txt'?trechoDe(sel):null;
  alertUI({
    title:t?'Excluir a linha '+t.numero+'?':'Excluir '+describe(sel)+'?',
    msg:t?t.linha.trim():(composto?'As conexões ligadas a ele também somem.':null),
    buttons:[{label:'Cancelar',style:'cancel'},{label:'Excluir',style:'dan',onClick:deleteSel}]
  });
}
function duplicarSel(){
  if(!sel) return;
  pushUndo();
  if(sel.kind==='node'){
    const n=nodeById(sel.id); if(!n) return;
    const id=freeId('n');
    doc.nodes.push({id,label:n.label,shape:n.shape,cls:n.cls});
    const g=doc.groups.find(x=>x.nodes.includes(n.id)); if(g) g.nodes.push(id);
    sel={kind:'node',id};
  }else if(sel.kind==='table'){
    const t=tableById(sel.id); if(!t) return;
    let base=t.id+'_COPIA',i=1,id=base; while(tableById(id)){ i++; id=base+i; }
    doc.tables.push({id,label:id,cols:clone(t.cols)});
    sel={kind:'table',id};
  }else return;
  afterChange(); paintActionBar(); haptic(12); toast('Duplicado');
}

/* ---------- barra de ações contextuais ---------- */
function actionsHTML(list){
  return list.map(a=>'<button class="act '+(a.c||'')+'" data-k="'+a.k+'">'+ico(a.i)+'<span>'+esc(a.l)+'</span></button>').join('');
}
function paintActionBar(){
  const bar=$('#actionbar'), acts=$('#abActions'), dot=$('#abDot'), tit=$('#abTitle');
  if(!bar) return;

  if(linkMode){
    bar.hidden=false; $('#abClose').hidden=true;

      ? ('saindo de <b>'+esc(linkFrom)+'</b> — toque no destino')

    if(acts.dataset.chave!=='link'){ acts.innerHTML=actionsHTML([{k:'cancel',i:'close',l:'Cancelar',c:'dan'}]); acts.dataset.chave='link'; }
    acts.onclick=e=>{ if(e.target.closest('[data-k="cancel"]')) setLinkMode(false); };
    return;
  }
  $('#abClose').hidden=false;

      inv:()=>{ pushUndo(); const a=e.from; e.from=e.to; e.to=a; afterChange(); paintActionBar(); },

    lista=[{k:'col',i:'columns',l:'Colunas'},{k:'nome',i:'pencil',l:'Nome'},

           {k:'ia',i:'spark',l:'IA'},{k:'del',i:'trash',l:'Excluir',c:'dan'},
           {k:'full',i:'sliders',l:'Editar',c:'go'}];
    mapa={
      ia:()=>paintAI('sel'),
      col:()=>openInspector('secColunas'),
      nome:()=>quickText('Nome da tabela',t.id,v=>{
        const novo=slug(v).toUpperCase();
        if(!novo||(novo!==t.id&&tableById(novo))){ toast('Nome inválido ou já usado'); return; }
        const velho=t.id; t.id=novo; t.label=novo;
        doc.relations.forEach(r=>{ if(r.from===velho)r.from=novo; if(r.to===velho)r.to=novo; });

/* ---------- assistente de IA ----------
   O escopo decide o que vai no pedido: o diagrama inteiro, ou só o elemento
   selecionado com a ordem explícita de não tocar no resto. A resposta passa
   pelo parser do Mermaid antes de virar diagrama, com uma tentativa de
   correção automática se não compilar. Tudo entra no histórico de desfazer. */
let iaEscopo='tudo', iaTexto='';

function contextoSelecao(){
  if(!sel) return null;
  if(sel.kind==='node'){
    const n=nodeById(sel.id); if(!n) return null;
    return 'o nó de id `'+n.id+'` (texto atual: "'+(n.label||'').split(String.fromCharCode(10)).join(' ')+'")';
  }
  if(sel.kind==='edge'){
    const e=edgeById(sel.id); if(!e) return null;
    return 'a ligação de `'+e.from+'` para `'+e.to+'`'+(e.label?' com rótulo "'+e.label+'"':' (sem rótulo)');
  }
  if(sel.kind==='table'){
    const t=tableById(sel.id); if(!t) return null;
    return 'a tabela `'+t.id+'` e suas colunas';
  }
  if(sel.kind==='rel'){
    const r=relById(sel.id); if(!r) return null;
    return 'a relação entre `'+r.from+'` e `'+r.to+'`';
  }
  if(sel.kind==='txt'){
    const t=trechoDe(sel); if(!t) return null;
    return 'a linha '+t.numero+' do código, que hoje é: '+t.linha.trim();
  }
  if(sel.kind==='col'){
    const c=colunaDe(sel); if(!c) return null;
    return 'a coluna `'+c.col.name+'` (tipo '+c.col.type+') da tabela `'+c.tab.id+'`';
  }
  return null;
}
function sugestoesIA(){
  if(iaEscopo==='sel'){
    if(sel&&(sel.kind==='edge'||sel.kind==='rel'))
      return ['Deixar o rótulo mais claro','Inverter o sentido','Explicar a condição'];
    if(sel&&sel.kind==='table')
      return ['Adicionar campos de auditoria','Normalizar esta tabela','Traduzir as colunas para inglês'];
    if(sel&&sel.kind==='col')
      return ['Sugerir um tipo melhor','Renomear em snake_case','Escrever um comentário explicando'];
    if(sel&&sel.kind==='txt')
      return ['Reescrever mais claro','Desdobrar em duas linhas','Traduzir para inglês'];
    return ['Dividir em duas etapas','Reescrever mais direto','Adicionar o caminho de erro daqui'];
  }
  if(doc.tipo==='er')
    return ['Adicionar criado_em e atualizado_em','Normalizar o modelo','Traduzir tudo para inglês','Adicionar uma tabela de log'];
  if(doc.tipo==='flow')
    return ['Adicionar o caminho de erro','Simplificar em menos passos','Mudar para horizontal','Detalhar cada etapa','Traduzir para inglês'];
  return ['Deixar mais completo','Simplificar','Traduzir para inglês','Adicionar mais um exemplo'];
}

function limparCerca(t){
  let x=String(t||'').trim();
  x=x.replace(/^```[a-zA-Z]*\s*/,'').replace(/```\s*$/,'');
  return x.trim();
}
async function pedirMermaid(codigo,pedido,alvo,erroAnterior){
  const linhas=[
    'Você edita diagramas Mermaid.',
    'Responda SOMENTE com o código Mermaid completo e final.',
    'Sem cercas de markdown, sem crases, sem explicação, sem texto antes ou depois.',
    'Mantenha o mesmo tipo de diagrama e o mesmo idioma dos rótulos, a não ser que o pedido diga outra coisa.',
    '',
    'Código atual:',
    codigo,
    '',
    alvo
      ? 'Altere APENAS '+alvo+'. Todo o resto do código deve sair idêntico, linha por linha.'
      : 'Você pode alterar qualquer parte do diagrama.',
    '',
    'Pedido: '+pedido
  ];
  if(erroAnterior){
    linhas.push('','A sua resposta anterior não compilou. O erro do Mermaid foi:',erroAnterior,
                'Devolva o código corrigido.');
  }
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      model:'claude-sonnet-4-6',
      max_tokens:1000,
      messages:[{role:'user',content:linhas.join(String.fromCharCode(10))}]
    })
  });
  if(!r.ok) throw new Error('HTTP '+r.status);
  const d=await r.json();
  const txt=(d.content||[]).filter(x=>x.type==='text').map(x=>x.text).join(String.fromCharCode(10));
  return limparCerca(txt);
}
async function validarMermaid(codigo){
  if(!codigo||!codigo.trim()) return 'a resposta veio vazia';
  if(!window.mermaid||!window.mermaid.parse) return null;
  try{ await window.mermaid.parse(codigo); return null; }
  catch(e){ return String((e&&e.message)||e).slice(0,400); }
}
function aplicarIA(codigo){
  pushUndo();
  const nome=doc.nome;
  const novo=parseMermaid(codigo);
  novo.nome=nome;
  doc=novo; sel=null; viewInit=false;
  refreshChrome(); afterChange(); paintActionBar();
}
function mensagemErroIA(e){
  const m=String((e&&e.message)||e);
  if(/Failed to fetch|NetworkError|HTTP (401|403)/i.test(m)||(e&&e.name==='TypeError'))
    return 'A geração por IA usa a API da Anthropic e só responde com o editor rodando dentro do Claude. Abrindo o arquivo direto no navegador, ou sem internet, a chamada é bloqueada. O resto do editor continua funcionando normalmente.';
  return m;
}
async function gerarIA(){
  const pr=$('#iaPrompt'), btn=$('#iaGo'), msg=$('#iaMsg');
  const pedido=(pr.value||'').trim();
  if(!pedido){ toast('Escreva o que você quer mudar'); pr.focus(); return; }
  iaTexto=pedido;
  btn.disabled=true; btn.style.opacity='.6';
  btn.innerHTML='<span class="spin"></span> Gerando…';
  msg.textContent='';
  const codigoAtual=serialize(doc);
  const alvo=iaEscopo==='sel'?contextoSelecao():null;
  try{
    let saida=await pedirMermaid(codigoAtual,pedido,alvo,null);
    let erro=await validarMermaid(saida);
    if(erro){
      msg.textContent='Não compilou de primeira. Tentando de novo…';
      saida=await pedirMermaid(codigoAtual,pedido,alvo,erro);
      erro=await validarMermaid(saida);
    }
    if(erro) throw new Error('A IA devolveu um Mermaid que não compila:'+String.fromCharCode(10)+erro);
    aplicarIA(saida);
    iaTexto='';
    closeSheet(); haptic(16);
    toast('Aplicado — desfaça no topo se não gostar');
  }catch(e){
    msg.textContent=mensagemErroIA(e);
  }finally{
    btn.disabled=false; btn.style.opacity='';
    btn.innerHTML=ico('spark')+' Gerar';
  }
}

/* =====================================================================
   15. DOCUMENTOS MARKDOWN
   Editor no espírito do Notas: texto grande, sem moldura, e uma barra de
   formatação que aplica no que está selecionado. O Mermaid entra como bloco
   cercado e volta a ser editável no canvas com um toque.
   ===================================================================== */
function blankMD(nome,md){
  return {tipo:'md',nome:nome||'Documento sem título',md:md==null?'':md,kind:'Documento',
          direction:'TD',code:'',nodes:[],edges:[],groups:[],classes:[],tables:[],relations:[]};
}
let mdModo='edit', mdBlocos=[], retornoMd=null;

/* ---------- renderizador de markdown ---------- */
function mdInline(t){
  let x=esc(t);
  const codigos=[];
  x=x.replace(/`([^`]+)`/g,(m,c)=>{ codigos.push(c); return '\u0001'+(codigos.length-1)+'\u0001'; });
  x=x.replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g,'<img alt="$1" src="$2">');
  x=x.replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  x=x.replace(/(\*\*\*|___)([\s\S]+?)\1/g,'<strong><em>$2</em></strong>');
  x=x.replace(/(\*\*|__)([\s\S]+?)\1/g,'<strong>$2</strong>');
  x=x.replace(/(^|[\s(])([*_])([^*_\n]+?)\2(?=$|[\s.,;:!?)])/g,'$1<em>$3</em>');
  x=x.replace(/~~([\s\S]+?)~~/g,'<del>$1</del>');
  x=x.replace(/==([\s\S]+?)==/g,'<mark>$1</mark>');
  x=x.replace(/(^|\s)(https?:\/\/[^\s<]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  x=x.replace(/\u0001(\d+)\u0001/g,(m,i)=>'<code>'+esc(codigos[+i])+'</code>');
  return x;
}
function mdCelulas(l){
  let x=l.trim();
  if(x.charAt(0)==='|') x=x.slice(1);
  if(x.charAt(x.length-1)==='|') x=x.slice(0,-1);
  return x.split('|').map(c=>c.trim());
}
function mdMontarLista(itens){
  let i=0;
  function nivel(rec){
    const ord=itens[i].ord;
    let h='<'+(ord?'ol':'ul')+'>';
    while(i<itens.length&&itens[i].ind>=rec){
      if(itens[i].ind>rec){ h+=nivel(itens[i].ind); continue; }
      const it=itens[i]; i++;
      const tar=/^\[([ xX])\]\s+([\s\S]*)$/.exec(it.txt);
      if(tar){
        const feito=/[xX]/.test(tar[1]);
        h+='<li class="task'+(feito?' done':'')+'" data-task="'+it.tarefa+'">'+
           '<span class="box'+(feito?' on':'')+'"></span><span>'+mdInline(tar[2])+'</span></li>';
      }else h+='<li>'+mdInline(it.txt)+'</li>';
    }
    return h+'</'+(ord?'ol':'ul')+'>';
  }
  return nivel(itens[0].ind);
}
function mdParaHtml(md){
  const texto=String(md||'');
  const linhas=texto.split(String.fromCharCode(10));
  const desloc=[]; let acc=0;
  linhas.forEach(l=>{ desloc.push(acc); acc+=l.length+1; });
  const saida=[]; const blocos=[];
  let i=0, contaTarefa=0, para=[];
  const fecharPara=()=>{ if(para.length){ saida.push('<p>'+para.map(mdInline).join('<br>')+'</p>'); para=[]; } };

  while(i<linhas.length){
    const l=linhas[i];
    const cerca=/^\s*```\s*([\w-]*)\s*$/.exec(l);
    if(cerca){
      fecharPara();
      const lang=(cerca[1]||'').toLowerCase();
      const inicio=i+1; let j=i+1;
      while(j<linhas.length&&!/^\s*```\s*$/.test(linhas[j])) j++;
      const corpo=linhas.slice(inicio,j).join(String.fromCharCode(10));
      if(lang==='mermaid'){
        const ini=inicio<linhas.length?desloc[inicio]:texto.length;
        const fim=j<=inicio?ini:desloc[j]-1;
        saida.push('<div class="mdmermaid" data-b="'+blocos.length+'"></div>');
        blocos.push({code:corpo,ini,fim:Math.max(ini,fim)});
      }else{
        saida.push('<pre class="mdcode"><code>'+esc(corpo)+'</code></pre>');
      }
      i=j+1; continue;
    }
    if(/^\s*$/.test(l)){ fecharPara(); i++; continue; }
    if(/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(l)){ fecharPara(); saida.push('<hr>'); i++; continue; }
    const h=/^(#{1,6})\s+(.*)$/.exec(l);
    if(h){ fecharPara(); const n=Math.min(h[1].length,4); saida.push('<h'+n+'>'+mdInline(h[2])+'</h'+n+'>'); i++; continue; }
    if(/^\s*>\s?/.test(l)){
      fecharPara();
      const corpo=[];
      while(i<linhas.length&&/^\s*>\s?/.test(linhas[i])){ corpo.push(linhas[i].replace(/^\s*>\s?/,'')); i++; }
      saida.push('<blockquote>'+mdParaHtml(corpo.join(String.fromCharCode(10))).html+'</blockquote>');
      continue;
    }
    if(l.indexOf('|')>=0&&i+1<linhas.length&&/^[\s|:-]+$/.test(linhas[i+1])&&linhas[i+1].indexOf('-')>=0){
      fecharPara();
      const cab=mdCelulas(l);
      const alinha=mdCelulas(linhas[i+1]).map(c=>
        /^:.*:$/.test(c)?'center':/:$/.test(c)?'right':'left');
      i+=2;
      const corpo=[];
      while(i<linhas.length&&linhas[i].indexOf('|')>=0&&!/^\s*$/.test(linhas[i])){ corpo.push(mdCelulas(linhas[i])); i++; }
      let t='<table><thead><tr>'+cab.map((c,k)=>'<th style="text-align:'+(alinha[k]||'left')+'">'+mdInline(c)+'</th>').join('')+'</tr></thead><tbody>';
      corpo.forEach(r=>{ t+='<tr>'+cab.map((_,k)=>'<td style="text-align:'+(alinha[k]||'left')+'">'+mdInline(r[k]||'')+'</td>').join('')+'</tr>'; });
      saida.push(t+'</tbody></table>');
      continue;
    }
    if(/^(\s*)([-*+]|\d+[.)])\s+/.test(l)){
      fecharPara();
      const itens=[];
      while(i<linhas.length&&/^(\s*)([-*+]|\d+[.)])\s+/.test(linhas[i])){
        const m=/^(\s*)([-*+]|\d+[.)])\s+([\s\S]*)$/.exec(linhas[i]);
        const item={ind:m[1].replace(/\t/g,'  ').length,ord:/\d/.test(m[2]),txt:m[3],tarefa:-1};
        if(/^\[[ xX]\]\s+/.test(item.txt)) item.tarefa=contaTarefa++;
        itens.push(item); i++;
      }
      saida.push(mdMontarLista(itens));
      continue;
    }
    para.push(l); i++;
  }
  fecharPara();
  return {html:saida.join(''),blocos};
}

/* ---------- tela de leitura ---------- */
let mdSeq=0;
async function renderMdView(){
  const alvo=$('#mdView'); if(!alvo) return;
  const r=mdParaHtml(doc.md);
  mdBlocos=r.blocos;
  alvo.innerHTML=r.html||'<p style="color:var(--muted)">Documento vazio. Toque em Escrever para começar.</p>';
  alvo.querySelectorAll('.mdmermaid').forEach(async caixa=>{
    const idx=+caixa.dataset.b, bloco=mdBlocos[idx];
    caixa.innerHTML='<div class="cab"><b>Diagrama</b>'+
      '<button data-ed="'+idx+'">Editar</button><button data-cp="'+idx+'">Copiar</button></div>'+
      '<div class="tela"></div>';
    const tela=caixa.querySelector('.tela');
    if(!window.mermaid){ tela.innerHTML='<div class="falhou">Mermaid indisponível.</div>'; return; }
    try{
      const out=await window.mermaid.render('mdd'+(++mdSeq),bloco.code);
      tela.innerHTML=out.svg||out;
      const t=document.getElementById('dmdd'+mdSeq); if(t) t.remove();
    }catch(e){
      tela.innerHTML='<div class="falhou">'+esc((e&&e.message)||String(e))+'</div>';
    }
  });
  alvo.onclick=e=>{
    const ed=e.target.closest('[data-ed]'), cp=e.target.closest('[data-cp]');
    const cx=e.target.closest('.box');
    if(ed){ editarBlocoMd(+ed.dataset.ed); return; }
    if(cp){ copyText(mdBlocos[+cp.dataset.cp].code); return; }
    if(cx){ alternarTarefa(+cx.parentNode.dataset.task); return; }
  };
}
function alternarTarefa(n){
  if(!(n>=0)) return;
  const re=/^(\s*(?:[-*+]|\d+[.)])\s+)\[([ xX])\]/gm;
  let k=0;
  pushUndo();
  doc.md=doc.md.replace(re,(m,pre,marca)=>{
    if(k++!==n) return m;
    return pre+'['+(/[xX]/.test(marca)?' ':'x')+']';
  });
  haptic(10); afterChange();
}

/* ---------- ida e volta com o editor de diagramas ---------- */
function editarBlocoMd(idx){
  const b=mdBlocos[idx]; if(!b) return;
  retornoMd={nome:doc.nome,md:doc.md,ini:b.ini,fim:b.fim};
  let d;
  try{ d=parseMermaid(b.code); }catch(e){ d=blankRaw('Diagrama','Código Mermaid',b.code); }
  d.nome=doc.nome;
  loadDoc(d);
  atualizarVolta();
  toast('Edite e toque em Voltar ao documento');
}
function voltarParaMd(){
  if(!retornoMd) return;
  const codigo=serialize(doc);
  const md=retornoMd.md.slice(0,retornoMd.ini)+codigo+retornoMd.md.slice(retornoMd.fim);
  const nome=retornoMd.nome;
  retornoMd=null;
  loadDoc(blankMD(nome,md));
  mdModo='read'; aplicarModoMd();
  atualizarVolta();
  toast('Diagrama salvo no documento');
}
function atualizarVolta(){
  const b=$('#btnVoltaMd'); if(b) b.hidden=!retornoMd;
}

/* ---------- barra de formatação ---------- */
const MD_BOTOES=[
  {k:'h',   i:'head',     l:'Título'},
  {k:'b',   i:'bold',     l:'Negrito'},
  {k:'i',   i:'italic',   l:'Itálico'},
  {k:'li',  i:'lista',    l:'Lista'},
  {k:'ol',  i:'numlista', l:'Numerada'},
  {k:'task',i:'tarefa',   l:'Tarefa'},
  {k:'q',   i:'citacao',  l:'Citação'},
  {k:'code',i:'code',     l:'Código'},
  {k:'link',i:'link',     l:'Link'},
  {k:'tab', i:'columns',  l:'Tabela'},
  {k:'mer', i:'flow',     l:'Diagrama'},
  {k:'hr',  i:'regua',    l:'Linha'}
];
function pintarBarraMd(){
  const bar=$('#mdBar'); if(!bar) return;
  bar.innerHTML=MD_BOTOES.map(b=>
    '<button class="act" data-k="'+b.k+'">'+ico(b.i)+'<span>'+b.l+'</span></button>').join('');
  bar.onclick=e=>{ const b=e.target.closest('[data-k]'); if(b) acaoMd(b.dataset.k); };
}
function mdCampo(){ return $('#mdArea'); }
function mdAplicar(nova,ini,fim){
  const ta=mdCampo();
  pushUndo();
  ta.value=nova; doc.md=nova;
  ta.focus();
  if(ini!=null) ta.setSelectionRange(ini,fim==null?ini:fim);
  agendarSalvarMd();
  setRail();
}
function mdEnvolver(pre,pos){
  const ta=mdCampo(), v=ta.value, a=ta.selectionStart, b=ta.selectionEnd;
  const meio=v.slice(a,b)||'texto';
  mdAplicar(v.slice(0,a)+pre+meio+pos+v.slice(b), a+pre.length, a+pre.length+meio.length);
}
function mdPorLinha(fn){
  const ta=mdCampo(), v=ta.value;
  const a=v.lastIndexOf(String.fromCharCode(10),ta.selectionStart-1)+1;
  let b=v.indexOf(String.fromCharCode(10),ta.selectionEnd);
  if(b<0) b=v.length;
  const bloco=v.slice(a,b).split(String.fromCharCode(10)).map(fn).join(String.fromCharCode(10));
  mdAplicar(v.slice(0,a)+bloco+v.slice(b), a, a+bloco.length);
}
function mdInserirBloco(txt){
  const ta=mdCampo(), v=ta.value;
  let a=ta.selectionStart;
  const antes=v.slice(0,a);
  const quebra=(antes&&!/\n\n$/.test(antes))?(/\n$/.test(antes)?String.fromCharCode(10):String.fromCharCode(10,10)):'';
  const novo=antes+quebra+txt+String.fromCharCode(10);
  mdAplicar(novo+v.slice(ta.selectionEnd), novo.length, novo.length);
}
function acaoMd(k){
  const ta=mdCampo(); if(!ta) return;
  if(k==='h') return mdPorLinha(l=>{
    const m=/^(#{1,4})\s+([\s\S]*)$/.exec(l);
    if(!m) return '# '+l.replace(/^#+\s*/,'');
    return m[1].length>=4 ? m[2] : '#'.repeat(m[1].length+1)+' '+m[2];
  });
  if(k==='b') return mdEnvolver('**','**');
  if(k==='i') return mdEnvolver('*','*');
  if(k==='code') return mdEnvolver('`','`');
  if(k==='li') return mdPorLinha(l=>/^\s*[-*+]\s+/.test(l)?l.replace(/^(\s*)[-*+]\s+/,'$1'):l.replace(/^(\s*)/,'$1- '));
  if(k==='ol') return mdPorLinha((l,n)=>/^\s*\d+[.)]\s+/.test(l)?l.replace(/^(\s*)\d+[.)]\s+/,'$1'):l.replace(/^(\s*)/,'$1'+(n+1)+'. '));
  if(k==='task') return mdPorLinha(l=>/^\s*[-*+]\s+\[[ xX]\]\s+/.test(l)
    ? l.replace(/^(\s*)[-*+]\s+\[[ xX]\]\s+/,'$1')
    : l.replace(/^(\s*)(?:[-*+]\s+)?/,'$1- [ ] '));
  if(k==='q') return mdPorLinha(l=>/^\s*>\s?/.test(l)?l.replace(/^(\s*)>\s?/,'$1'):'> '+l);
  if(k==='hr') return mdInserirBloco('---');
  if(k==='link'){
    const v=ta.value, a=ta.selectionStart, b=ta.selectionEnd;
    const txt=v.slice(a,b)||'texto do link';
    const novo=v.slice(0,a)+'['+txt+'](https://)'+v.slice(b);
    const cursor=a+txt.length+3+8;
    return mdAplicar(novo,cursor,cursor);
  }
  if(k==='tab') return mdInserirBloco(
    '| Coluna | Coluna |'+String.fromCharCode(10)+
    '| --- | --- |'+String.fromCharCode(10)+
    '| valor | valor |');
  if(k==='mer') return escolherDiagramaMd();
}
function escolherDiagramaMd(){
  alertUI({
    title:'Inserir diagrama',
    msg:'Ele vira um bloco mermaid no documento e continua editável no canvas.',
    buttons:[
      {label:'Cancelar',style:'cancel'},
      {label:'Modelo relacional',onClick:()=>inserirDiagramaMd(serialize(templateER()))},
      {label:'Fluxograma',style:'primary',onClick:()=>inserirDiagramaMd(serialize(templateFlow()))}
    ]
  });
}
function inserirDiagramaMd(codigo){
  mdInserirBloco('```mermaid'+String.fromCharCode(10)+codigo+String.fromCharCode(10)+'```');
  mdModo='read'; aplicarModoMd();
}

/* ---------- modo e ciclo de vida ---------- */
let salvarMdT=null;
function agendarSalvarMd(){ clearTimeout(salvarMdT); salvarMdT=setTimeout(save,600); }
function aplicarModoMd(){
  const ta=$('#mdArea'), view=$('#mdView'), bar=$('#mdBar');
  if(!ta) return;
  const escrevendo=mdModo==='edit';
  ta.hidden=!escrevendo; view.hidden=escrevendo; bar.hidden=!escrevendo;
  $$('#mdSeg .pick').forEach(b=>b.classList.toggle('sel',b.dataset.m===mdModo));
  if(!escrevendo){ document.body.classList.remove('escrevendo'); renderMdView(); }
}
function montarMd(){
  const ta=$('#mdArea');
  if(ta.dataset.pronto) return;
  ta.dataset.pronto='1';
  pintarBarraMd();
  let antes=null;
  ta.addEventListener('focus',()=>{ antes=JSON.stringify(doc); document.body.classList.add('escrevendo'); });
  ta.addEventListener('blur',()=>{
    document.body.classList.remove('escrevendo');
    if(antes&&antes!==JSON.stringify(doc)){ undoStack.push(antes); redoStack=[]; updateUndoBtns(); }
    antes=null;
  });
  ta.addEventListener('input',()=>{ doc.md=ta.value; agendarSalvarMd(); setRail(); });
  $('#mdSeg').onclick=e=>{
    const b=e.target.closest('[data-m]'); if(!b) return;
    mdModo=b.dataset.m; aplicarModoMd();
  };
  if(window.visualViewport){
    const vv=window.visualViewport;
    const ajusta=()=>{
      const off=Math.max(0,window.innerHeight-vv.height-vv.offsetTop);
      document.documentElement.style.setProperty('--kb',off+'px');
    };
    vv.addEventListener('resize',ajusta); vv.addEventListener('scroll',ajusta); ajusta();
  }
}
function estruturaMd(){
  const linhas=(doc.md||'').split(String.fromCharCode(10));
  const itens=[];
  linhas.forEach((l,n)=>{
    const h=/^(#{1,4})\s+(.*)$/.exec(l);
    if(h) itens.push({nivel:h[1].length,texto:h[2],linha:n});
  });
  return itens;
}

/* =====================================================================
   14. NAVEGAÇÃO E INICIALIZAÇÃO
   ===================================================================== */
let temaEscolhido=false;
function temaAtual(){ return document.body.classList.contains('light')?'light':'dark'; }
function setTheme(t,doUsuario){
  document.body.classList.toggle('light',t==='light');
  const b=$('#btnTheme');
  if(b){ b.innerHTML=ico(t==='light'?'moon':'sun'); b.setAttribute('aria-label',t==='light'?'Mudar para escuro':'Mudar para claro'); }
  if(window.mermaid){ configMermaid(); render(); }
  if(doUsuario){ temaEscolhido=true; store.set(THEME_KEY,t); }
  save();
}
function loadDoc(d){
  if(d.tipo==='md') mdModo=(d.md||'').trim()?'read':'edit';
  doc=d; sel=null; undoStack=[]; redoStack=[]; updateUndoBtns();
  viewInit=false; refreshChrome(); afterChange();
}
$('#btnMenu').onclick=paintMenu;
$('#btnUndo').onclick=undo;
$('#btnRedo').onclick=redo;
$('#btnVoltaMd').onclick=voltarParaMd;
$('#btnAI').onclick=()=>paintAI(sel?'sel':'tudo');
$('#btnTheme').onclick=()=>setTheme(temaAtual()==='light'?'dark':'light',true);
$('#btnAdd').onclick=addElement;
$('#abClose').onclick=()=>select(null);
$('#eNew').onclick=addElement;
$('#eTpl').onclick=paintGallery;
$('#btnFit').onclick=()=>fit();
$('#zoomLbl').onclick=()=>{view.k=1;applyView();};
$('#docName').addEventListener('change',e=>{doc.nome=e.target.value||'Sem título';save();});
$$('.tab').forEach(b=>b.addEventListener('click',()=>{
  const t=b.dataset.tab;
  $$('.tab').forEach(x=>x.classList.toggle('active',x===b));
  if(t==='canvas'){ closeSheet(); $$('.tab').forEach(x=>x.classList.toggle('active',x===b)); return; }
  if(t==='elements'){ openSheet('elements','Elementos'); paintElements(); }
  if(t==='code'){ openSheet('code','Código Mermaid'); paintCode(); }
  if(t==='style'){ openSheet('style','Estilo e layout'); paintStyle(); }
}));
let rzT=null;
window.addEventListener('resize',()=>{ clearTimeout(rzT); rzT=setTimeout(()=>{ if(currentSVG) fit(); },200); });
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select'))return;
  if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault(); e.shiftKey?redo():undo();}
  if(e.key==='Escape'){ if(linkMode)setLinkMode(false); else if(sheetView)closeSheet(); else select(null); }
  if(e.key==='Delete'||e.key==='Backspace'){ if(sel) deleteSel(); }
  if(e.key==='Enter'&&sel) openInspector();
});

(async function init(){
  const salvo=await store.get(THEME_KEY);
  const saved=await loadSaved();
  if(salvo==='light'||salvo==='dark'){ temaEscolhido=true; document.body.classList.toggle('light',salvo==='light'); }
  else if(saved&&saved.theme){ temaEscolhido=true; document.body.className=saved.theme; }
  else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)
    document.body.classList.add('light');
  $('#btnTheme').innerHTML=ico(temaAtual()==='light'?'moon':'sun');
  if(window.matchMedia){
    const mq=window.matchMedia('(prefers-color-scheme: light)');
    const seguir=e=>{ if(!temaEscolhido) setTheme(e.matches?'light':'dark'); };
    if(mq.addEventListener) mq.addEventListener('change',seguir); else if(mq.addListener) mq.addListener(seguir);
  }
  const ok=await bootMermaid();
  if(!ok){
    doc=templateFlow(); refreshChrome();
    showErr('Não consegui carregar a biblioteca Mermaid pelo CDN. O editor continua funcionando: você pode montar o diagrama e copiar o código pela aba Código, mas a pré-visualização fica indisponível.');
    setRail();
    return;
  }
  configMermaid();
  doc=(saved&&saved.doc)?saved.doc:templateFlow();
  if(!doc.groups)doc.groups=[]; if(!doc.classes)doc.classes=[];
  if(!doc.tables)doc.tables=[]; if(!doc.relations)doc.relations=[];
  refreshChrome(); updateUndoBtns(); await render(); setRail(); paintActionBar();
  if(!(saved&&saved.doc)) maybeCoach();
})();
</script>
