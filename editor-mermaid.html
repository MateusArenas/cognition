<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Editor Mermaid</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<style>
:root{
  /* iOS system colors — dark */
  --blue:#0A84FF; --red:#FF453A; --green:#30D158; --orange:#FF9F0A; --indigo:#5E5CE6;
  --ink:#000000;        /* fundo do app / canvas / fundo agrupado */
  --panel:#1C1C1E;      /* barras, linhas de lista, campos */
  --panel2:#2C2C2E;     /* preenchimento secundário */
  --panel3:#3A3A3C;     /* trilho de segmented, preenchido */
  --line:rgba(84,84,88,.55);
  --line2:rgba(84,84,88,.80);
  --txt:#FFFFFF;
  --muted:rgba(235,235,245,.62);
  --dim:rgba(235,235,245,.34);
  --amber:var(--blue); --cyan:var(--blue); --danger:var(--red); --ok:var(--green);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --cond:var(--sans);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.32,.72,0,1);
}
body.light{
  --blue:#007AFF; --red:#FF3B30; --green:#34C759; --orange:#FF9500; --indigo:#5856D6;
  --ink:#F2F2F7; --panel:#FFFFFF; --panel2:#FFFFFF; --panel3:#E5E5EA;
  --line:rgba(60,60,67,.24); --line2:rgba(60,60,67,.34);
  --txt:#000000; --muted:rgba(60,60,67,.60); --dim:rgba(60,60,67,.32);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:#000}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--ink);color:var(--txt);font-family:var(--sans);
  font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;
  letter-spacing:-.01em;
}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
#app{
  position:fixed;inset:0;display:flex;flex-direction:column;background:var(--ink);
  transform-origin:50% 0;
  transition:transform .55s var(--ease),border-radius .55s var(--ease);
}
body:has(#sheet.show) #app{transform:scale(.925) translateY(calc(var(--sat) + 8px));border-radius:14px;overflow:hidden}

/* ---------- barra de navegação ---------- */
#topbar{
  flex:0 0 auto;display:flex;align-items:center;gap:0;
  padding:calc(var(--sat) + 4px) 4px 4px;background:var(--panel);
  box-shadow:inset 0 -.5px 0 var(--line);
}
.icon{
  width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;
  background:transparent;border:0;border-radius:20px;color:var(--blue);cursor:pointer;
  transition:opacity .12s;
}
.icon:active{opacity:.4}
.icon[disabled]{opacity:.25;pointer-events:none}
.icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.title-wrap{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 2px}
#docName{
  background:transparent;border:0;padding:0;font-size:17px;font-weight:600;text-align:center;
  width:100%;text-overflow:ellipsis;outline:none;letter-spacing:-.02em;
}
#docName:focus{color:var(--blue)}
#docKind{font-size:11.5px;color:var(--muted);line-height:1.25;letter-spacing:0}

/* ---------- linha de estado ---------- */
#rail{
  flex:0 0 auto;height:27px;display:flex;align-items:center;justify-content:center;gap:7px;
  background:var(--panel);box-shadow:inset 0 -.5px 0 var(--line);padding:0 16px;
}
#railStripe{width:7px;height:7px;flex:0 0 7px;border-radius:50%;background:var(--dim);transition:background .2s}
#railText{
  flex:0 1 auto;min-width:0;font-size:12.5px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#railText b{color:var(--txt);font-weight:600}
#rail[data-mode="sel"] #railStripe{background:var(--blue)}
#rail[data-mode="sel"] #railText b{color:var(--blue)}
#rail[data-mode="link"] #railStripe{background:var(--orange);animation:blink 1.1s steps(2) infinite}
#rail[data-mode="link"] #railText{color:var(--orange)}
#rail[data-mode="link"] #railText b{color:var(--orange)}
#rail[data-mode="err"] #railStripe{background:var(--red)}
#rail[data-mode="err"] #railText{color:var(--red)}
@keyframes blink{0%{opacity:1}50%{opacity:.2}}

/* ---------- canvas ---------- */
#viewport{flex:1;position:relative;overflow:hidden;touch-action:none;background:var(--ink)}
#stage{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#host svg{display:block;max-width:none!important;height:auto}
#host .selbracket{stroke:var(--blue);fill:none;stroke-width:2.5;vector-effect:non-scaling-stroke;stroke-linecap:round}
#host .selglow{fill:var(--blue);opacity:.12}
#host .hitline{stroke:transparent;fill:none;stroke-width:26;stroke-linecap:round;cursor:pointer}
#host .hitbox{fill:transparent;cursor:pointer}
#host [data-sel-key]{cursor:pointer}
/* Reforço em tela: garante contraste mesmo se a versão do Mermaid usar outros nomes de classe. */
#host rect.attributeBoxOdd{fill:var(--panel2)!important}
#host rect.attributeBoxEven{fill:var(--panel3)!important}
#host rect.entityBox{fill:var(--panel)!important}
#host text.entityLabel,#host text.attributeLabel,#host .er.entityLabel,#host .er.attributeLabel{fill:var(--txt)!important}
#host .nodeLabel,#host .edgeLabel span,#host .cluster-label{color:var(--txt)}

#hud{position:absolute;top:12px;left:12px;display:flex;gap:8px;flex-wrap:wrap;max-width:70%}
.chip{
  background:color-mix(in srgb,var(--panel) 72%,transparent);
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border:.5px solid var(--line);color:var(--blue);border-radius:999px;
  padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer;
  box-shadow:0 1px 6px rgba(0,0,0,.14);transition:opacity .12s;
}
.chip.mono{font-family:var(--mono);font-size:12px;font-weight:400;color:var(--muted)}
.chip:active{opacity:.45}

#fabs{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.fab{
  width:48px;height:48px;border-radius:24px;display:grid;place-items:center;cursor:pointer;
  border:.5px solid var(--line);color:var(--blue);
  background:color-mix(in srgb,var(--panel) 74%,transparent);
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  box-shadow:0 3px 12px rgba(0,0,0,.20);transition:transform .14s var(--ease),opacity .12s;
}
.fab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fab.primary{
  width:56px;height:56px;border-radius:28px;background:var(--blue);color:#fff;border:0;
  box-shadow:0 5px 18px color-mix(in srgb,var(--blue) 45%,transparent);
}
.fab.primary svg{width:26px;height:26px}
.fab.on{background:var(--blue);color:#fff;border:0}
.fab:active{transform:scale(.92);opacity:.85}

#err{
  position:absolute;left:14px;right:14px;bottom:14px;padding:12px 14px;border-radius:14px;
  background:color-mix(in srgb,var(--red) 14%,var(--panel));border:.5px solid color-mix(in srgb,var(--red) 45%,transparent);
  color:var(--txt);font-family:var(--mono);font-size:12px;line-height:1.5;max-height:34%;overflow:auto;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
}
#empty{
  position:absolute;left:14px;right:14px;top:58px;padding:16px 18px 14px;border-radius:16px;
  display:flex;flex-direction:column;gap:5px;text-align:left;pointer-events:none;
  background:color-mix(in srgb,var(--panel) 80%,transparent);
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border:.5px solid var(--line);box-shadow:0 8px 28px rgba(0,0,0,.22);
  max-width:440px;margin:0 auto;animation:abIn .4s var(--ease);
}
#empty h2{font-size:17px;font-weight:600;margin:0;color:var(--txt);letter-spacing:-.02em}
#empty p{margin:0;color:var(--muted);font-size:14px;line-height:1.4}

/* ---------- documento markdown ---------- */
#mdroot{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--ink)}
#mdTop{padding:10px 16px 8px;background:var(--panel);box-shadow:inset 0 -.5px 0 var(--line)}
#mdSeg{background:var(--panel3);border-radius:9px;padding:2px;gap:2px;flex-wrap:nowrap;max-width:260px;margin:0 auto}
#mdSeg .pick{flex:1;justify-content:center;background:transparent;border:0;border-radius:7px;padding:7px 6px;font-size:14px;font-weight:500;color:var(--txt)}
#mdSeg .pick.sel{background:var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.22)}
#mdArea{
  flex:1;min-height:0;width:100%;background:transparent;border:0;outline:none;resize:none;
  padding:18px 18px 24px;font-size:17px;line-height:1.55;color:var(--txt);
  font-family:var(--sans);-webkit-text-fill-color:currentColor;caret-color:var(--blue);
}
#mdView{
  flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:18px 18px calc(28px + var(--sab));font-size:17px;line-height:1.6;
}
#mdBar{
  display:flex;gap:7px;overflow-x:auto;padding:8px 12px;background:var(--panel);
  box-shadow:inset 0 .5px 0 var(--line);scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
#mdBar::-webkit-scrollbar{display:none}
body.escrevendo #mdBar{position:fixed;left:0;right:0;bottom:var(--kb,0px);z-index:36}
body.escrevendo #tabs{opacity:0;pointer-events:none}

/* prosa renderizada */
#mdView h1,#mdView h2,#mdView h3,#mdView h4{margin:1.4em 0 .45em;line-height:1.25;letter-spacing:-.02em}
#mdView h1{font-size:27px;font-weight:700}
#mdView h2{font-size:22px;font-weight:700}
#mdView h3{font-size:19px;font-weight:600}
#mdView h4{font-size:17px;font-weight:600;color:var(--muted)}
#mdView>*:first-child{margin-top:0}
#mdView p{margin:0 0 1em}
#mdView a{color:var(--blue);text-decoration:none}
#mdView strong{font-weight:650}
#mdView del{color:var(--muted)}
#mdView mark{background:color-mix(in srgb,var(--orange) 35%,transparent);color:inherit;border-radius:3px;padding:0 3px}
#mdView code{font-family:var(--mono);font-size:.86em;background:var(--panel2);border-radius:5px;padding:2px 5px}
body.light #mdView code{background:var(--panel3)}
#mdView pre.mdcode{
  background:var(--panel);border-radius:12px;padding:14px;overflow-x:auto;margin:0 0 1.2em;
  font-family:var(--mono);font-size:13.5px;line-height:1.6;
}
body.light #mdView pre.mdcode{border:.5px solid var(--line)}
#mdView pre.mdcode code{background:none;padding:0;font-size:inherit}
#mdView blockquote{
  margin:0 0 1.2em;padding:2px 0 2px 15px;border-left:3px solid var(--blue);color:var(--muted);
}
#mdView ul,#mdView ol{margin:0 0 1.1em;padding-left:1.5em}
#mdView li{margin:.28em 0}
#mdView li.task{list-style:none;margin-left:-1.4em;display:flex;align-items:flex-start;gap:9px}
#mdView li.task .box{
  width:21px;height:21px;flex:0 0 21px;border-radius:11px;border:1.8px solid var(--line2);
  margin-top:1px;cursor:pointer;position:relative;
}
#mdView li.task .box.on{background:var(--blue);border-color:var(--blue)}
#mdView li.task .box.on::after{
  content:"";position:absolute;left:6px;top:3px;width:6px;height:11px;
  border:2.4px solid #fff;border-top:0;border-left:0;transform:rotate(42deg);border-radius:1px;
}
#mdView li.task.done{color:var(--muted)}
#mdView hr{border:0;height:.5px;background:var(--line2);margin:1.8em 0}
#mdView table{width:100%;border-collapse:collapse;margin:0 0 1.2em;font-size:15px;display:block;overflow-x:auto}
#mdView th,#mdView td{border:.5px solid var(--line2);padding:9px 11px;text-align:left}
#mdView th{background:var(--panel2);font-weight:600}
body.light #mdView th{background:var(--panel3)}
#mdView img{max-width:100%;border-radius:10px}
.mdmermaid{
  background:var(--panel);border-radius:14px;margin:0 0 1.3em;overflow:hidden;
}
body.light .mdmermaid{border:.5px solid var(--line)}
.mdmermaid .cab{
  display:flex;align-items:center;gap:8px;padding:9px 10px 9px 14px;
  box-shadow:inset 0 -.5px 0 var(--line);font-size:12.5px;color:var(--muted);
}
.mdmermaid .cab b{flex:1;font-weight:500;color:var(--muted)}
.mdmermaid .cab button{
  background:transparent;border:0;color:var(--blue);font-size:14px;padding:5px 9px;
  border-radius:8px;cursor:pointer;
}
.mdmermaid .cab button:active{background:var(--panel2)}
.mdmermaid .tela{padding:12px;overflow-x:auto;text-align:center}
.mdmermaid .tela svg{max-width:100%;height:auto}
.mdmermaid .falhou{padding:14px;font-family:var(--mono);font-size:12px;color:var(--danger);white-space:pre-wrap}

/* ---------- tab bar ---------- */
#tabs{
  flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--panel);box-shadow:inset 0 .5px 0 var(--line);padding-bottom:var(--sab);
}
.tab{
  background:transparent;border:0;padding:7px 2px 6px;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:var(--dim);cursor:pointer;transition:opacity .12s;
}
.tab svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:10px;font-weight:500;letter-spacing:.01em}
.tab.active{color:var(--blue)}
.tab:active{opacity:.5}

/* ---------- sheet ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.30);z-index:40;opacity:0;transition:opacity .4s var(--ease)}
#scrim.show{opacity:1}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--ink);
  border-radius:14px 14px 0 0;box-shadow:0 -1px 0 var(--line),0 -20px 60px rgba(0,0,0,.5);
  display:flex;flex-direction:column;max-height:92vh;
  transform:translateY(100%);transition:transform .5s var(--ease);
}
#sheet.show{transform:translateY(0)}
#sheetGrab{padding:6px 0 2px;display:grid;place-items:center;touch-action:none;cursor:grab}
#sheetGrab i{display:block;width:36px;height:5px;border-radius:3px;background:var(--line2)}
#sheetHead{display:flex;align-items:center;gap:8px;padding:6px 10px 10px 18px}
#sheetTitle{
  flex:1;min-width:0;font-size:20px;font-weight:700;letter-spacing:-.025em;color:var(--txt);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#sheetTag{
  font-family:var(--mono);font-size:11.5px;color:var(--muted);background:var(--panel3);
  border-radius:7px;padding:3px 7px;flex:0 0 auto;
}
#btnSheetClose{
  width:30px;height:30px;flex:0 0 30px;border-radius:15px;background:var(--panel3);color:var(--muted);
}
#btnSheetClose svg{width:15px;height:15px;stroke-width:2.6}
#sheetBody{
  overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:2px 16px calc(28px + var(--sab));flex:1;
}

/* ---------- átomos de formulário (inset grouped) ---------- */
.grp{margin-bottom:20px}
.lab{
  display:block;font-size:12.5px;font-weight:400;color:var(--muted);
  margin:0 0 7px;padding:0 4px;text-transform:uppercase;letter-spacing:.04em;
}
.sec{
  font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
  margin:26px 0 7px;padding:0 4px;font-weight:400;
}
.sec:first-child{margin-top:4px}
.hint{font-size:12.5px;color:var(--muted);margin:7px 0 0;padding:0 4px;line-height:1.4}
.fld{
  width:100%;background:var(--panel);border:.5px solid transparent;border-radius:11px;
  padding:12px 14px;outline:none;font-size:17px;
}
body.light .fld{border-color:var(--line)}
.fld:focus{border-color:var(--blue)}
textarea.fld{resize:vertical;min-height:76px;line-height:1.4}
.fld.mono{font-family:var(--mono);font-size:15px}
select.fld{-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 18px) 22px,calc(100% - 13px) 22px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.row{display:flex;gap:9px}
.row>*{flex:1;min-width:0}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.pick{
  background:var(--panel);border:1.5px solid transparent;border-radius:12px;padding:10px 13px;
  font-size:14px;color:var(--txt);cursor:pointer;display:flex;align-items:center;gap:7px;
  transition:transform .12s var(--ease);
}
body.light .pick{border-color:var(--line)}
.pick.sel{border-color:var(--blue);color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,var(--panel))}
.pick:active{transform:scale(.96)}
.pick svg{width:27px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}
.pick code{font-family:var(--mono);font-size:12px;opacity:.55}

/* segmented control */
#iaEscopo,#thm{background:var(--panel3);border-radius:9px;padding:2px;gap:2px;flex-wrap:nowrap}
#iaEscopo .pick,#thm .pick{flex:1;justify-content:center;background:transparent;border:0;border-radius:7px;padding:7px 6px;font-size:14px;font-weight:500;color:var(--txt)}
#iaEscopo .pick.sel,#thm .pick.sel{background:var(--panel);color:var(--txt);box-shadow:0 1px 4px rgba(0,0,0,.22)}

/* botões */
.btn{
  width:100%;padding:14px;border-radius:12px;border:0;background:var(--panel);
  color:var(--blue);font-size:17px;font-weight:400;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .12s;
}
.btn:active{opacity:.45}
.btn.acc{background:var(--blue);color:#fff;font-weight:600}
.btn.dan{color:var(--red)}
.btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn.sm{padding:12px;font-size:16px}
.btn[disabled]{opacity:.32;pointer-events:none}

/* listas agrupadas */
.list{display:flex;flex-direction:column;background:var(--panel);border-radius:12px;overflow:hidden}
.list>*+*{box-shadow:inset 0 .5px 0 var(--line)}
.list .btn,.list .item{border-radius:0;background:transparent}
.item{
  display:flex;align-items:center;gap:11px;padding:12px 15px;border:0;cursor:pointer;
  text-align:left;width:100%;transition:background .12s;
}
.item:active{background:var(--panel2)}
.item .k{
  font-family:var(--mono);font-size:11px;color:var(--muted);flex:0 0 auto;
  background:var(--panel3);border-radius:6px;padding:3px 6px;
}
.item .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.item .s{font-family:var(--mono);font-size:12px;color:var(--muted);flex:0 0 auto}
.item::after{
  content:"";flex:0 0 auto;width:7px;height:7px;margin-left:1px;
  border-right:2px solid var(--dim);border-top:2px solid var(--dim);
  transform:rotate(45deg);border-radius:1px;
}
.empty-note{color:var(--muted);font-size:15px;padding:14px 15px;margin:0}
#sheetBody::-webkit-scrollbar,#codeArea::-webkit-scrollbar{width:5px;height:5px}
#sheetBody::-webkit-scrollbar-thumb,#codeArea::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}

/* editor de colunas */
#cols.list,#clsList.list{background:transparent;border-radius:0;gap:9px}
#cols.list>*+*,#clsList.list>*+*{box-shadow:none}
.colrow{
  display:flex;gap:7px;align-items:center;background:var(--panel);
  border-radius:12px;padding:8px;
}
body.light .colrow{border:.5px solid var(--line)}
.colrow input{
  background:var(--panel2);border:1.5px solid transparent;border-radius:9px;padding:9px;
  min-width:0;font-family:var(--mono);font-size:14px;outline:none;
}
body.light .colrow input{background:var(--panel3)}
.colrow input:focus{border-color:var(--blue)}
.colrow .cty{flex:0 0 30%}
.colrow .cnm{flex:1}
.keychips{display:flex;gap:4px}
.kc{
  font-family:var(--mono);font-size:10.5px;border:0;border-radius:8px;padding:6px 6px;
  background:var(--panel3);color:var(--muted);cursor:pointer;min-width:30px;transition:opacity .12s;
}
.kc.on{background:var(--blue);color:#fff;font-weight:600}
.kc:active{opacity:.5}
.mini{
  width:34px;height:34px;flex:0 0 34px;border-radius:17px;border:0;background:var(--panel3);
  color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:opacity .12s;
}
.mini svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mini:active{opacity:.5}

#codeWrap{
  position:relative;border-radius:12px;overflow:hidden;background:var(--panel);
  border:1.5px solid transparent;transition:border-color .15s;
}
body.light #codeWrap{border-color:var(--line)}
#codeWrap.foco{border-color:var(--blue)}
#codeHL,#codeArea{
  margin:0;padding:14px;font-family:var(--mono);font-size:13.5px;line-height:1.62;
  white-space:pre;overflow-wrap:normal;word-break:normal;tab-size:2;letter-spacing:0;
  border:0;font-variant-ligatures:none;
}
#codeHL{
  position:absolute;inset:0;overflow:hidden;pointer-events:none;color:var(--txt);
}
#codeArea{
  position:relative;display:block;width:100%;min-height:46vh;background:transparent;
  color:transparent;caret-color:var(--blue);resize:vertical;outline:none;overflow:auto;
  -webkit-text-fill-color:transparent;
}
#codeArea::selection{background:color-mix(in srgb,var(--blue) 40%,transparent);-webkit-text-fill-color:transparent}
/* paleta de sintaxe */
.t-com{color:#6E7681;font-style:italic}
.t-str{color:#7BD88F}
.t-kw{color:#FF7AB2;font-weight:600}
.t-op,.t-card{color:#64D2FF}
.t-num{color:#FF9F0A}
.t-br{color:#8E8E93}
.t-pun{color:#9CA3AF}
body.light .t-com{color:#8A8F98}
body.light .t-str{color:#1E7F35}
body.light .t-kw{color:#A036C4}
body.light .t-op,body.light .t-card{color:#0062CC}
body.light .t-num{color:#B35A00}
body.light .t-br{color:#6E6E73}
body.light .t-pun{color:#6B7280}

#toast{
  position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translateX(-50%) scale(.94);z-index:80;
  background:rgba(28,28,30,.86);color:#fff;border:.5px solid rgba(255,255,255,.10);
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  padding:11px 20px;border-radius:999px;font-size:15px;font-weight:500;
  box-shadow:0 8px 30px rgba(0,0,0,.35);pointer-events:none;opacity:0;
  transition:opacity .25s var(--ease),transform .25s var(--ease);
}
#toast.show{opacity:1;transform:translateX(-50%) scale(1)}
/* ---------- barra de ações contextuais ---------- */
#actionbar{
  flex:0 0 auto;background:var(--panel);box-shadow:inset 0 .5px 0 var(--line);
  padding:9px 0 8px;animation:abIn .34s var(--ease);
}
@keyframes abIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
#abHead{display:flex;align-items:center;gap:9px;padding:0 10px 9px 16px}
#abDot{width:8px;height:8px;border-radius:4px;background:var(--blue);flex:0 0 8px}
#abTitle{flex:1;min-width:0;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#abTitle b{color:var(--txt);font-weight:600}
#abClose{width:28px;height:28px;flex:0 0 28px;border-radius:14px;background:var(--panel3);color:var(--muted)}
#abClose svg{width:14px;height:14px;stroke-width:2.6}
#abActions{display:flex;gap:8px;overflow-x:auto;padding:0 16px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#abActions::-webkit-scrollbar{display:none}
.act{
  flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  background:var(--panel2);border:0;border-radius:13px;padding:10px 10px 9px;min-width:70px;
  color:var(--blue);font-size:11px;font-weight:500;cursor:pointer;
  transition:transform .13s var(--ease),opacity .12s;
}
body.light .act{background:var(--panel3)}
.act svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.act:active{transform:scale(.93);opacity:.8}
.act.dan{color:var(--red)}
.act.go{background:var(--blue);color:#fff}

/* ---------- alerta / composer ---------- */
#alertWrap{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:24px 24px 26vh}
#alertScrim{position:absolute;inset:0;background:rgba(0,0,0,.38);opacity:0;transition:opacity .26s var(--ease)}
#alertWrap.show #alertScrim{opacity:1}
#alertBox{
  position:relative;width:100%;max-width:292px;border-radius:16px;overflow:hidden;
  background:color-mix(in srgb,var(--panel) 90%,transparent);
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  box-shadow:0 24px 64px rgba(0,0,0,.45);
  transform:scale(1.14);opacity:0;transition:transform .3s var(--ease),opacity .22s;
}
#alertWrap.show #alertBox{transform:scale(1);opacity:1}
#alertTitle{margin:0;padding:19px 18px 0;font-size:17px;font-weight:600;text-align:center;letter-spacing:-.02em}
#alertMsg{margin:0;padding:5px 18px 0;font-size:13px;color:var(--muted);text-align:center;line-height:1.42}
#alertFields{padding:15px 16px 16px;display:flex;flex-direction:column;gap:11px}
#alertFields:empty{padding:12px 0 0}
.afield{
  width:100%;background:var(--panel2);border:1.5px solid var(--line2);border-radius:9px;
  padding:10px 12px;font-size:16px;outline:none;resize:none;font-family:inherit;line-height:1.35;
}
body.light .afield{background:#fff}
.afield.mono{font-family:var(--mono);font-size:15px}
.afield:focus{border-color:var(--blue)}
.ashapes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.ashape{background:var(--panel2);border:1.5px solid transparent;border-radius:10px;padding:8px 9px;cursor:pointer;color:var(--muted)}
body.light .ashape{background:var(--panel3)}
.ashape.sel{border-color:var(--blue);color:var(--blue)}
.ashape svg{width:27px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;display:block}
#alertBtns{display:flex;flex-direction:column;border-top:.5px solid var(--line2)}
#alertBtns.two{flex-direction:row}
.abtn{background:transparent;border:0;padding:13px 8px;font-size:17px;color:var(--blue);cursor:pointer;flex:1;min-width:0}
#alertBtns:not(.two) .abtn+.abtn{border-top:.5px solid var(--line2)}
#alertBtns.two .abtn+.abtn{border-left:.5px solid var(--line2)}
.abtn.primary{font-weight:600}
.abtn.cancel{color:var(--muted)}
.abtn.dan{color:var(--red)}
.abtn:active{background:var(--panel2)}

/* ---------- coach de primeira abertura ---------- */
#coach{
  position:absolute;left:16px;right:16px;bottom:16px;padding:18px 18px 14px;border-radius:18px;
  background:color-mix(in srgb,var(--panel) 84%,transparent);
  -webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
  border:.5px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.35);
  animation:abIn .5s var(--ease);max-width:420px;margin:0 auto;
}
.crow{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.crow span{
  width:24px;height:24px;flex:0 0 24px;border-radius:12px;background:var(--blue);color:#fff;
  display:grid;place-items:center;font-size:12px;font-weight:600;
}
.crow p{margin:0;font-size:14.5px;color:var(--txt);line-height:1.3}
#coachOk{
  width:100%;margin-top:4px;padding:12px;border:0;border-radius:11px;background:var(--blue);color:#fff;
  font-size:16px;font-weight:600;cursor:pointer;
}
#coachOk:active{opacity:.7}

/* ---------- estado vazio acionável ---------- */
.ebtns{display:flex;gap:8px;margin-top:12px;pointer-events:auto}
.ebtn{
  flex:1;padding:11px 12px;border-radius:11px;border:.5px solid var(--line);background:var(--panel2);
  color:var(--blue);font-size:15px;font-weight:500;cursor:pointer;white-space:nowrap;
}
body.light .ebtn{background:var(--panel3);border-color:transparent}
.ebtn.go{background:var(--blue);color:#fff;border:0;font-weight:600}
.ebtn:active{opacity:.6}

/* ---------- galeria de modelos ---------- */
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:8px}
.tpl{display:flex;align-items:center;background:var(--panel);border-radius:12px;overflow:hidden}
body.light .tpl{border:.5px solid var(--line)}
.tplName{
  flex:1;min-width:0;text-align:left;background:transparent;border:0;cursor:pointer;
  padding:12px 2px 12px 13px;font-size:14.5px;color:var(--txt);
  display:flex;flex-direction:column;gap:2px;transition:opacity .12s;
}
.tplName span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tplName i{font-style:normal;font-size:9.5px;color:var(--blue);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.tplName:active{opacity:.45}
.tplInfo{
  width:34px;height:34px;flex:0 0 34px;margin-right:5px;border-radius:17px;border:0;
  background:transparent;color:var(--blue);display:grid;place-items:center;cursor:pointer;
}
.tplInfo svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round}
.tplInfo:active{background:var(--panel2)}
.infoKw{
  font-family:var(--mono);font-size:11.5px;color:var(--muted);background:var(--panel2);
  border-radius:7px;padding:4px 9px;align-self:center;
}
body.light .infoKw{background:var(--panel3)}
.infoP{margin:0;font-size:13.5px;line-height:1.45;color:var(--muted);text-align:left}
.infoP b{color:var(--txt);font-weight:600;display:block;margin-bottom:2px}
.infoP.ok{color:var(--green)}

/* ---------- busca na lista ---------- */
#elSearch{
  margin-bottom:4px;background:var(--panel3);border:0;border-radius:10px;padding:10px 13px;
  font-size:16px;width:100%;outline:none;
}
.spin{
  width:15px;height:15px;border-radius:50%;border:2px solid currentColor;border-top-color:transparent;
  display:inline-block;animation:gira .7s linear infinite;vertical-align:-2px;
}
@keyframes gira{to{transform:rotate(360deg)}}
.iaAlvo{
  font-family:var(--mono);font-size:12px;color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,transparent);
  border-radius:8px;padding:8px 11px;margin:0 0 4px;line-height:1.4;
}
.swatch{width:22px;height:22px;border-radius:7px;border:.5px solid var(--line2);flex:0 0 22px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app">
  <header id="topbar">
    <button class="icon" id="btnMenu" aria-label="Abrir menu"></button>
    <div class="title-wrap">
      <input id="docName" value="Sem título" spellcheck="false" aria-label="Nome do diagrama">
      <span id="docKind">Fluxograma</span>
    </div>
    <button class="icon" id="btnTheme" aria-label="Alternar tema"></button>
    <button class="icon" id="btnUndo" aria-label="Desfazer"></button>
    <button class="icon" id="btnRedo" aria-label="Refazer"></button>
  </header>

  <div id="rail" data-mode="idle"><div id="railStripe"></div><div id="railText"></div></div>

  <main id="viewport">
    <div id="stage"><div id="host"></div></div>
    <div id="empty" hidden>
      <h2>Tela em branco</h2>
      <p>Crie a primeira etapa ou comece de um modelo pronto.</p>
      <div class="ebtns">
        <button class="ebtn go" id="eNew">Criar primeira etapa</button>
        <button class="ebtn" id="eTpl">Usar um modelo</button>
      </div>
    </div>
    <div id="hud">
      <button class="chip" id="btnFit">Ajustar</button>
      <button class="chip mono" id="zoomLbl">100%</button>
      <button class="chip" id="btnVoltaMd" hidden>Voltar ao documento</button>
    </div>
    <div id="fabs">
      <button class="fab" id="btnAI" aria-label="Pedir para a IA"></button>
      <button class="fab primary" id="btnAdd" aria-label="Adicionar elemento"></button>
    </div>
    <div id="coach" hidden>
      <div class="crow"><span>1</span><p>Toque num elemento para agir sobre ele</p></div>
      <div class="crow"><span>2</span><p>Dois dedos dão zoom, um dedo arrasta</p></div>
      <div class="crow"><span>3</span><p>O botão + cria a próxima etapa</p></div>
      <button id="coachOk">Começar</button>
    </div>
    <div id="err" hidden></div>
  </main>

  <section id="mdroot" hidden>
    <div id="mdTop">
      <div id="mdSeg" class="chips">
        <button class="pick sel" data-m="edit">Escrever</button>
        <button class="pick" data-m="read">Ler</button>
      </div>
    </div>
    <textarea id="mdArea" placeholder="Comece a escrever…" spellcheck="true"></textarea>
    <div id="mdView" hidden></div>
    <div id="mdBar"></div>
  </section>

  <div id="actionbar" hidden>
    <div id="abHead">
      <span id="abDot"></span>
      <span id="abTitle"></span>
      <button class="icon" id="abClose" aria-label="Cancelar seleção"></button>
    </div>
    <div id="abActions"></div>
  </div>

  <nav id="tabs">
    <button class="tab active" data-tab="canvas"><span>Diagrama</span></button>
    <button class="tab" data-tab="elements"><span>Elementos</span></button>
    <button class="tab" data-tab="code"><span>Código</span></button>
    <button class="tab" data-tab="style"><span>Estilo</span></button>
  </nav>
</div>

<div id="scrim" hidden></div>
<section id="sheet" hidden aria-modal="true" role="dialog">
  <div id="sheetGrab"><i></i></div>
  <div id="sheetHead">
    <div id="sheetTitle">Painel</div>
    <div id="sheetTag" hidden></div>
    <button class="icon" id="btnSheetClose" aria-label="Fechar painel"></button>
  </div>
  <div id="sheetBody"></div>
</section>
<div id="alertWrap" hidden>
  <div id="alertScrim"></div>
  <div id="alertBox" role="dialog" aria-modal="true">
    <h3 id="alertTitle"></h3>
    <p id="alertMsg"></p>
    <div id="alertFields"></div>
    <div id="alertBtns"></div>
  </div>
</div>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".mmd,.mermaid,.md,.markdown,.txt,text/plain" hidden>

/* =====================================================================
   2. MODELO DE DADOS
   Tudo no editor opera sobre este objeto. O texto Mermaid é apenas
   uma projeção (serialize) e uma entrada (parse). Nunca editamos texto
   com regex durante a interação — só na importação.
   ===================================================================== */
const SHAPES={
  rect:      {nome:'Retângulo', open:'[',   close:']'},
  round:     {nome:'Arredondado',open:'(',  close:')'},
  stadium:   {nome:'Pílula',    open:'([',  close:'])'},
  subroutine:{nome:'Sub-rotina',open:'[[',  close:']]'},
  cylinder:  {nome:'Banco',     open:'[(',  close:')]'},
  circle:    {nome:'Círculo',   open:'((',  close:'))'},
  doublecirc:{nome:'Duplo',     open:'(((', close:')))'},
  rhombus:   {nome:'Decisão',   open:'{',   close:'}'},
  hexagon:   {nome:'Hexágono',  open:'{{',  close:'}}'},
  parallel:  {nome:'Dados',     open:'[/',  close:'/]'},
  parallelR: {nome:'Dados inv.',open:'[\\', close:'\\]'},
  trapez:    {nome:'Trapézio',  open:'[/',  close:'\\]'},
  trapezR:   {nome:'Trapézio inv.',open:'[\\',close:'/]'}
};
const LINKS={
  arrow:  {nome:'Seta',        op:'-->'},
  open:   {nome:'Linha',       op:'---'},
  dotted: {nome:'Tracejada',   op:'-.->'},
  dottedO:{nome:'Tracej. aberta',op:'-.-'},
  thick:  {nome:'Grossa',      op:'==>'},
  thickO: {nome:'Grossa aberta',op:'==='},
  cross:  {nome:'Cruz',        op:'--x'},
  circleE:{nome:'Círculo',     op:'--o'},
  bi:     {nome:'Bidirecional',op:'<-->'}
};
const OP2LINK=Object.fromEntries(Object.entries(LINKS).map(([k,v])=>[v.op,k]));
const CARD_L={'||':'Exatamente 1','|o':'Zero ou 1','}o':'Zero ou N','}|':'1 ou N'};
const CARD_R={'||':'Exatamente 1','o|':'Zero ou 1','o{':'Zero ou N','|{':'1 ou N'};

let doc=null;            // documento atual
let sel=null;            // {kind:'node'|'edge'|'table'|'rel', id}
let linkMode=false, linkFrom=null;
let undoStack=[], redoStack=[];

const uid=p=>p+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));

function blankFlow(nome){
  return {tipo:'flow',nome:nome||'Novo fluxograma',direction:'TD',
          nodes:[],edges:[],groups:[],classes:[],tables:[],relations:[]};
}
function blankRaw(nome,kind,code){
  return {tipo:'raw',nome:nome||'Diagrama',kind:kind||'Código Mermaid',code:code||'',
          direction:'TD',nodes:[],edges:[],groups:[],classes:[],tables:[],relations:[]};
}
function blankER(nome){
  return {tipo:'er',nome:nome||'Novo modelo relacional',direction:'TD',
          nodes:[],edges:[],groups:[],classes:[],tables:[],relations:[]};
}
const nodeById=id=>doc.nodes.find(n=>n.id===id);
const tableById=id=>doc.tables.find(t=>t.id===id);
const edgeById=id=>doc.edges.find(e=>e.id===id);
function colunaDe(s){
  if(!s||s.kind!=='col') return null;
  const partes=String(s.id).split('#');
  const t=tableById(partes[0]); if(!t) return null;
  const i=+partes[1];
  const col=t.cols[i]; if(!col) return null;
  return {tab:t,col,idx:i};
}
const relById=id=>doc.relations.find(r=>r.id===id);
function freeId(base){
  let i=1,id;
  do{ id=base+i; i++; }while(doc.nodes.some(n=>n.id===id)||doc.tables.some(t=>t.id===id));
  return id;
}

/* =====================================================================
   3. SERIALIZAÇÃO  (modelo -> texto Mermaid)
   ===================================================================== */
function q(s){
  s=(s==null?'':String(s));
  return '"'+s.replace(/"/g,'#quot;').replace(/\n/g,'<br/>')+'"';
}
const slug=s=>String(s||'').trim().replace(/\s+/g,'_').replace(/[^\w\-]/g,'')||'x';

function serialize(d){
  if(d.tipo==='md')  return d.md||'';
  if(d.tipo==='raw') return d.code||'';
  return d.tipo==='er'?serializeER(d):serializeFlow(d);
}
function serializeFlow(d){
  const L=['flowchart '+(d.direction||'TD')];
  const inGroup=new Set();
  (d.groups||[]).forEach(g=>g.nodes.forEach(n=>inGroup.add(n)));
  const decl=n=>{
    const s=SHAPES[n.shape]||SHAPES.rect;
    return '    '+n.id+s.open+q(n.label)+s.close;
  };
  d.nodes.filter(n=>!inGroup.has(n.id)).forEach(n=>L.push(decl(n)));
  (d.groups||[]).forEach(g=>{
    L.push('    subgraph '+g.id+'['+q(g.label)+']');
    if(g.direction) L.push('        direction '+g.direction);
    g.nodes.forEach(id=>{const n=nodeByIdIn(d,id); if(n) L.push('    '+decl(n));});
    L.push('    end');
  });
  d.edges.forEach(e=>{
    const op=(LINKS[e.type]||LINKS.arrow).op;
    L.push('    '+e.from+' '+op+(e.label?'|'+q(e.label)+'|':'')+' '+e.to);
  });
  (d.classes||[]).forEach(c=>{
    const parts=[];
    if(c.fill)   parts.push('fill:'+c.fill);
    if(c.stroke) parts.push('stroke:'+c.stroke);
    if(c.color)  parts.push('color:'+c.color);
    parts.push('stroke-width:'+(c.width||2)+'px');
    L.push('    classDef '+c.id+' '+parts.join(','));
    const alvos=d.nodes.filter(n=>n.cls===c.id).map(n=>n.id);
    if(alvos.length) L.push('    class '+alvos.join(',')+' '+c.id);
  });
  return L.join('\n');
}
const nodeByIdIn=(d,id)=>d.nodes.find(n=>n.id===id);

function serializeER(d){
  const L=['erDiagram'];
  d.tables.forEach(t=>{
    if(!t.cols.length){ L.push('    '+t.id+' {}'); return; }
    L.push('    '+t.id+' {');
    t.cols.forEach(c=>{
      let ln='        '+slug(c.type||'string')+' '+slug(c.name||'campo');
      if(c.keys&&c.keys.length) ln+=' '+c.keys.join(',');
      if(c.note) ln+=' '+q(c.note).replace(/<br\/>/g,' ');
      L.push(ln);
    });
    L.push('    }');
  });
  d.relations.forEach(r=>{
    L.push('    '+r.from+' '+r.cardL+(r.identifying===false?'..':'--')+r.cardR+' '+r.to+
           ' : '+q(r.label||'').replace(/<br\/>/g,' '));
  });
  return L.join('\n');
}

/* =====================================================================
   4. PARSING  (texto Mermaid -> modelo)
   Cobre o subconjunto que o editor gera + a maior parte do que se
   escreve à mão: flowchart/graph, subgraphs, classDef/class, style,
   e erDiagram com blocos de colunas.
   ===================================================================== */
function unq(s){
  s=String(s==null?'':s).trim();
  if((s.startsWith('"')&&s.endsWith('"'))||(s.startsWith("'")&&s.endsWith("'"))) s=s.slice(1,-1);
  return s.replace(/#quot;/g,'"').replace(/<br\s*\/?>/gi,'\n').trim();
}
const SHAPE_PATTERNS=[
  ['doublecirc',/^([A-Za-z0-9_\-]+)\(\(\(([\s\S]*)\)\)\)$/],
  ['circle',    /^([A-Za-z0-9_\-]+)\(\(([\s\S]*)\)\)$/],
  ['subroutine',/^([A-Za-z0-9_\-]+)\[\[([\s\S]*)\]\]$/],
  ['cylinder',  /^([A-Za-z0-9_\-]+)\[\(([\s\S]*)\)\]$/],
  ['stadium',   /^([A-Za-z0-9_\-]+)\(\[([\s\S]*)\]\)$/],
  ['hexagon',   /^([A-Za-z0-9_\-]+)\{\{([\s\S]*)\}\}$/],
  ['trapez',    /^([A-Za-z0-9_\-]+)\[\/([\s\S]*)\\\]$/],
  ['trapezR',   /^([A-Za-z0-9_\-]+)\[\\([\s\S]*)\/\]$/],
  ['parallel',  /^([A-Za-z0-9_\-]+)\[\/([\s\S]*)\/\]$/],
  ['parallelR', /^([A-Za-z0-9_\-]+)\[\\([\s\S]*)\\\]$/],
  ['rect',      /^([A-Za-z0-9_\-]+)\[([\s\S]*)\]$/],
  ['round',     /^([A-Za-z0-9_\-]+)\(([\s\S]*)\)$/],
  ['rhombus',   /^([A-Za-z0-9_\-]+)\{([\s\S]*)\}$/]
];
const OP_RE=/\s*(<-->|-\.->|-\.-|<==>|==>|===|--x|--o|-->|---|--|==)\s*/;
const PLAIN=new Set(['--','-.-','===','==','---']);
const ARROW=new Set(['-->','-.->','==>','--x','--o','<-->','<==>']);

function normalizeOps(s){
  return s.replace(/-\.{1,}-+>/g,'-.->').replace(/-\.{1,}-(?![>])/g,'-.-')
          .replace(/={3,}>/g,'==>').replace(/-{3,}>/g,'-->')
          .replace(/-{4,}(?![>ox])/g,'---');
}

function parseMermaid(text){
  const raw=String(text||'').split('\n');
  const lines=[];
  for(let l of raw){
    l=l.replace(/%%[\s\S]*$/,'').trim();
    if(l) lines.push(l);
  }
  if(!lines.length) throw new Error('Código vazio.');
  if(/^erDiagram\b/i.test(lines[0])) return parseER(lines);
  if(/^(flowchart|graph)\b/i.test(lines[0])) return parseFlow(lines);
  // Qualquer outro tipo de diagrama entra em modo código: renderiza e edita
  // pelo texto, sem modelo visual por trás.
  return blankRaw(doc?doc.nome:'Diagrama',detectarTipo(lines[0]),String(text));
}

function parseFlow(lines){
  const d=blankFlow(doc?doc.nome:'Importado');
  const m=/^(?:flowchart|graph)\s+(TB|TD|BT|LR|RL)/i.exec(lines[0]);
  d.direction=m?m[1].toUpperCase():'TD';
  const stack=[];
  const ensure=(tok,shapeHint)=>{
    tok=String(tok||'').trim();
    if(!tok) return null;
    let id=tok,label=null,shape=null;
    for(const [k,re] of SHAPE_PATTERNS){
      const mm=re.exec(tok);
      if(mm){ id=mm[1]; label=unq(mm[2]); shape=k; break; }
    }
    if(!/^[A-Za-z0-9_\-]+$/.test(id)) return null;
    let n=d.nodes.find(x=>x.id===id);
    if(!n){ n={id,label:label!=null?label:id,shape:shape||shapeHint||'rect',cls:null}; d.nodes.push(n); }
    else if(shape){ n.label=label; n.shape=shape; }
    const g=stack[stack.length-1];
    if(g&&!g.nodes.includes(n.id)) g.nodes.push(n.id);
    return n;
  };
  for(let i=1;i<lines.length;i++){
    let ln=lines[i];
    if(/^end\b/i.test(ln)){ stack.pop(); continue; }
    let mm;
    if(mm=/^subgraph\s+([A-Za-z0-9_\-]+)\s*\[([\s\S]*)\]$/i.exec(ln)){
      const g={id:mm[1],label:unq(mm[2]),nodes:[],direction:null}; d.groups.push(g); stack.push(g); continue;
    }
    if(mm=/^subgraph\s+(.+)$/i.exec(ln)){
      const nm=unq(mm[1]); const g={id:'sg'+(d.groups.length+1),label:nm,nodes:[],direction:null};
      d.groups.push(g); stack.push(g); continue;
    }
    if(mm=/^direction\s+(TB|TD|BT|LR|RL)/i.exec(ln)){
      if(stack.length) stack[stack.length-1].direction=mm[1].toUpperCase(); else d.direction=mm[1].toUpperCase();
      continue;
    }
    if(mm=/^classDef\s+([A-Za-z0-9_\-]+)\s+(.+)$/i.exec(ln)){
      const c={id:mm[1],fill:null,stroke:null,color:null,width:2};
      mm[2].split(',').forEach(p=>{
        const [k,v]=p.split(':').map(s=>s&&s.trim());
        if(k==='fill')c.fill=v; if(k==='stroke')c.stroke=v; if(k==='color')c.color=v;
        if(k==='stroke-width')c.width=parseFloat(v)||2;
      });
      if(!d.classes.some(x=>x.id===c.id)) d.classes.push(c);
      continue;
    }
    if(mm=/^class\s+([A-Za-z0-9_,\-\s]+)\s+([A-Za-z0-9_\-]+)$/i.exec(ln)){
      const cls=mm[2];
      mm[1].split(',').map(s=>s.trim()).forEach(id=>{const n=ensure(id); if(n)n.cls=cls;});
      continue;
    }
    if(/^(style|linkStyle|click|accTitle|accDescr)\b/i.test(ln)) continue;

    const parts=normalizeOps(ln).split(OP_RE).map(s=>s==null?'':s.trim());
    if(parts.length===1){ ensure(parts[0]); continue; }
    let idx=0, prev=ensure(parts[0]);
    while(idx+2<parts.length){
      let op=parts[idx+1], next=parts[idx+2], label=null, step=2;
      if(PLAIN.has(op)&&parts[idx+3]&&ARROW.has(parts[idx+3])){
        label=unq(next); op=parts[idx+3]; next=parts[idx+4]||''; step=4;
      }
      const pm=/^\|([^|]*)\|\s*([\s\S]*)$/.exec(next);
      if(pm){ label=unq(pm[1]); next=pm[2].trim(); }
      const to=ensure(next);
      if(prev&&to) d.edges.push({id:uid('e'),from:prev.id,to:to.id,label:label||'',type:OP2LINK[op]||'arrow'});
      prev=to; idx+=step;
    }
  }
  d.groups=d.groups.filter(g=>g.nodes.length);
  return d;
}

function parseER(lines){
  const d=blankER(doc?doc.nome:'Importado');
  const ensureT=name=>{
    const id=slug(name);
    let t=d.tables.find(x=>x.id===id);
    if(!t){ t={id,label:id,cols:[]}; d.tables.push(t); }
    return t;
  };
  let cur=null;
  for(let i=1;i<lines.length;i++){
    const ln=lines[i];
    if(cur){
      if(/^\}/.test(ln)){ cur=null; continue; }
      const toks=ln.match(/"[^"]*"|\S+/g)||[];
      if(toks.length<2) continue;
      const col={type:toks[0],name:toks[1],keys:[],note:''};
      for(let k=2;k<toks.length;k++){
        const t=toks[k];
        if(/^"/.test(t)) col.note=unq(t);
        else t.split(',').forEach(x=>{ x=x.trim().toUpperCase(); if(['PK','FK','UK'].includes(x)) col.keys.push(x); });
      }
      cur.cols.push(col); continue;
    }
    let mm;
    if(mm=/^([A-Za-z0-9_\-]+)(?:\[[^\]]*\])?\s*\{\s*\}?$/.exec(ln)){
      const t=ensureT(mm[1]); if(!/\}\s*$/.test(ln)) cur=t; continue;
    }
    if(mm=/^(\S+)\s+(\S\S)(--|\.\.)(\S\S)\s+(\S+)\s*:\s*([\s\S]*)$/.exec(ln)){
      const a=ensureT(mm[1]), b=ensureT(mm[5]);
      d.relations.push({id:uid('r'),from:a.id,to:b.id,cardL:mm[2],cardR:mm[4],
                        identifying:mm[3]==='--',label:unq(mm[6])});
      continue;
    }
    if(mm=/^([A-Za-z0-9_\-]+)$/.exec(ln)) ensureT(mm[1]);
  }
  return d;
}

function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=src; s.onload=res; s.onerror=()=>rej(new Error('falhou '+src));
    document.head.appendChild(s);
  });
}
let mermaidVersao='';
async function bootMermaid(){
  for(const u of CDNS){
    try{
      await loadScript(u);
      if(window.mermaid){ mermaidVersao=(u.match(/mermaid\/([\d.]+)\//)||[])[1]||'?'; return true; }
    }catch(e){}
  }
  return false;
}

const host=$('#host'), stage=$('#stage'), viewport=$('#viewport');
let renderSeq=0, currentSVG=null, pendingRender=null, lastCode='';

async function render(){
  if(doc.tipo==='md'){
    $('#viewport').hidden=true; $('#mdroot').hidden=false;
    montarMd();
    const ta=$('#mdArea');
    if(ta&&document.activeElement!==ta&&ta.value!==doc.md) ta.value=doc.md;
    aplicarModoMd(); setRail(); atualizarVolta();
    return;
  }
  $('#viewport').hidden=false; $('#mdroot').hidden=true;
  atualizarVolta();
  const code=serialize(doc);
  lastCode=code;
  const ca=$('#codeArea'); if(ca&&document.activeElement!==ca) definirCodigo(code);
  const nEls=doc.tipo==='raw'?(doc.code||'').trim().length
            :(doc.tipo==='er'?doc.tables.length:doc.nodes.length);
  $('#empty').hidden=nEls>0;
  if(!nEls){ host.innerHTML=''; currentSVG=null; setRail(); return; }
  if(!window.mermaid){ showErr('Não consegui carregar a biblioteca Mermaid. Verifique a conexão e recarregue.'); return; }
  const id='mmd'+(++renderSeq);
  try{
    let out=null, falha=null;
    try{ out=await window.mermaid.render(id,code); }
    catch(e1){
      falha=e1;
      /* Se o themeCSS não for aceito pela versão do Mermaid carregada, desenhar
         sem ele é muito melhor do que não desenhar nada. */
      if(usarThemeCSS){
        usarThemeCSS=false; configMermaid();
        try{ out=await window.mermaid.render(id+'r',code); falha=null; }
        catch(e2){ usarThemeCSS=true; configMermaid(); }
      }
    }
    if(falha) throw falha;
    host.innerHTML=(out&&out.svg)||out;
    const tmp=document.getElementById('d'+id); if(tmp) tmp.remove();
    const tmp2=document.getElementById('d'+id+'r'); if(tmp2) tmp2.remove();
    currentSVG=host.querySelector('svg');
    if(currentSVG){
      currentSVG.removeAttribute('style');
      currentSVG.style.maxWidth='none';
      currentSVG.style.overflow='visible';
    }
    tagTargets();
    drawSelection();
    hideErr();
    if(!viewInit){ fit(); viewInit=true; } else applyView();
  }catch(e){
    const tmp=document.getElementById('d'+id); if(tmp) tmp.remove();
    document.querySelectorAll('body > svg[id^="mmd"], body > div[id^="dmmd"]').forEach(n=>n.remove());
    showErr('Mermaid recusou o código:\n'+(e&&e.message?e.message:e));
  }
}
function showErr(msg){
  const e=$('#err'); e.hidden=false; e.textContent=msg;
  if(doc&&doc.tipo==='raw')
    e.textContent=msg+String.fromCharCode(10)+String.fromCharCode(10)+
      'Se o tipo for recente (venn, ishikawa, treeView, radar, treemap), a versão do Mermaid carregada aqui pode ainda não conhecê-lo.';
  e.onclick=()=>{ const t=$$('.tab').find(x=>x.dataset.tab==='code'); if(t) t.click(); };
  setRail('err','Erro de sintaxe · toque para abrir o código');
}
function hideErr(){ $('#err').hidden=true; setRail(); }

/* --- mapeia elementos do SVG para o modelo (data-sel-key) --- */
const SVGNS='http://www.w3.org/2000/svg';
const limpaTxt=t=>String(t||'').replace(/\s+/g,'').toLowerCase();

function retanguloDeToque(c,chave,svgPt){
  const a=svgPt(c.left,c.top), b=svgPt(c.right,c.bottom);
  const r=document.createElementNS(SVGNS,'rect');
  r.setAttribute('x',Math.min(a.x,b.x));     r.setAttribute('y',Math.min(a.y,b.y));
  r.setAttribute('width',Math.abs(b.x-a.x)); r.setAttribute('height',Math.abs(b.y-a.y));
  r.setAttribute('class','hitbox');
  r.dataset.selKey=chave;
  return r;
}

/* Quando o grupo do SVG não envolve a entidade inteira, reconstrói o contorno
   juntando as formas empilhadas que compartilham a coluna do cabeçalho. */
function blocoPorFormas(hb){
  const cand=[...host.querySelectorAll('rect,path,polygon')]
    .filter(e=>!/relationshipLine|flowchart-link|edge/i.test(e.getAttribute('class')||''))
    .map(e=>e.getBoundingClientRect())
    .filter(b=>b.width>12&&b.height>4);
  if(!cand.length) return null;
  let c={left:hb.left,right:hb.right,top:hb.top,bottom:hb.bottom}, mudou=true, voltas=0;
  while(mudou&&voltas++<8){
    mudou=false;
    cand.forEach(b=>{
      const larguraC=c.right-c.left;
      const sobrepoe=Math.min(b.right,c.right)-Math.max(b.left,c.left);
      if(sobrepoe<=Math.min(b.width,larguraC)*0.5) return;
      if(b.top>c.bottom+8||b.bottom<c.top-8) return;
      const nl=Math.min(c.left,b.left), nr=Math.max(c.right,b.right);
      const nt=Math.min(c.top,b.top),  nb=Math.max(c.bottom,b.bottom);
      if(nl!==c.left||nr!==c.right||nt!==c.top||nb!==c.bottom){
        c={left:nl,right:nr,top:nt,bottom:nb}; mudou=true;
      }
    });
  }
  return c;
}

/* Mapeia o ER em duas camadas de toque: a entidade inteira e, por cima, uma
   faixa por coluna. Tudo por geometria, sem depender de como a versão do
   Mermaid organiza os grupos. */
function mapearER(){
  if(!currentSVG||!doc.tables.length) return false;
  const raiz=currentSVG.getScreenCTM(); if(!raiz) return false;
  const inv=raiz.inverse();
  const svgPt=(x,y)=>{ const p=currentSVG.createSVGPoint(); p.x=x; p.y=y; return p.matrixTransform(inv); };

  const textos=[...host.querySelectorAll('text')];
  const nomes=doc.tables.map(t=>limpaTxt(t.id));
  const camadaTab=document.createElementNS(SVGNS,'g'); camadaTab.setAttribute('class','hitlayer');
  const camadaCol=document.createElementNS(SVGNS,'g'); camadaCol.setAttribute('class','hitlayer');
  const usados=new Set();
  let achou=0;

  doc.tables.forEach(tab=>{
    const alvo=limpaTxt(tab.id);
    const cab=textos.find(t=>!usados.has(t)&&limpaTxt(t.textContent)===alvo);
    if(!cab) return;
    usados.add(cab);
    const hb=cab.getBoundingClientRect();
    if(!hb.width) return;

    /* Sobe pelos grupos enquanto nenhum outro nome de tabela aparecer dentro.
       A comparação é por texto exato, então ITEM_PEDIDO não é confundido com PEDIDO. */
    let melhor=null, g=cab.parentNode;
    while(g&&g.nodeName==='g'){
      const temOutra=[...g.querySelectorAll('text')].some(t=>{
        const v=limpaTxt(t.textContent);
        return v!==alvo&&nomes.indexOf(v)>=0;
      });
      if(temOutra) break;
      melhor=g; g=g.parentNode;
    }
    let cx=melhor?melhor.getBoundingClientRect():hb;
    if(tab.cols.length&&cx.height<hb.height*1.6){
      const geo=blocoPorFormas(hb);
      if(geo&&geo.bottom-geo.top>cx.height) cx=geo;
    }
    if(cx.width<10||cx.height<10) return;
    achou++;
    camadaTab.appendChild(retanguloDeToque(cx,'table:'+tab.id,svgPt));

    /* Faixas de coluna: agrupa os textos abaixo do cabeçalho por altura.
       A ordem vertical corresponde à ordem das colunas no modelo. */
    if(!tab.cols.length) return;
    const abaixo=textos
      .map(t=>t.getBoundingClientRect())
      .filter(b=>b.width>0&&b.left>=cx.left-4&&b.right<=cx.right+4&&
                 b.top>=hb.bottom-2&&b.bottom<=cx.bottom+4)
      .sort((a,b)=>a.top-b.top);
    const linhas=[];
    abaixo.forEach(b=>{
      const meio=(b.top+b.bottom)/2;
      const l=linhas.find(l=>Math.abs((l.top+l.bottom)/2-meio)<Math.max(6,b.height*0.6));
      if(l){ l.top=Math.min(l.top,b.top); l.bottom=Math.max(l.bottom,b.bottom); }
      else linhas.push({top:b.top,bottom:b.bottom});
    });
    linhas.slice(0,tab.cols.length).forEach((l,i)=>{
      const cima  = i===0 ? hb.bottom : (linhas[i-1].bottom+l.top)/2;
      const baixo = i===linhas.length-1 ? cx.bottom : (l.bottom+linhas[i+1].top)/2;
      if(baixo-cima<6) return;
      camadaCol.appendChild(retanguloDeToque(
        {left:cx.left,right:cx.right,top:cima,bottom:Math.min(baixo,cx.bottom)},
        'col:'+tab.id+'#'+i,svgPt));
    });
  });

  if(!achou) return false;
  currentSVG.appendChild(camadaTab);
  currentSVG.appendChild(camadaCol);
  return true;
}

/* =====================================================================
   Seleção genérica para os tipos sem modelo visual.
   Todo elemento que alguém quer editar num diagrama acaba sendo um pedaço
   de texto no código-fonte. Então: para cada <text> do SVG, acho onde ele
   aparece no código e crio uma área de toque ligada àquele trecho exato.
   Isso vale para os 25 tipos de uma vez, sem modelar nenhum deles.
   ===================================================================== */
let indiceTextos=[], pendenteTexto=null;

function mapearTextoGenerico(){
  indiceTextos=[];
  if(!currentSVG) return false;
  const code=doc.code||'';
  if(!code) return false;
  const raiz=currentSVG.getScreenCTM(); if(!raiz) return false;
  const inv=raiz.inverse();
  const svgPt=(x,y)=>{ const p=currentSVG.createSVGPoint(); p.x=x; p.y=y; return p.matrixTransform(inv); };

  const areaSVG=(()=>{ const b=currentSVG.getBoundingClientRect(); return b.width*b.height||1; })();
  const formas=[...host.querySelectorAll('rect,polygon,circle,ellipse')]
    .map(e=>({b:e.getBoundingClientRect()}))
    .filter(o=>o.b.width>6&&o.b.height>6&&o.b.width*o.b.height<areaSVG*0.45);

  const ocupados=[];
  const livre=(a,b)=>!ocupados.some(o=>a<o[1]&&b>o[0]);
  const camada=document.createElementNS(SVGNS,'g');
  camada.setAttribute('class','hitlayer');

  [...host.querySelectorAll('text')].forEach(el=>{
    const bruto=(el.textContent||'').trim();
    if(!bruto||bruto.length>140) return;
    const cb=el.getBoundingClientRect();
    if(!cb.width||!cb.height) return;

    /* acha a primeira ocorrência ainda não usada — a ordem do SVG acompanha
       de perto a ordem do código, então isso resolve textos repetidos */
    let de=-1;
    let pos=code.indexOf(bruto);
    while(pos>=0){
      if(livre(pos,pos+bruto.length)){ de=pos; break; }
      pos=code.indexOf(bruto,pos+1);
    }
    if(de<0) return;
    const ate=de+bruto.length;
    ocupados.push([de,ate]);

    /* se houver uma forma envolvendo o texto, ela vira o alvo: dá para tocar
       no cartão, na barra ou na caixa inteira, não só nas letras */
    let alvo=cb, menor=Infinity;
    formas.forEach(f=>{
      const b=f.b;
      if(b.left<=cb.left+2&&b.right>=cb.right-2&&b.top<=cb.top+2&&b.bottom>=cb.bottom-2){
        const a=b.width*b.height;
        if(a<menor){ menor=a; alvo=b; }
      }
    });
    const pad=alvo===cb?5:0;
    const c={left:alvo.left-pad,right:alvo.right+pad,top:alvo.top-pad,bottom:alvo.bottom+pad};
    camada.appendChild(retanguloDeToque(c,'txt:'+de+':'+ate,svgPt));
    indiceTextos.push({ini:de,fim:ate,texto:bruto});
  });

  if(!camada.childNodes.length) return false;
  currentSVG.appendChild(camada);

  if(pendenteTexto!=null){
    const alvo=indiceTextos.find(t=>t.texto===pendenteTexto);
    pendenteTexto=null;
    if(alvo){ sel={kind:'txt',id:alvo.ini+':'+alvo.fim}; setRail(); paintActionBar(); }
  }
  return true;
}

function trechoDe(s){
  if(!s||s.kind!=='txt') return null;
  const partes=String(s.id).split(':');
  const ini=+partes[0], fim=+partes[1];
  const code=doc.code||'';
  if(!(ini>=0&&fim<=code.length&&fim>ini)) return null;
  const linhaIni=code.lastIndexOf(String.fromCharCode(10),ini-1)+1;
  let linhaFim=code.indexOf(String.fromCharCode(10),fim);
  if(linhaFim<0) linhaFim=code.length;
  return {ini,fim,texto:code.slice(ini,fim),linhaIni,linhaFim,
          linha:code.slice(linhaIni,linhaFim),
          numero:code.slice(0,linhaIni).split(String.fromCharCode(10)).length};
}
function trocarTrecho(t,novo){
  const code=doc.code||'';
  doc.code=code.slice(0,t.ini)+novo+code.slice(t.fim);
  pendenteTexto=novo;
}
function duplicarLinhaAtual(){
  const t=trechoDe(sel); if(!t) return;
  const code=doc.code||'';
  pushUndo();
  doc.code=code.slice(0,t.linhaFim)+String.fromCharCode(10)+t.linha+code.slice(t.linhaFim);
  afterChange(); haptic(12); toast('Linha duplicada');
}
function excluirLinhaAtual(){
  const t=trechoDe(sel); if(!t) return;
  const code=doc.code||'';
  let fim=t.linhaFim;
  if(code.charAt(fim)===String.fromCharCode(10)) fim++;
  pushUndo();
  doc.code=code.slice(0,t.linhaIni)+code.slice(fim);
  sel=null; afterChange(); paintActionBar(); haptic(18);
  toast('Linha removida — dá para desfazer');
}

function tagTargets(){
  if(!currentSVG) return;
  if(doc.tipo==='raw'){ mapearTextoGenerico(); return; }

  function casarPorTexto(itens,rotuloDe,chaveDe){
    const grupos=[...host.querySelectorAll('g')]
      .filter(g=>!g.dataset.selKey&&g.querySelector('text,foreignObject'))
      .sort((a,b)=>(a.textContent||'').length-(b.textContent||'').length);
    itens.forEach(it=>{
      const alvo=limpaTxt(rotuloDe(it)); if(!alvo) return;
      const g=grupos.find(g=>!g.dataset.selKey&&limpaTxt(g.textContent)===alvo);
      if(g) g.dataset.selKey=chaveDe(it);
    });
  }

  if(doc.tipo==='flow'){
    host.querySelectorAll('g.node, g[data-node], g[id^="flowchart-"]').forEach(g=>{
      let id=g.getAttribute('data-id')||'';
      if(!id) id=(g.getAttribute('id')||'').replace(/^flowchart-/,'').replace(/-\d+$/,'');
      if(id&&nodeById(id)&&!g.dataset.selKey) g.dataset.selKey='node:'+id;
    });
    if(!host.querySelector('[data-sel-key^="node:"]'))
      casarPorTexto(doc.nodes,n=>n.label||n.id,n=>'node:'+n.id);
  }

  /* Linhas: a ordem no DOM segue a ordem do código, então o índice basta. */
  const seletor=doc.tipo==='flow'
    ? '.edgePaths path, path.flowchart-link, g.edgePath path, path.relation'
    : 'path.relationshipLine, .er.relationshipLine, g.edgePaths path';
  let links=[...host.querySelectorAll(seletor)];
  if(!links.length)
    links=[...host.querySelectorAll('path')].filter(p=>
      /flowchart-link|relationshipLine|edge|relation/i.test(p.getAttribute('class')||''));
  const arr=doc.tipo==='flow'?doc.edges:doc.relations;
  const kind=doc.tipo==='flow'?'edge':'rel';
  const layer=document.createElementNS(SVGNS,'g');
  layer.setAttribute('class','hitlayer');
  links.slice(0,arr.length).forEach((p,i)=>{
    const hit=p.cloneNode(false);
    hit.setAttribute('class','hitline');
    hit.removeAttribute('marker-end'); hit.removeAttribute('marker-start');
    hit.setAttribute('style','stroke:transparent;fill:none;stroke-width:26px');
    hit.dataset.selKey=kind+':'+arr[i].id;
    const ctm=p.getScreenCTM(), root=currentSVG.getScreenCTM();
    if(ctm&&root){
      const m=root.inverse().multiply(ctm);
      hit.setAttribute('transform','matrix('+[m.a,m.b,m.c,m.d,m.e,m.f].join(',')+')');
    }
    layer.appendChild(hit);
  });
  if(layer.childNodes.length) currentSVG.appendChild(layer);

  /* O ER vem depois das linhas de propósito: perto da borda de uma tabela o
     que vale é selecionar a tabela, não o relacionamento que chega nela. */
  if(doc.tipo==='er'&&!mapearER()){
    [...host.querySelectorAll('rect')]
      .filter(r=>(r.getAttribute('class')||'').includes('entityBox'))
      .forEach(r=>{
        const g=r.parentNode; if(!g||g.nodeName!=='g'||g.dataset.selKey) return;
        const txt=[...g.querySelectorAll('text')].map(t=>t.textContent.trim()).find(Boolean)||'';
        const t=doc.tables.find(x=>limpaTxt(x.id)===limpaTxt(txt));
        if(t) g.dataset.selKey='table:'+t.id;
      });
    if(!host.querySelector('[data-sel-key^="table:"]'))
      casarPorTexto(doc.tables,t=>t.id,t=>'table:'+t.id);
  }

  const total=(doc.tipo==='flow'?doc.nodes.length:doc.tables.length);
  if(total&&!host.querySelector('[data-sel-key]')&&!avisouMapa){
    avisouMapa=true;
    toast('Não consegui mapear o desenho para o toque — use a aba Elementos');
  }
}
let avisouMapa=false;

/* --- destaque de seleção: colchetes de mira --- */
function drawSelection(){
  if(!currentSVG) return;
  currentSVG.querySelectorAll('.sellayer').forEach(n=>n.remove());
  if(!sel) return;
  const el=host.querySelector('[data-sel-key="'+sel.kind+':'+sel.id+'"]');
  if(!el) return;
  const r=el.getBoundingClientRect(), root=currentSVG.getScreenCTM();
  if(!root||!r.width) return;
  const inv=root.inverse();
  const pt=(x,y)=>{const p=currentSVG.createSVGPoint();p.x=x;p.y=y;return p.matrixTransform(inv);};
  const a=pt(r.left,r.top), b=pt(r.right,r.bottom);
  const pad=7, x1=Math.min(a.x,b.x)-pad, y1=Math.min(a.y,b.y)-pad;
  const x2=Math.max(a.x,b.x)+pad, y2=Math.max(a.y,b.y)+pad;
  const L=Math.min(18,(x2-x1)/3,(y2-y1)/3);
  const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('class','sellayer'); g.setAttribute('pointer-events','none');
  const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');
  rect.setAttribute('x',x1);rect.setAttribute('y',y1);
  rect.setAttribute('width',x2-x1);rect.setAttribute('height',y2-y1);
  rect.setAttribute('rx',6);rect.setAttribute('class','selglow');
  g.appendChild(rect);
  const d=[
    'M'+x1+','+(y1+L)+'V'+y1+'H'+(x1+L),
    'M'+(x2-L)+','+y1+'H'+x2+'V'+(y1+L),
    'M'+x2+','+(y2-L)+'V'+y2+'H'+(x2-L),
    'M'+(x1+L)+','+y2+'H'+x1+'V'+(y2-L)
  ].join(' ');
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',d); p.setAttribute('class','selbracket');
  g.appendChild(p);
  currentSVG.appendChild(g);
}

/* --- traz o elemento selecionado para a área visível acima do painel --- */
function revealSelection(){
  if(!sel||!currentSVG) return;
  const el=host.querySelector('[data-sel-key="'+sel.kind+':'+sel.id+'"]');
  if(!el) return;
  const r=el.getBoundingClientRect(), v=viewport.getBoundingClientRect();
  if(!r.width) return;
  const alvoX=v.left+v.width/2, alvoY=v.top+Math.min(v.height*0.3,140);
  view.x+=alvoX-(r.left+r.width/2);
  view.y+=alvoY-(r.top+r.height/2);
  applyView();
}

/* =====================================================================
   7. PAN / ZOOM / TOQUE
   ===================================================================== */
let view={x:0,y:0,k:1}, viewInit=false;
function applyView(){
  stage.style.transform='translate3d('+view.x+'px,'+view.y+'px,0) scale('+view.k+')';
  $('#zoomLbl').textContent=Math.round(view.k*100)+'%';
}
function fit(){
  if(!currentSVG) return;
  const vb=currentSVG.getBBox?currentSVG.getBBox():null;
  const w=currentSVG.width&&currentSVG.width.baseVal?currentSVG.width.baseVal.value:(vb?vb.width:600);
  const h=currentSVG.height&&currentSVG.height.baseVal?currentSVG.height.baseVal.value:(vb?vb.height:400);
  const W=viewport.clientWidth-28, H=viewport.clientHeight-28;
  if(!w||!h) return;
  view.k=Math.max(.15,Math.min(W/w,H/h,1.6));
  view.x=(viewport.clientWidth-w*view.k)/2;
  view.y=(viewport.clientHeight-h*view.k)/2;
  applyView();
}
const ptrs=new Map();
let gest=null;
viewport.addEventListener('pointerdown',e=>{
  if(e.target.closest('#hud')||e.target.closest('#fabs')||
     e.target.closest('#coach')||e.target.closest('#empty')||e.target.closest('#err')) return;
  viewport.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,moved:0});
  if(ptrs.size===2){
    const [a,b]=[...ptrs.values()];
    gest={d:Math.hypot(a.x-b.x,a.y-b.y),k:view.k,
          cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,vx:view.x,vy:view.y};
  }
},{passive:false});
viewport.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId); if(!p) return;
  const dx=e.clientX-p.x, dy=e.clientY-p.y;
  p.moved+=Math.abs(dx)+Math.abs(dy); p.x=e.clientX; p.y=e.clientY;
  if(ptrs.size===1){ view.x+=dx; view.y+=dy; applyView(); }
  else if(ptrs.size===2&&gest){
    const [a,b]=[...ptrs.values()];
    const nd=Math.hypot(a.x-b.x,a.y-b.y);
    const k=Math.max(.12,Math.min(4,gest.k*(nd/(gest.d||1))));
    const rect=viewport.getBoundingClientRect();
    const cx=gest.cx-rect.left, cy=gest.cy-rect.top;
    view.x=cx-(cx-gest.vx)*(k/gest.k);
    view.y=cy-(cy-gest.vy)*(k/gest.k);
    view.k=k; applyView();
  }
},{passive:false});
function endPtr(e){
  const p=ptrs.get(e.pointerId);
  ptrs.delete(e.pointerId);
  if(ptrs.size<2) gest=null;
  if(!p) return;
  if(p.moved<10&&Math.hypot(e.clientX-p.sx,e.clientY-p.sy)<10) handleTap(e.clientX,e.clientY);
}
viewport.addEventListener('pointerup',endPtr);
viewport.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);gest=null;});
viewport.addEventListener('wheel',e=>{
  e.preventDefault();
  const rect=viewport.getBoundingClientRect();
  const cx=e.clientX-rect.left, cy=e.clientY-rect.top;
  const k=Math.max(.12,Math.min(4,view.k*(e.deltaY<0?1.12:1/1.12)));
  view.x=cx-(cx-view.x)*(k/view.k); view.y=cy-(cy-view.y)*(k/view.k);
  view.k=k; applyView();
},{passive:false});

let lastTapT=0,lastTapX=0,lastTapY=0;
function zoomTo(k,cx,cy){
  const r=viewport.getBoundingClientRect();
  const x=cx-r.left,y=cy-r.top;
  view.x=x-(x-view.x)*(k/view.k); view.y=y-(y-view.y)*(k/view.k);
  view.k=k; applyView();
}
function handleTap(cx,cy){
  const agora=Date.now();
  const duplo=agora-lastTapT<330&&Math.hypot(cx-lastTapX,cy-lastTapY)<32;
  lastTapT=agora; lastTapX=cx; lastTapY=cy;
  const el=document.elementFromPoint(cx,cy);
  const t=el&&el.closest?el.closest('[data-sel-key]'):null;
  if(!t){
    if(linkMode) return;
    if(duplo){ view.k>1.05?fit():zoomTo(1.6,cx,cy); return; }
    select(null); return;
  }
  const chave=t.dataset.selKey, corte=chave.indexOf(':');
  const kind=chave.slice(0,corte), id=chave.slice(corte+1);
  if(linkMode&&kind!=='node'&&kind!=='table'){ toast(doc.tipo==='er'?'Toque numa tabela':'Toque num nó'); return; }
  if(linkMode){
    if(!linkFrom){ linkFrom=id; sel={kind,id}; drawSelection(); setRail(); paintActionBar(); haptic(); return; }
    if(linkFrom===id){ toast('Escolha um elemento diferente'); return; }
    createLink(linkFrom,id); setLinkMode(false); return;
  }
  select({kind,id},duplo?true:undefined);
}

/* =====================================================================
   8. HISTÓRICO, ESTADO E FEEDBACK
   ===================================================================== */
function pushUndo(){
  undoStack.push(JSON.stringify(doc));
  if(undoStack.length>80) undoStack.shift();
  redoStack=[]; updateUndoBtns();
}
function updateUndoBtns(){
  $('#btnUndo').disabled=!undoStack.length;
  $('#btnRedo').disabled=!redoStack.length;
}
function undo(){
  if(!undoStack.length) return;
  redoStack.push(JSON.stringify(doc));
  doc=JSON.parse(undoStack.pop());
  sel=null; updateUndoBtns(); afterChange(); refreshChrome(); toast('Desfeito');
}
function redo(){
  if(!redoStack.length) return;
  undoStack.push(JSON.stringify(doc));
  doc=JSON.parse(redoStack.pop());
  sel=null; updateUndoBtns(); afterChange(); refreshChrome(); toast('Refeito');
}
let saveT=null;
function afterChange(){
  render();
  setRail();
  paintActionBar();
  if(sheetView==='elements') paintElements();
  clearTimeout(saveT); saveT=setTimeout(save,600);
}
function refreshChrome(){
  $('#docName').value=doc.nome;
  $('#docKind').textContent=doc.tipo==='er'?'Modelo relacional'
    :doc.tipo==='md'?'Documento'
    :doc.tipo==='raw'?(doc.kind||'Código Mermaid'):'Fluxograma';
  const rotulos=doc.tipo==='md'
    ? ['Documento','Estrutura','Markdown','Estilo']
    : ['Diagrama','Elementos','Código','Estilo'];
  $$('.tab').forEach((b,i)=>{ const sp=b.querySelector('span'); if(sp) sp.textContent=rotulos[i]; });
}
let toastT=null;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1900);
}
function setRail(mode,txt){
  const r=$('#rail'), el=$('#railText');
  if(mode){ r.dataset.mode=mode; el.innerHTML=txt; return; }
  if(linkMode){ r.dataset.mode='link'; el.innerHTML=linkFrom?('conectando a partir de <b>'+linkFrom+'</b> — toque no destino'):'modo conexão — toque na origem'; return; }
  if(sel){
    r.dataset.mode='sel';
    const d=describe(sel);
    el.innerHTML='selecionado <b>'+d+'</b>';
    return;
  }
  r.dataset.mode='idle';
  if(doc.tipo==='md'){
    const txt=(doc.md||'').trim();
    const palavras=txt?txt.split(/\s+/).length:0;
    const diagramas=(doc.md||'').split('```mermaid').length-1;
    el.innerHTML='<b>'+palavras+'</b> palavras'+(diagramas?' · <b>'+diagramas+'</b> diagrama'+(diagramas>1?'s':''):'');
    return;
  }
  if(doc.tipo==='raw'){
    el.innerHTML=esc(doc.kind||'código')+' · <b>'+(doc.code||'').split(String.fromCharCode(10)).length+'</b> linhas';
    return;
  }
  const a=doc.tipo==='er'?doc.tables.length:doc.nodes.length;
  const b=doc.tipo==='er'?doc.relations.length:doc.edges.length;
  el.innerHTML=(doc.tipo==='er'?'tabelas':'nós')+' <b>'+a+'</b> · '+(doc.tipo==='er'?'relações':'ligações')+' <b>'+b+'</b>';
}
function describe(s){
  if(s.kind==='node'){const n=nodeById(s.id);return n?n.id:'?';}
  if(s.kind==='table'){const t=tableById(s.id);return t?t.id:'?';}
  if(s.kind==='edge'){const e=edgeById(s.id);return e?e.from+'→'+e.to:'?';}
  if(s.kind==='rel'){const r=relById(s.id);return r?r.from+'→'+r.to:'?';}
  if(s.kind==='col'){const c=colunaDe(s);return c?c.tab.id+'.'+(c.col.name||'coluna'):'?';}
  if(s.kind==='txt'){const t=trechoDe(s);return t?('linha '+t.numero):'?';}
  return '?';
}
function select(target,open){
  sel=target;
  drawSelection(); setRail(); paintActionBar();
  if(target&&open===true) openInspector();
  else if(!target&&sheetView==='inspector') closeSheet();
  if(target) haptic();
}
function haptic(ms){ try{ navigator.vibrate&&navigator.vibrate(ms||7); }catch(e){} }

const sheet=$('#sheet'), scrim=$('#scrim'), sheetBody=$('#sheetBody');
let sheetView=null;
function openSheet(view,title,tag){
  sheetView=view;
  sheetBody.onclick=null; sheetBody.innerHTML='';
  sheetBody.scrollTop=0;
  $('#sheetTitle').textContent=title;
  const t=$('#sheetTag'); t.hidden=!tag; t.textContent=tag||'';
  sheet.hidden=false; scrim.hidden=false;
  requestAnimationFrame(()=>{sheet.classList.add('show');scrim.classList.add('show');});
}
function closeSheet(){
  sheetView=null;
  sheet.classList.remove('show'); scrim.classList.remove('show');
  setTimeout(()=>{sheet.hidden=true;scrim.hidden=true;sheetBody.innerHTML='';},240);
  $$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab==='canvas'));
}
$('#btnSheetClose').onclick=closeSheet;
scrim.onclick=closeSheet;
{
  const grab=$('#sheetGrab'); let sy=0,dragging=false;
  grab.addEventListener('pointerdown',e=>{dragging=true;sy=e.clientY;grab.setPointerCapture(e.pointerId);sheet.style.transition='none';});
  grab.addEventListener('pointermove',e=>{ if(!dragging)return; const dy=Math.max(0,e.clientY-sy); sheet.style.transform='translateY('+dy+'px)';});

/* helpers de formulário */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function bindLive(el,apply){
  let snap=null;
  el.addEventListener('focus',()=>{snap=JSON.stringify(doc);});
  el.addEventListener('input',()=>{apply(el.value);afterChange();});
  el.addEventListener('blur',()=>{
    if(snap&&snap!==JSON.stringify(doc)){undoStack.push(snap);redoStack=[];updateUndoBtns();}
    snap=null;
  });
}

/* =====================================================================
   10. INSPETORES
   ===================================================================== */
function openInspector(anchor){
  if(!sel) return;
  const titles={node:'Nó',edge:'Ligação',table:'Tabela',rel:'Relação',col:'Coluna',txt:'Elemento'};
  openSheet('inspector',titles[sel.kind]||'Elemento',describe(sel));
  paintInspector();
  requestAnimationFrame(()=>setTimeout(()=>{
    revealSelection();
    if(anchor){ const a=document.getElementById(anchor);
      if(a) sheetBody.scrollTo({top:Math.max(0,a.offsetTop-10),behavior:'smooth'}); }
  },280));
}
function paintInspector(){
  if(!sel){sheetBody.innerHTML='';return;}
  if(sel.kind==='node') return paintNode();
  if(sel.kind==='edge') return paintEdge();
  if(sel.kind==='table') return paintTable();
  if(sel.kind==='rel') return paintRel();
  if(sel.kind==='col') return paintColumn();
  if(sel.kind==='txt') return paintTexto();
}

/* ---------- nó ---------- */

  sheetBody.innerHTML=`
    <div class="grp"><label class="lab" for="fLabel">Texto do nó</label>
      <textarea class="fld" id="fLabel" rows="2" placeholder="O que acontece aqui">${esc(n.label)}</textarea>
      <p class="hint">Enter cria uma segunda linha dentro da forma.</p></div>
    <div class="grp"><label class="lab" for="fId">Identificador</label>
      <input class="fld mono" id="fId" value="${esc(n.id)}" spellcheck="false" autocapitalize="off">
      <p class="hint">Usado no código e nas ligações. Só letras, números, _ e -.</p></div>
    <div class="sec" id="secForma">Forma</div>
    <div class="chips" id="shapePick">${Object.entries(SHAPES).map(([k,v])=>
      `<button class="pick ${k===n.shape?'sel':''}" data-shape="${k}">${shapeSvg(k)}${v.nome}</button>`).join('')}</div>
    <div class="sec" id="secCor">Cor</div>
    <div class="chips" id="clsPick">
      <button class="pick ${!n.cls?'sel':''}" data-cls="">Padrão</button>
      ${doc.classes.map(c=>`<button class="pick ${n.cls===c.id?'sel':''}" data-cls="${esc(c.id)}">
        <span class="swatch" style="background:${esc(c.fill||'transparent')};border-color:${esc(c.stroke||'#666')}"></span>${esc(c.id)}</button>`).join('')}
    </div>
    <div class="sec">Ligações (${conex.length})</div>
    <div class="list" id="nodeEdges">${conex.length?conex.map(e=>{
      const dir=e.from===n.id?'→':'←', outro=e.from===n.id?e.to:e.from;
      return `<button class="item" data-edge="${e.id}"><span class="k">${dir}</span>
        <span class="t">${esc(e.label||'(sem rótulo)')}</span><span class="s">${esc(outro)}</span></button>`;
    }).join(''):'<p class="empty-note">Nenhuma ligação ainda.</p>'}</div>
    <div class="sec">Ações</div>
    <div class="list">
      <button class="btn" id="aLink">${ico('link')} Conectar a outro nó</button>
      <button class="btn" id="aDup">${ico('copy')} Duplicar</button>
      <button class="btn dan" id="aDel">${ico('trash')} Excluir nó</button>
    </div>`;
  bindLive($('#fLabel'),v=>{n.label=v;});
  const fid=$('#fId');
  fid.addEventListener('change',()=>{
    const novo=fid.value.trim();
    if(!/^[A-Za-z0-9_\-]+$/.test(novo)){ toast('Use só letras, números, _ ou -'); fid.value=n.id; return; }
    if(novo!==n.id&&(nodeById(novo))){ toast('Já existe um nó com esse id'); fid.value=n.id; return; }
    pushUndo();
    const velho=n.id; n.id=novo;
    doc.edges.forEach(e=>{ if(e.from===velho)e.from=novo; if(e.to===velho)e.to=novo; });
    doc.groups.forEach(g=>{ const i=g.nodes.indexOf(velho); if(i>=0) g.nodes[i]=novo; });
    sel={kind:'node',id:novo}; $('#sheetTag').textContent=novo; afterChange();
  });
  $('#shapePick').onclick=e=>{
    const b=e.target.closest('[data-shape]'); if(!b)return;

    $$('#shapePick .pick').forEach(x=>x.classList.toggle('sel',x===b)); afterChange();
  };
  $('#clsPick').onclick=e=>{
    const b=e.target.closest('[data-cls]'); if(!b)return;

    $$('#clsPick .pick').forEach(x=>x.classList.toggle('sel',x===b)); afterChange();
  };

  $('#aDup').onclick=()=>{duplicarSel();openInspector();};
  $('#aDel').onclick=confirmDelete;
}

  const opts=doc.nodes.map(n=>`<option value="${esc(n.id)}">${esc(n.id)} — ${esc((n.label||'').split('\n')[0])}</option>`).join('');

    </div>

    <div class="chips" id="linkPick">${Object.entries(LINKS).map(([k,v])=>
      `<button class="pick ${k===e.type?'sel':''}" data-link="${k}">${v.nome}

  bindLive($('#fEl'),v=>{e.label=v;});
  $('#fFrom').onchange=()=>{pushUndo();e.from=$('#fFrom').value;$('#sheetTag').textContent=e.from+'→'+e.to;afterChange();};
  $('#fTo').onchange=()=>{pushUndo();e.to=$('#fTo').value;$('#sheetTag').textContent=e.from+'→'+e.to;afterChange();};

  };

}

function paintTable(){
  const t=tableById(sel.id); if(!t){closeSheet();return;}
  const rels=doc.relations.filter(r=>r.from===t.id||r.to===t.id);
  sheetBody.innerHTML=`
    <div class="grp"><label class="lab" for="fTn">Nome da tabela</label>
      <input class="fld mono" id="fTn" value="${esc(t.id)}" spellcheck="false" autocapitalize="characters">
