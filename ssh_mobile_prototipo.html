<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Termix — Cliente SSH</title>
<style>
:root{
  /* Superfícies (iOS dark, OLED) */
  --bg:#000000;
  --bg-elev:#1C1C1E;
  --bg-elev-2:#2C2C2E;
  --bg-elev-3:#3A3A3C;
  --chrome:rgba(20,20,22,.86);
  --sep:rgba(84,84,88,.55);
  --sep-strong:rgba(84,84,88,.9);

  /* Texto */
  --label:#FFFFFF;
  --label-2:rgba(235,235,245,.62);
  --label-3:rgba(235,235,245,.32);
  --label-4:rgba(235,235,245,.18);

  /* Cores de sistema */
  --blue:#0A84FF;
  --green:#30D158;
  --amber:#FF9F0A;
  --red:#FF453A;
  --purple:#BF5AF2;
  --teal:#40C8E0;
  --indigo:#5E5CE6;
  --pink:#FF375F;

  /* Terminal */
  --term-bg:#0A0E14;
  --term-fg:#D6DEEB;
  --term-dim:#5F7E97;
  --term-green:#5DE4A1;
  --term-cyan:#5CCFE6;
  --term-yellow:#FFCB6B;
  --term-red:#FF6E6E;
  --term-blue:#82AAFF;
  --term-magenta:#C792EA;

  --radius:11px;
  --radius-lg:16px;
  --radius-xl:22px;
  --nav-h:52px;
  --tab-h:56px;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --term-fs:11.5px;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Monaco,"Cascadia Mono","Roboto Mono",monospace;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;margin:0;padding:0}
body{
  background:#0A0A0C;
  overscroll-behavior:none;
  touch-action:manipulation;
  font-family:var(--ui);
  color:var(--label);
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;line-height:1.35;
  letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;outline:none;width:100%}
input::placeholder{color:var(--label-3)}

/* ---------- Moldura do device (só no desktop) ---------- */
button,.row,.key,.tab,.field,input{touch-action:manipulation}
.nav,#tabbar,.keybar,.term-tabs{-webkit-user-select:none;user-select:none}
#termout{-webkit-user-select:text;user-select:text}

#device{
  position:relative;width:100%;height:100%;height:100dvh;max-width:100%;max-height:100%;
  background:var(--bg);overflow:hidden;display:flex;flex-direction:column;
}
@media (min-width:600px) and (min-height:700px){
  body{background:radial-gradient(120% 90% at 50% 0%,#1a1d24 0%,#08090B 60%)}
  #device{
    width:392px;height:844px;border-radius:46px;
    border:1px solid #26282F;
    box-shadow:0 0 0 9px #131519,0 40px 90px -20px rgba(0,0,0,.9),0 0 60px -10px rgba(10,132,255,.12);
    --sat:44px;--sab:26px;
  }
  #device::before{ /* dynamic island */
    content:"";position:absolute;top:11px;left:50%;transform:translateX(-50%);
    width:106px;height:31px;background:#000;border-radius:20px;z-index:900;pointer-events:none;
  }
  #home-indicator{display:block}
}
#home-indicator{
  display:none;position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  width:132px;height:5px;border-radius:3px;background:rgba(255,255,255,.32);z-index:880;pointer-events:none;
}

/* ---------- Status bar ---------- */
#statusbar{
  position:absolute;top:0;left:0;right:0;height:var(--sat);z-index:850;
  display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 30px 6px;font-size:14px;font-weight:600;pointer-events:none;
  letter-spacing:0;
}
@media (max-width:599px){#statusbar{display:none}}
#statusbar .sb-r{display:flex;align-items:center;gap:5px}
.sb-bat{width:23px;height:11.5px;border:1.2px solid rgba(255,255,255,.5);border-radius:3.2px;position:relative;padding:1.2px}
.sb-bat i{display:block;height:100%;width:78%;background:#fff;border-radius:1.6px}
.sb-bat::after{content:"";position:absolute;right:-3px;top:3.4px;width:1.6px;height:4px;background:rgba(255,255,255,.5);border-radius:0 1px 1px 0}

/* ---------- Stack de navegação ---------- */
#stack{position:absolute;inset:0;overflow:hidden}
.screen{
  position:absolute;inset:0;background:var(--bg);
  display:flex;flex-direction:column;
  will-change:transform;
}
.screen.push-in{animation:pushIn .34s cubic-bezier(.32,.72,0,1) both}
.screen.push-out{animation:pushOut .34s cubic-bezier(.32,.72,0,1) both}
.screen.pop-out{animation:popOut .3s cubic-bezier(.32,.72,0,1) both;z-index:5}
.screen.pop-in{animation:popIn .3s cubic-bezier(.32,.72,0,1) both}
@keyframes pushIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes pushOut{from{transform:translateX(0);filter:brightness(1)}to{transform:translateX(-28%);filter:brightness(.55)}}
@keyframes popOut{from{transform:translateX(0)}to{transform:translateX(100%)}}
@keyframes popIn{from{transform:translateX(-28%);filter:brightness(.55)}to{transform:translateX(0);filter:brightness(1)}}
@media (prefers-reduced-motion:reduce){.screen{animation:none!important}}

/* ---------- Nav bar ---------- */
.nav{
  position:relative;z-index:60;flex:none;
  padding-top:var(--sat);
  background:var(--chrome);
  -webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);
  border-bottom:.5px solid var(--sep);
}
.nav.plain{background:var(--bg);border-bottom-color:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
.nav-row{height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 8px;gap:4px}
.nav-title{font-size:17px;font-weight:600;letter-spacing:-.02em;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-btn{display:flex;align-items:center;gap:2px;color:var(--blue);font-size:17px;padding:6px 8px;border-radius:8px;min-width:44px}
.nav-btn:active{opacity:.4}
.nav-btn.right{justify-content:flex-end}
.nav-btn.icon{min-width:44px;justify-content:center}
.nav-btn[disabled]{opacity:0;pointer-events:none}
.large-title{padding:2px 20px 8px;font-size:34px;font-weight:700;letter-spacing:-.028em}
.large-sub{padding:0 20px 12px;font-size:13px;color:var(--label-2);margin-top:-4px}

/* ---------- Conteúdo rolável ---------- */
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.body.pad{padding-bottom:calc(var(--tab-h) + var(--sab) + 24px)}
.body.padplain{padding-bottom:calc(var(--sab) + 28px)}

/* ---------- Busca ---------- */
.searchbar{margin:4px 16px 12px;display:flex;align-items:center;gap:7px;background:var(--bg-elev-2);border-radius:10px;padding:8px 10px}
.searchbar svg{flex:none;opacity:.45}
.searchbar input{font-size:16px}

/* ---------- Listas agrupadas ---------- */
.group-hdr{padding:20px 20px 7px;font-size:13px;font-weight:400;color:var(--label-2);text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:flex-end}
.group-hdr .cnt{text-transform:none;letter-spacing:0;color:var(--label-3);font-size:13px}
.list{background:var(--bg-elev);border-radius:var(--radius);margin:0 16px;overflow:hidden}
.list.flat{border-radius:0;margin:0}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;position:relative;min-height:48px;transition:background .12s}
.row+.row::before{content:"";position:absolute;left:52px;right:0;top:0;height:.5px;background:var(--sep)}
.row.norule+.row::before,.row+.row.norule::before{left:14px}
.row:active{background:var(--bg-elev-2)}
.row-main{flex:1;min-width:0}
.row-title{font-size:16.5px;font-weight:450;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:13px;color:var(--label-2);font-family:var(--mono);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row-val{font-size:16px;color:var(--label-2);white-space:nowrap;max-width:56%;overflow:hidden;text-overflow:ellipsis;text-align:right}
.chev{flex:none;opacity:.28}
.icon-box{flex:none;width:29px;height:29px;border-radius:7px;display:grid;place-items:center;font-size:15px;font-weight:600}
.icon-box.lg{width:38px;height:38px;border-radius:9px;font-size:17px}

/* Chips / tags */
.tags{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:500;padding:2px 7px;border-radius:5px;background:var(--bg-elev-3);color:var(--label-2);letter-spacing:.01em}
.tag.prod{background:rgba(255,69,58,.16);color:#FF8A80}
.tag.hml{background:rgba(255,159,10,.16);color:#FFC46B}
.tag.dev{background:rgba(48,209,88,.14);color:#6BE58E}

/* Status dot */
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--label-4)}
.dot.on{background:var(--green);box-shadow:0 0 0 3px rgba(48,209,88,.16)}
.dot.warn{background:var(--amber)}
.dot.err{background:var(--red)}

/* ---------- Formulários ---------- */
.field{display:flex;align-items:center;gap:10px;padding:11px 14px;position:relative;min-height:46px}
.field+.field::before{content:"";position:absolute;left:14px;right:0;top:0;height:.5px;background:var(--sep)}
.field label{flex:none;width:104px;font-size:16px;color:var(--label)}
.field input{text-align:right;font-size:16px}
.field input.mono{font-family:var(--mono);font-size:14.5px;letter-spacing:-.02em}
.hint{padding:7px 20px 0;font-size:12.5px;color:var(--label-2);line-height:1.45}
.hint b{color:var(--label-2);font-weight:600}

/* Toggle */
.switch{flex:none;width:51px;height:31px;border-radius:16px;background:var(--bg-elev-3);position:relative;transition:background .22s}
.switch i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .22s cubic-bezier(.32,.72,0,1);box-shadow:0 2px 5px rgba(0,0,0,.35)}
.switch.on{background:var(--green)}
.switch.on i{transform:translateX(20px)}

/* Segmented */
.seg{display:flex;background:var(--bg-elev-2);border-radius:9px;padding:2px;margin:0 16px;gap:2px}
.seg button{flex:1;padding:6px 4px;border-radius:7px;font-size:13.5px;font-weight:500;color:var(--label-2);transition:.15s}
.seg button.on{background:var(--bg-elev-3);color:var(--label);box-shadow:0 1px 3px rgba(0,0,0,.3)}

/* Botões */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:13px;font-size:17px;font-weight:600;letter-spacing:-.015em}
.btn:active{opacity:.72;transform:scale(.985)}
.btn.primary{background:var(--blue);color:#fff}
.btn.green{background:var(--green);color:#04240F}
.btn.tinted{background:rgba(10,132,255,.16);color:var(--blue)}
.btn.gray{background:var(--bg-elev-2);color:var(--label)}
.btn.danger{background:var(--bg-elev);color:var(--red)}
.pad-h{padding:0 16px}
.mt{margin-top:16px}.mt-s{margin-top:8px}.mt-l{margin-top:28px}

/* ---------- Tab bar ---------- */
#tabbar{
  position:absolute;left:0;right:0;bottom:0;z-index:700;
  height:calc(var(--tab-h) + var(--sab));padding-bottom:var(--sab);
  background:var(--chrome);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);
  border-top:.5px solid var(--sep);
  display:flex;align-items:flex-start;padding-top:7px;
}
#tabbar.hidden{display:none}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--label-3);transition:color .15s}
.tab.on{color:var(--blue)}
.tab span{font-size:10px;font-weight:500;letter-spacing:.005em}
.tab .badge{position:absolute;transform:translate(14px,-4px);background:var(--green);color:#04240F;font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px}

/* ---------- Terminal ---------- */
.term-wrap{flex:1;display:flex;flex-direction:column;background:var(--term-bg);min-height:0}
.term-tabs{flex:none;display:flex;gap:6px;padding:7px 10px;background:rgba(0,0,0,.35);border-bottom:.5px solid rgba(255,255,255,.06);overflow-x:auto;scrollbar-width:none}
.term-tabs::-webkit-scrollbar{display:none}
.term-tab{flex:none;display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.05);font-size:12.5px;color:var(--label-2);font-weight:500}
.term-tab.on{background:rgba(10,132,255,.2);color:#8CC4FF}
.term-tab .x{opacity:.5;font-size:14px;line-height:1}
#termout{
  flex:1;overflow-y:auto;padding:12px 11px 14px;
  font-family:var(--mono);font-size:var(--term-fs);line-height:1.52;
  color:var(--term-fg);white-space:pre-wrap;word-break:break-word;
  letter-spacing:-.02em;
}
#termout .g{color:var(--term-green)}
#termout .c{color:var(--term-cyan)}
#termout .y{color:var(--term-yellow)}
#termout .r{color:var(--term-red)}
#termout .b{color:var(--term-blue)}
#termout .m{color:var(--term-magenta)}
#termout .d{color:var(--term-dim)}
#termout .bold{font-weight:700}
.term-input-line{display:flex;gap:0;font-family:var(--mono);font-size:var(--term-fs);align-items:baseline}
.term-input-line .ps1{color:var(--term-green);white-space:pre;flex:none}
/* iOS dá zoom em qualquer input com fonte < 16px. Usamos 16px reais e
   reduzimos por transform, mantendo o visual do terminal. */
.ti-wrap{flex:1;overflow:hidden;min-width:0}
#terminput{
  font-family:var(--mono);font-size:16px;color:var(--term-fg);
  caret-color:var(--term-green);letter-spacing:-.02em;
  transform:scale(.719);transform-origin:left center;width:139%;
}
.cursor{display:inline-block;width:7px;height:14px;background:var(--term-green);vertical-align:-2px;animation:blink 1.1s step-end infinite}
@keyframes blink{50%{opacity:0}}

/* Barra de teclas (a estrela do show) */
.keybar{
  flex:none;background:#1B1E25;border-top:.5px solid rgba(255,255,255,.07);
  padding:7px 0 calc(7px + var(--sab));
}
.keybar-row{display:flex;gap:5px;padding:0 7px;overflow-x:auto;scrollbar-width:none}
.keybar-row+.keybar-row{margin-top:6px}
.keybar-row::-webkit-scrollbar{display:none}
.key{
  flex:none;min-width:37px;height:37px;padding:0 9px;border-radius:8px;
  background:#2E323C;color:#E6EAF2;font-family:var(--mono);font-size:12.5px;font-weight:500;
  display:grid;place-items:center;box-shadow:0 1px 0 rgba(0,0,0,.5);
}
.key:active{background:#3E4450}
.key.on{background:var(--blue);color:#fff}
.key.wide{min-width:52px}

/* ---------- Sheet / modal ---------- */
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:800;opacity:0;pointer-events:none;transition:opacity .28s}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:810;
  background:var(--bg-elev);border-radius:var(--radius-xl) var(--radius-xl) 0 0;
  padding:8px 0 calc(16px + var(--sab));
  transform:translateY(102%);transition:transform .36s cubic-bezier(.32,.72,0,1);
  max-height:88%;overflow-y:auto;
}
.sheet.on{transform:translateY(0)}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--label-4);margin:0 auto 10px}
.sheet-title{text-align:center;font-size:18px;font-weight:600;padding:2px 24px 4px}
.sheet-sub{text-align:center;font-size:13.5px;color:var(--label-2);padding:6px 26px 14px;line-height:1.5}

/* Alerta central */
.alert{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);z-index:830;
  width:272px;background:rgba(44,44,46,.9);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);
  border-radius:14px;overflow:hidden;text-align:center;opacity:0;pointer-events:none;transition:.24s cubic-bezier(.32,.72,0,1);
}
.alert.on{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.alert-body{padding:19px 17px 16px}
.alert h4{margin:0 0 4px;font-size:17px;font-weight:600}
.alert p{margin:0;font-size:13px;color:var(--label-2);line-height:1.42}
.alert-acts{display:flex;border-top:.5px solid var(--sep-strong)}
.alert-acts button{flex:1;padding:11px 4px;font-size:17px;color:var(--blue)}
.alert-acts button+button{border-left:.5px solid var(--sep-strong)}
.alert-acts button.strong{font-weight:600}
.alert-acts button.danger{color:var(--red)}

/* Toast */
#toast{
  position:absolute;top:calc(max(var(--sat),10px) + 8px);left:50%;transform:translate(-50%,-140%);
  z-index:870;background:rgba(50,50,54,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  padding:9px 16px;border-radius:22px;font-size:13.5px;font-weight:500;
  box-shadow:0 8px 24px rgba(0,0,0,.5);transition:transform .4s cubic-bezier(.32,.72,0,1);
  display:flex;align-items:center;gap:7px;max-width:86%;
}
#toast.on{transform:translate(-50%,0)}

/* ---------- Diversos ---------- */
.empty{padding:64px 40px;text-align:center;color:var(--label-3)}
.empty .ico{font-size:44px;margin-bottom:12px;opacity:.5}
.empty h3{font-size:17px;font-weight:600;color:var(--label-2);margin:0 0 6px}
.empty p{font-size:14px;margin:0;line-height:1.5}
.fab{
  position:absolute;right:18px;bottom:calc(var(--tab-h) + var(--sab) + 18px);z-index:600;
  width:54px;height:54px;border-radius:50%;background:var(--blue);
  display:grid;place-items:center;box-shadow:0 8px 22px rgba(10,132,255,.42);
}
.fab:active{transform:scale(.93)}
.fingerprint{font-family:var(--mono);font-size:12px;color:var(--label-2);word-break:break-all;line-height:1.6;letter-spacing:-.01em}
.mono{font-family:var(--mono)}
.center{text-align:center}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Paisagem em telefone: recupera altura vertical */
@media (orientation:landscape) and (max-height:520px){
  .large-title{font-size:24px;padding-top:0;padding-bottom:4px}
  .large-sub{display:none}
  :root{--nav-h:42px;--tab-h:46px}
  .keybar{padding-top:5px}
  .key{height:32px;min-width:34px}
  .term-tabs{padding:4px 8px}
}

/* Login */
.login-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 28px;padding-bottom:60px}
.brand{text-align:center;margin-bottom:34px}
.brand .mark{width:74px;height:74px;border-radius:19px;margin:0 auto 16px;display:grid;place-items:center;
  background:linear-gradient(160deg,#0A84FF,#5E5CE6);box-shadow:0 12px 30px -8px rgba(10,132,255,.55);
  font-family:var(--mono);font-size:30px;font-weight:700;color:#fff}
.brand h1{font-size:28px;font-weight:700;letter-spacing:-.03em;margin:0 0 6px}
.brand p{font-size:14.5px;color:var(--label-2);margin:0;line-height:1.45}
.sso{display:flex;align-items:center;justify-content:center;gap:9px;padding:13px;border-radius:12px;background:var(--bg-elev-2);font-size:15.5px;font-weight:500}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--label-3);font-size:12.5px}
.divider::before,.divider::after{content:"";flex:1;height:.5px;background:var(--sep)}
</style>
</head>
<body>
<div id="device">
  <div id="statusbar">
    <div id="sb-time">9:41</div>
    <div class="sb-r">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="#fff"><rect x="0" y="7.5" width="3" height="3.5" rx="1"/><rect x="4.5" y="5.5" width="3" height="5.5" rx="1"/><rect x="9" y="3" width="3" height="8" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1" opacity=".4"/></svg>
      <svg width="16" height="11" viewBox="0 0 16 12" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><path d="M1 4.2a10 10 0 0 1 14 0" opacity=".9"/><path d="M3.6 7a6.4 6.4 0 0 1 8.8 0" opacity=".9"/><circle cx="8" cy="10" r="1.1" fill="#fff" stroke="none"/></svg>

const $ = s => document.querySelector(s);
const stackEl = $("#stack");
let navStack = [];

function haptic(){ if(navigator.vibrate) navigator.vibrate(8); }

function render(){
  const cur = navStack[navStack.length-1];
  const html = SCREENS[cur.name](cur.props||{});
  const el = document.createElement("div");
  el.className = "screen";
  el.dataset.name = cur.name;
  el.innerHTML = html;
  stackEl.appendChild(el);
  return el;
}
function go(name, props, opts={}){
  const prev = stackEl.lastElementChild;
  navStack.push({name,props});
  const el = render();
  if(prev && !opts.replace){
    el.classList.add("push-in");
    prev.classList.add("push-out");
    setTimeout(()=>{ prev.style.visibility="hidden"; },340);
  } else if(prev && opts.replace){
    prev.remove();
  }
  syncTabbar();
  haptic();
}
function back(){
  if(navStack.length<2) return;
  const cur = stackEl.lastElementChild;
  const prev = cur.previousElementSibling;
  navStack.pop();
  if(prev){ prev.style.visibility="visible"; prev.classList.remove("push-out"); prev.classList.add("pop-in"); }
  cur.classList.add("pop-out");
  setTimeout(()=>cur.remove(),300);
  syncTabbar();
  haptic();
}
function setTab(tab){
  S.activeTab = tab;
  stackEl.innerHTML = "";
  navStack = [{name:tab,props:{}}];
  render();
  syncTabbar();
  haptic();
}
function reload(){
  const cur = navStack[navStack.length-1];
  const el = stackEl.lastElementChild;
  el.innerHTML = SCREENS[cur.name](cur.props||{});
}

function syncTabbar(){
  const tb = $("#tabbar");
  const cur = navStack[navStack.length-1];
  const isRoot = navStack.length===1 && TABS.some(t=>t.id===cur.name);
  tb.classList.toggle("hidden", !isRoot || !S.unlocked);

  if(!isRoot) return;
  tb.innerHTML = TABS.map(t=>`

function toast(msg,ico="✓"){
  const t=$("#toast"); t.innerHTML=`<span>${ico}</span><span>${msg}</span>`;

      actions:[{label:"Cancelar"},{label:"Confiar e conectar",cls:"strong",on:()=>{h.known=true;connect(id);}}]

  connect(id);

function connect(id){
  const h=S.hosts.find(x=>x.id===id);
  let s=S.sessions.find(x=>x.hostId===id);
  if(!s){ s={id:"sess"+Date.now(),hostId:id,cwd:["home",h.user],hist:[],lines:null,openedAt:Date.now()}; S.sessions.push(s); }
  S.activeSession=s.id;
  go("terminal",{sessionId:s.id});
}

        "velox-worker":{t:"d",c:{}}
      }},

      logs:{t:"d",c:{"api.log":{t:"f"},"worker.log":{t:"f"}}},
      "deploy.sh":{t:"f",v:"#!/usr/bin/env bash\nset -euo pipefail\ndocker compose pull\ndocker compose up -d --remove-orphans\ndocker image prune -f"},

function fsAt(parts){ let n={t:"d",c:FS}; for(const p of parts){ if(!n.c||!n.c[p]) return null; n=n.c[p]; } return n; }

function mountTerm(){
  const s=sess(); const out=$("#termout"); if(!out) return;
  $("#ps1").innerHTML = ps1Html();
  if(!s.lines){ s.lines=""; connectAnim(); } else { $("#termlines").innerHTML=s.lines; scrollTerm(); }
  const inp=$("#terminput");
  inp.onkeydown=e=>{
    if(e.key==="Enter"){ e.preventDefault(); exec(inp.value); inp.value=""; }
    if(e.key==="ArrowUp"){ e.preventDefault(); histNav(-1); }
    if(e.key==="ArrowDown"){ e.preventDefault(); histNav(1); }
  };
  setTimeout(()=>inp.focus(),200);
}
function scrollTerm(){ const o=$("#termout"); if(o) o.scrollTop=o.scrollHeight; }
function w(html){ const s=sess(); s.lines+=html; const o=$("#termlines"); if(o){ o.innerHTML=s.lines; scrollTerm(); } }
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function connectAnim(){
  const s=sess(), h=S.hosts.find(x=>x.id===s.hostId);

  const steps=[
    `<span class="d">Termix relay · sessão ${s.id.slice(-6)} · gravação ativada</span>\n`,
    jump?`<span class="d">Abrindo túnel via ${jump.host} (jump host)…</span>\n`:"",
    `<span class="d">Conectando em ${h.host}:${h.port}…</span>\n`,
    `<span class="d">Chave do host confere (${h.fp.slice(0,22)}…)</span>\n`,
    `<span class="d">Autenticando com ${h.auth==='key'?'chave pública '+(S.keys.find(k=>k.id===h.keyId)||{}).name:'senha'}…</span>\n`,
    `\n<span class="bold">Bem-vindo ao Ubuntu 24.04.2 LTS (GNU/Linux 6.8.0-51-generic x86_64)</span>\n`,
    `<span class="d">  Carga do sistema: 0,41    Uso do disco: 38,2% de 80 GB\n  Memória:          62%      Processos: 184\n  Último login: qui 21 ago 2026 07:12:44 de 189.84.220.2</span>\n\n`
  ];
  let i=0;
  (function tick(){
    if(i<steps.length){ w(steps[i++]); setTimeout(tick, i<5?200:60); }
  })();
}

function exec(raw){
  const s=sess(); const cmd=raw.trim();
  w(ps1Html()+esc(raw)+"\n");
  if(cmd){ s.hist.push(cmd); histIdx=-1; }
  const [c,...args]=cmd.split(/\s+/);
  const R = {
    "":()=>"",
    help:()=>`Comandos simulados neste protótipo:\n  <span class="c">ls  cd  pwd  cat  echo  clear  whoami  hostname  uname\n  uptime  df  free  ps  top  docker  systemctl  tail  date  exit</span>\nA barra acima envia teclas de controle (^C, ^D, tab, setas).\n`,
    pwd:()=>"/"+s.cwd.join("/")+"\n",
    whoami:()=>S.hosts.find(x=>x.id===s.hostId).user+"\n",
    hostname:()=>"velox-prod-api\n",
    date:()=>"sex 21 ago 2026 09:41:07 -03\n",
    uname:()=>args[0]==="-a"?"Linux velox-prod-api 6.8.0-51-generic #52-Ubuntu SMP x86_64 GNU/Linux\n":"Linux\n",
    uptime:()=>' 09:41:07 up 47 days,  3:12,  2 users,  load average: 0,41, 0,55, 0,62\n',
    ls:()=>{
      const n=fsAt(s.cwd); if(!n) return `<span class="r">ls: não foi possível acessar</span>\n`;
      const items=Object.entries(n.c||{}).filter(([k])=>args.includes("-a")||args.includes("-la")||!k.startsWith("."));
      if(args.some(a=>a.startsWith("-l")))
        return items.map(([k,v])=>`${v.t==="d"?"drwxr-xr-x":"-rw-r--r--"} 1 deploy deploy ${String(v.t==="d"?4096:1284).padStart(7)} ago 18 14:02 ${v.t==="d"?`<span class="b bold">${k}</span>`:k}`).join("\n")+"\n";
      return items.map(([k,v])=>v.t==="d"?`<span class="b bold">${k}</span>`:k).join("  ")+"\n";
    },
    cd:()=>{
      const t=args[0]||"~";
      if(t==="~"||t==="") { s.cwd=["home",S.hosts.find(x=>x.id===s.hostId).user]; return ""; }
      if(t==="..") { if(s.cwd.length) s.cwd.pop(); return ""; }
      const next=t.startsWith("/")?t.split("/").filter(Boolean):s.cwd.concat(t.split("/").filter(Boolean));
      const n=fsAt(next);
      if(!n||n.t!=="d") return `<span class="r">cd: ${esc(t)}: Arquivo ou diretório inexistente</span>\n`;
      s.cwd=next; return "";
    },
    cat:()=>{
      const n=fsAt(s.cwd.concat(args[0]||""));
      if(!n) return `<span class="r">cat: ${esc(args[0]||"")}: Arquivo ou diretório inexistente</span>\n`;
      if(n.t==="d") return `<span class="r">cat: ${esc(args[0])}: É um diretório</span>\n`;
      return esc(n.v||"(arquivo binário ou vazio)")+"\n";
    },
    echo:()=>args.join(" ")+"\n",
    df:()=>`Sist. Arq.      Tam. Usado Disp. Uso% Montado em\n/dev/root        79G   30G   47G  <span class="y">39%</span> /\n/dev/nvme1n1    400G  118G  262G  <span class="g">31%</span> /var/lib/docker\n`,
    free:()=>`               total      usado     livre   compart.  buff/cache  disponível\nMem:            15Gi      9,4Gi     1,1Gi      312Mi       5,1Gi       5,3Gi\nSwap:          4,0Gi      248Mi     3,8Gi\n`,
    ps:()=>`  PID %CPU %MEM COMMAND\n 1042  2,1  18,4 node dist/main.js\n 1101  0,8  11,2 node dist/worker.js\n  894  0,3   2,1 postgres: velox\n  512  0,1   0,9 dockerd\n`,
    top:()=>`top - 09:41:07 up 47 days,  load average: 0,41 0,55 0,62\nTasks: <span class="c">184</span> total,   2 running\n%Cpu(s):  <span class="g">7,2</span> us,  1,1 sy, 91,4 id\n  PID USER      %CPU %MEM COMMAND\n 1042 deploy     2,1 18,4 node\n 1101 deploy     0,8 11,2 node\n<span class="d">(pressione ^C para sair)</span>\n`,
    docker:()=>args[0]==="ps"
      ? `CONTAINER ID   IMAGE              STATUS                     PORTS      NAMES\na1f9c2d0e4b7   velox-api:2.4      <span class="g">Up 6 days</span>                  3000/tcp   velox-api\n7b3e0a11c982   velox-worker:2.4   <span class="y">Restarting (1) 12s ago</span>            velox-worker\nc4d81e77a30f   redis:7-alpine     <span class="g">Up 6 days</span>                  6379/tcp   velox-redis\n`
      : args[0]==="logs"
      ? `<span class="d">2026-08-21T09:38:12.441Z</span> <span class="c">INFO</span>  [IntegracaoQueue] processando lote 8821 (14 msgs)\n<span class="d">2026-08-21T09:38:12.902Z</span> <span class="y">WARN</span>  [PTW] planejamento recebido antes das missões PC — reenfileirando\n<span class="d">2026-08-21T09:38:13.118Z</span> <span class="c">INFO</span>  [WMS] confirmarColeta OK doc=NF-88213\n<span class="d">^C para parar de seguir</span>\n`
      : `Uso: docker [ps|logs|compose] …\n`,
    systemctl:()=>`<span class="g">●</span> velox-worker.service - Velox WCS Worker\n     Loaded: loaded (/etc/systemd/system/velox-worker.service; enabled)\n     Active: <span class="g">active (running)</span> since Thu 2026-08-15 04:10:22 -03; 6 days ago\n   Main PID: 1101 (node)\n     Memory: 1.7G\n`,
    tail:()=>`<span class="d">…</span>\n[09:40:55] fila=integracao pendentes=<span class="y">37</span> processados=15220\n[09:41:02] ptw explosão caixa=3 destinos=7 status=OK\n`,
    clear:()=>{ s.lines=""; $("#termlines").innerHTML=""; return ""; },
    exit:()=>{ setTimeout(()=>{ killSess(s.id); },300); return `<span class="d">logout\nConexão com ${S.hosts.find(x=>x.id===s.hostId).host} encerrada.</span>\n`; },
    sudo:()=>`[sudo] senha para deploy: <span class="d">(autenticado pelo cofre)</span>\n`+ (args[0]?"":"")
  };
  let out;
  if(c in R) out=R[c]();
  else out=`<span class="r">${esc(c)}: comando não encontrado</span> <span class="d">— digite "help" para ver o que este protótipo simula</span>\n`;
  if(out) w(out);
  $("#ps1").innerHTML = ps1Html();
  scrollTerm();
}

function ins(t){ const i=$("#terminput"); i.value+=t; i.focus(); haptic(); }
function toggleCtrl(){ ctrlOn=!ctrlOn; $("#kctrl").classList.toggle("on",ctrlOn); haptic(); }
function sendKey(k){
  haptic();
  const i=$("#terminput");
  if(k==="tab"){ const s=sess(); const n=fsAt(s.cwd); const pref=i.value.split(" ").pop();
    const hit=Object.keys(n.c||{}).find(x=>x.startsWith(pref)&&pref);
    if(hit){ i.value=i.value.slice(0,i.value.length-pref.length)+hit; } else { w(ps1Html()+esc(i.value)+"\n"); }
    i.focus(); return; }
  if(k==="esc"){ i.focus(); return; }
  if(k==="C"){ w(ps1Html()+esc(i.value)+'<span class="d">^C</span>\n'); i.value=""; i.focus(); return; }
  if(k==="L"){ const s=sess(); s.lines=""; $("#termlines").innerHTML=""; i.focus(); return; }
  if(k==="D"){ exec("exit"); return; }
  if(k==="R"){ w('<span class="d">(reverse-i-search)`\': </span>\n'); i.focus(); return; }
}
function histNav(dir){
  const s=sess(), i=$("#terminput");
  if(!s.hist.length) return;
  if(histIdx===-1) histIdx=s.hist.length;
  histIdx=Math.min(s.hist.length,Math.max(0,histIdx+dir));
  i.value=s.hist[histIdx]||"";
  i.focus(); haptic();
}
function switchSess(id){ S.activeSession=id; navStack[navStack.length-1].props={sessionId:id}; reload(); setTimeout(mountTerm,10); }
function killSess(id){
  S.sessions=S.sessions.filter(x=>x.id!==id);
  if(!S.sessions.length){ back(); return; }
  switchSess(S.sessions[0].id);
}

/* ------------------------- Verificação em 2 etapas --------------------- */
function qrFake(seed){
  let h=0; for(const c of seed) h=(h*31+c.charCodeAt(0))>>>0;
  const n=21, cell=6; let r="";
  const marca=(x,y)=>`<rect x="${x*cell}" y="${y*cell}" width="${cell*7}" height="${cell*7}" fill="#000"/><rect x="${(x+1)*cell}" y="${(y+1)*cell}" width="${cell*5}" height="${cell*5}" fill="#fff"/><rect x="${(x+2)*cell}" y="${(y+2)*cell}" width="${cell*3}" height="${cell*3}" fill="#000"/>`;
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){
    if((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12)) continue;
    h=(h*1103515245+12345)>>>0;
    if((h>>>16)%2) r+=`<rect x="${x*cell}" y="${y*cell}" width="${cell}" height="${cell}" fill="#000"/>`;
  }
  return `<svg width="${n*cell}" height="${n*cell}" viewBox="0 0 ${n*cell} ${n*cell}" style="background:#fff;border-radius:8px;padding:8px;box-sizing:content-box">${r}${marca(0,0)}${marca(14,0)}${marca(0,14)}</svg>`;
}

let castTimer=null,castStep=0;
function playCast(){
  const out=$("#castout"); if(!out) return;
  castTimer=setInterval(()=>{
    if(castStep>=CAST.length){ stopCast(); const b=$("#castbtn"); if(b) b.textContent="↻"; return; }
    out.innerHTML+=CAST[castStep++];
    const bar=$("#castbar"); if(bar) bar.style.width=(castStep/CAST.length*100)+"%";
    const t=$("#casttime"); if(t) t.textContent="0:"+String(castStep*7).padStart(2,"0");
    out.scrollTop=out.scrollHeight;
  },700);
}
function stopCast(){ clearInterval(castTimer); castTimer=null; }
function toggleCast(){
  const b=$("#castbtn");
  if(castTimer){ stopCast(); b.textContent="▶"; }
  else { if(castStep>=CAST.length){ castStep=0; $("#castout").innerHTML=""; } playCast(); b.textContent="⏸"; }
}

function doSearch(q){
  const s=sess(), out=$("#termlines"); if(!out) return;
  if(!q){ out.innerHTML=s.lines; $("#searchinfo").textContent="Digite para destacar as ocorrências no buffer."; return; }
  const re=new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
  let n=0;
  out.innerHTML = s.lines.replace(/>([^<]+)</g,(m,txt)=>">"+txt.replace(re,(x)=>{n++;return `<span style="background:var(--amber);color:#1A1200;border-radius:2px">${x}</span>`;})+"<");
  $("#searchinfo").textContent = n ? `${n} ocorrência${n>1?'s':''} destacada${n>1?'s':''}.` : "Nada encontrado no buffer.";
}
function clearSearch(){ const s=sess(), out=$("#termlines"); if(out&&s) out.innerHTML=s.lines; }

  if(!vv) return;
  const apply = () => {
    if(!isPhone()) { $("#device").style.height = ""; return; }
    $("#device").style.height = vv.height + "px";
    scrollTerm();
  };
  vv.addEventListener("resize", apply);
  vv.addEventListener("scroll", apply);
  window.addEventListener("orientationchange", ()=>setTimeout(apply,250));
  apply();
})();

/* 2) Gesto de voltar arrastando da borda esquerda (padrão iOS) */
(function edgeSwipe(){
  let x0=null,y0=null,el=null,dragging=false;
  stackEl.addEventListener("touchstart",e=>{
    if(navStack.length<2) return;
    const t=e.touches[0];
    if(t.clientX>28) return;
    if(e.target.closest(".keybar,.term-tabs,.searchbar")) return;
    x0=t.clientX; y0=t.clientY; el=stackEl.lastElementChild; dragging=false;
  },{passive:true});
  stackEl.addEventListener("touchmove",e=>{
    if(x0===null) return;
    const t=e.touches[0], dx=t.clientX-x0, dy=Math.abs(t.clientY-y0);
    if(!dragging && (dx<10 || dy>26)) { if(dy>26){x0=null;} return; }
    dragging=true;
    el.style.transition="none";
    el.style.transform=`translateX(${Math.max(0,dx)}px)`;
    el.style.boxShadow="-14px 0 30px rgba(0,0,0,.5)";
  },{passive:true});
  stackEl.addEventListener("touchend",e=>{
    if(x0===null) return;
    const dx=(e.changedTouches[0].clientX)-x0;
    el.style.transition="transform .26s cubic-bezier(.32,.72,0,1)";
    if(dragging && dx>72){ el.style.transform="translateX(100%)"; setTimeout(()=>{el.style.cssText="";back();},60); }
    else { el.style.transform=""; setTimeout(()=>{if(el)el.style.boxShadow="";},260); }
    x0=null; dragging=false;
  },{passive:true});
})();

/* 3) Toque longo = menu de ações (não existe hover nem botão direito) */
(function longPress(){
  let timer=null, fired=false;
  const cancel=()=>clearTimeout(timer);
  document.addEventListener("touchstart",e=>{
    const el=e.target.closest("[data-lp]");
    if(!el) return;
    fired=false;
    timer=setTimeout(()=>{ fired=true; haptic(); navigator.vibrate&&navigator.vibrate(14);
      new Function(el.dataset.lp)(); },480);
  },{passive:true});
  ["touchend","touchmove","touchcancel","scroll"].forEach(ev=>
    document.addEventListener(ev,cancel,{passive:true,capture:true}));
  document.addEventListener("click",e=>{
    if(fired){ e.stopPropagation(); e.preventDefault(); fired=false; }
  },true);
  document.addEventListener("contextmenu",e=>{ if(e.target.closest("[data-lp]")) e.preventDefault(); });
})();

function hostQuick(id){
  const h=S.hosts.find(x=>x.id===id);
  sheet(`<div class="sheet-title">${h.label}</div>
    <div class="sheet-sub">${h.user}@${h.host}:${h.port}</div>
    <div class="list">
      ${row({title:"Conectar",on:`closeSheet();openHost('${id}')`,chev:false})}
      ${row({title:"Abrir arquivos (SFTP)",on:`closeSheet();connect('${id}');setTimeout(()=>go('sftp',{hostId:'${id}'}),400)`,chev:false})}
      ${row({title:"Editar",on:`closeSheet();go('hostForm',{id:'${id}'})`,chev:false})}
      ${row({title:"Duplicar",on:"closeSheet();toast('Host duplicado','📄')",chev:false})}
      ${row({title:"Copiar comando ssh",on:`closeSheet();toast('ssh ${h.user}@${h.host} -p ${h.port}','📋')`,chev:false})}
    </div>
    <div class="pad-h mt"><button class="btn gray" onclick="closeSheet()">Cancelar</button></div>`);
}

/* 4) Pinça ajusta a fonte do terminal (gesto nativo, sem entrar em Ajustes) */
(function pinchZoom(){
  let base=0, fs0=0;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
  document.addEventListener("touchstart",e=>{
    if(e.touches.length!==2 || !e.target.closest("#termout,.term-input-line")) return;
    base=dist(e.touches); fs0=S.cfg.fontSize;
  },{passive:true});
  document.addEventListener("touchmove",e=>{
    if(e.touches.length!==2 || !base) return;
    if(!e.target.closest("#termout,.term-input-line")) return;
    const fs=Math.min(20,Math.max(8, fs0*(dist(e.touches)/base)));
    setTermFont(Math.round(fs*10)/10);
  },{passive:true});
  document.addEventListener("touchend",()=>{ base=0; },{passive:true});
})();

function setTermFont(fs){
  S.cfg.fontSize=fs;
  document.documentElement.style.setProperty("--term-fs", fs+"px");
  const i=$("#terminput");
  if(i){ const k=fs/16; i.style.transform=`scale(${k})`; i.style.width=(100/k)+"%"; }
  scrollTerm();
}

/* 5) Tocar na saída foca o prompt e chama o teclado */
document.addEventListener("click",e=>{
  if(e.target.closest("#termout")){ const i=$("#terminput"); if(i) i.focus(); }
});

render();
syncTabbar();
setInterval(()=>{ const d=new Date(); $("#sb-time").textContent=d.getHours()+":"+String(d.getMinutes()).padStart(2,"0"); },1000);
