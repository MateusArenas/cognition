# Postgres dos dados PRÓPRIOS do backend (usuários, roles, permissões CASL, conexões salvas) —
# ver docs/17-db-client.md. NÃO é um banco de exemplo pra testar o cliente de banco em si (o
# app conecta em QUALQUER banco pela tela de Conexão, isso aqui não tem nada a ver com aquilo).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dbmobile
      POSTGRES_PASSWORD: dbmobile
      POSTGRES_DB: dbmobile
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dbmobile']
      interval: 5s
      timeout: 5s
      retries: 5

  # Só entra em jogo pra publicar de verdade (VPS) — ver docs/17-db-client.md §"Deploy em VPS".
  # Local, continua mais rápido rodar `cd backend && npm run start:dev` direto (hot reload).
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      # Sobrepõe o que estiver em backend/.env: dentro da rede do compose o Postgres não é
      # "localhost", é o nome do serviço (DNS interno do compose).
      DATABASE_URL: postgresql://dbmobile:dbmobile@db:5432/dbmobile?schema=public
    ports:
      - '3333:3333'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
