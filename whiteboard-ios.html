<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<title>Rabisco</title>
<style>
/* =========================================================================
   Design tokens — espelham UIKit (semantic colors, materials, type ramp)
   ========================================================================= */
:root{
  color-scheme: light dark;

  --sf:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --hand:"Bradley Hand","Chalkboard SE","Comic Sans MS","Segoe Print",cursive;

  /* light */
  --paper:#FFFFFF;
  --dot:rgba(60,60,67,.18);
  --bg-grouped:#F2F2F7;
  --bg-card:#FFFFFF;
  --label:#1C1C1E;
  --label-2:rgba(60,60,67,.60);
  --label-3:rgba(60,60,67,.30);
  --separator:rgba(60,60,67,.29);
  --fill-1:rgba(120,120,128,.12);
  --fill-2:rgba(120,120,128,.16);
  --material:rgba(249,249,249,.80);
  --material-thick:rgba(255,255,255,.94);
  --blue:#007AFF;
  --red:#FF3B30;
  --shadow-1:0 1px 2px rgba(0,0,0,.06), 0 6px 20px rgba(0,0,0,.10);
  --shadow-2:0 10px 40px rgba(0,0,0,.18);
  --hairline:.5px;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#161618;
    --dot:rgba(235,235,245,.16);
    --bg-grouped:#000000;
    --bg-card:#1C1C1E;
    --label:#FFFFFF;
    --label-2:rgba(235,235,245,.60);
    --label-3:rgba(235,235,245,.30);
    --separator:rgba(84,84,88,.65);
    --fill-1:rgba(120,120,128,.24);
    --fill-2:rgba(120,120,128,.32);
    --material:rgba(37,37,39,.80);
    --material-thick:rgba(44,44,46,.94);
    --blue:#0A84FF;
    --red:#FF453A;
    --shadow-1:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.5);
    --shadow-2:0 10px 40px rgba(0,0,0,.6);
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--paper);font-family:var(--sf);color:var(--label)}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#stage{position:fixed;inset:0;touch-action:none}

.mat{
  background:var(--material);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  backdrop-filter:blur(30px) saturate(180%);
  box-shadow:var(--shadow-1);
}
.sq{border-radius:22px;border-curve:continuous;-webkit-border-curve:continuous}

/* SVG Lucide — stroke 2, cap/join round, 24px grid */
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block}
svg.ic.sm{width:19px;height:19px}

/* ===================== nav bar ===================== */
.nav{
  position:fixed;left:0;right:0;top:0;z-index:30;
  padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;
  display:flex;align-items:center;gap:10px;pointer-events:none;
}
.navtitle{
  position:absolute;left:0;right:0;text-align:center;
  font:590 15px/1.2 var(--sf);letter-spacing:-.24px;color:var(--label-2);pointer-events:none;
}
.capsule{display:flex;align-items:center;border-radius:19px;border-curve:continuous;pointer-events:auto;overflow:hidden}
.navbtn{
  width:38px;height:38px;display:grid;place-items:center;color:var(--label);
  transition:background .12s;
}
.navbtn:active{background:var(--fill-2)}
.navbtn:disabled{color:var(--label-3)}
.divider{width:var(--hairline);height:22px;background:var(--separator);flex:none}
.spacer{flex:1}

/* ===================== zoom HUD (transitório) ===================== */
.hud{
  position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 62px);transform:translate(-50%,-6px);
  z-index:29;border-radius:14px;border-curve:continuous;padding:7px 14px;
  font:600 13px/1 var(--sf);letter-spacing:-.08px;color:var(--label);
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;
}
.hud.on{opacity:1;transform:translate(-50%,0)}

/* ===================== dock ===================== */
.dock{
  position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 10px);
  z-index:30;padding:6px;display:flex;align-items:center;gap:2px;
  border-radius:24px;border-curve:continuous;
}
.tool{
  flex:1;height:48px;border-radius:18px;border-curve:continuous;
  display:grid;place-items:center;color:var(--label);position:relative;
  transition:background .18s cubic-bezier(.32,.72,0,1),color .18s,transform .12s;
}
.tool:active{transform:scale(.9)}
.tool.on{background:var(--blue);color:#fff}
.tool .caret{
  position:absolute;right:6px;bottom:6px;width:0;height:0;
  border-left:3.5px solid transparent;border-right:3.5px solid transparent;
  border-top:4px solid currentColor;opacity:.45;
}
.tool.on .caret{opacity:.85}
.dock .divider{margin:0 4px;height:26px}
.swatchBtn{
  width:48px;height:48px;border-radius:18px;border-curve:continuous;display:grid;place-items:center;
  transition:background .18s,transform .12s;
}
.swatchBtn:active{transform:scale(.9)}
.swatchBtn .dot{
  width:26px;height:26px;border-radius:50%;display:block;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.9), 0 0 0 1px var(--separator);
}

/* ===================== popover de formas ===================== */
.pop{
  position:fixed;z-index:31;border-radius:20px;border-curve:continuous;padding:6px;
  display:flex;gap:2px;
  transform-origin:bottom center;transform:translateX(-50%) scale(.86);opacity:0;pointer-events:none;
  transition:opacity .16s,transform .24s cubic-bezier(.32,.72,0,1);
}
.pop.on{opacity:1;transform:translateX(-50%) scale(1);pointer-events:auto}
.pop button{width:46px;height:46px;border-radius:15px;border-curve:continuous;display:grid;place-items:center;transition:background .15s}
.pop button.on{background:var(--blue);color:#fff}
.pop button:active{background:var(--fill-2)}

/* ===================== menu iOS ===================== */
.scrim{position:fixed;inset:0;z-index:32;background:rgba(0,0,0,.001);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.scrim.dim{background:rgba(0,0,0,.28)}
.menu{
  position:fixed;right:14px;top:calc(env(safe-area-inset-top) + 54px);z-index:33;
  width:258px;border-radius:14px;border-curve:continuous;overflow:hidden;
  background:var(--material-thick);
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  box-shadow:var(--shadow-2);
  transform-origin:top right;transform:scale(.9);opacity:0;pointer-events:none;
  transition:opacity .16s,transform .22s cubic-bezier(.32,.72,0,1);
}
.menu.on{opacity:1;transform:scale(1);pointer-events:auto}
.menu button{
  width:100%;height:44px;padding:0 16px;display:flex;align-items:center;
  font:400 17px/1 var(--sf);letter-spacing:-.41px;text-align:left;
}
.menu button:active{background:var(--fill-1)}
.menu button svg{margin-left:auto}         /* iOS: ícone à direita */
.menu button.destructive{color:var(--red)}
.menu .sep{height:var(--hairline);background:var(--separator);margin-left:0}
.menu .sepblock{height:8px;background:var(--separator);opacity:.5}

/* ===================== edit menu (seleção) ===================== */
.edit{
  position:fixed;z-index:31;border-radius:16px;border-curve:continuous;overflow:hidden;
  display:flex;align-items:center;
  transform:translate(-50%,-100%) scale(.86);opacity:0;pointer-events:none;transform-origin:bottom center;
  transition:opacity .14s,transform .22s cubic-bezier(.32,.72,0,1);
}
.edit.on{opacity:1;transform:translate(-50%,-100%) scale(1);pointer-events:auto}
.edit button{width:46px;height:44px;flex:none;display:grid;place-items:center;transition:background .12s}
.edit button:active{background:var(--fill-2)}
.edit button.destructive{color:var(--red)}

/* ===================== sheet ===================== */
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:34;
  background:var(--bg-grouped);
  border-radius:14px 14px 0 0;border-curve:continuous;
  box-shadow:var(--shadow-2);
  transform:translateY(110%);transition:transform .42s cubic-bezier(.32,.72,0,1);
  padding-bottom:calc(env(safe-area-inset-bottom) + 18px);
  max-height:84vh;display:flex;flex-direction:column;
}
.sheet.on{transform:translateY(0)}
.grab{padding:8px 0 2px;display:grid;place-items:center;flex:none;touch-action:none}
.grab i{width:36px;height:5px;border-radius:3px;background:var(--label-3);display:block}
.sheethead{
  display:flex;align-items:center;padding:2px 16px 12px;flex:none;
}
.sheethead h2{margin:0;font:700 20px/1.2 var(--sf);letter-spacing:-.45px}
.sheethead button{
  margin-left:auto;font:590 17px/1 var(--sf);letter-spacing:-.41px;color:var(--blue);padding:6px 2px;
}
.sheetbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 8px}

.grouplabel{
  font:400 13px/1.3 var(--sf);letter-spacing:-.08px;color:var(--label-2);
  text-transform:uppercase;padding:14px 16px 7px;
}
.card{background:var(--bg-card);border-radius:10px;border-curve:continuous;overflow:hidden}
.cell{padding:12px 16px}
.cell + .cell{box-shadow:inset 0 var(--hairline) 0 var(--separator)}
.cell.flex{display:flex;align-items:center;gap:12px;min-height:44px}
.cell .name{font:400 17px/1 var(--sf);letter-spacing:-.41px;flex:none}
.cell .val{margin-left:auto;font:400 17px/1 var(--sf);color:var(--label-2)}

/* paleta de cores (estilo Markup) */
.palette{display:flex;gap:0;justify-content:space-between;flex-wrap:wrap}
.chip{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;position:relative}
.chip i{width:28px;height:28px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.10)}
.chip.on::after{
  content:'';position:absolute;inset:0;border-radius:50%;
  box-shadow:0 0 0 2.5px var(--blue), inset 0 0 0 2.5px var(--bg-card);
}
.chip.none i{
  background:var(--bg-card);
  box-shadow:inset 0 0 0 1.5px var(--separator);
  position:relative;overflow:hidden;
}
.chip.none i::after{
  content:'';position:absolute;left:-4px;top:12.5px;width:36px;height:1.5px;background:var(--red);
  transform:rotate(-45deg);transform-origin:center;
}

/* segmented control iOS */
.seg{
  display:flex;background:var(--fill-1);border-radius:9px;border-curve:continuous;padding:2px;gap:2px;
}
.seg button{
  flex:1;height:32px;border-radius:7px;border-curve:continuous;
  font:590 13px/1 var(--sf);letter-spacing:-.08px;color:var(--label);
  display:grid;place-items:center;transition:background .18s,box-shadow .18s;
}
.seg button.on{background:var(--bg-card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
.seg button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-linecap:round}

/* slider iOS */
.slider{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:var(--fill-2);outline:0;margin:10px 0 4px}
.slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.2),0 3px 8px rgba(0,0,0,.16);cursor:pointer;
}
.slider::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}

/* ===================== barra de IA ===================== */
.aibar{
  position:fixed;left:10px;right:10px;
  bottom:calc(env(safe-area-inset-bottom) + 10px + var(--kb, 0px));
  z-index:36;border-radius:26px;border-curve:continuous;padding:10px;
  transform:translateY(140%);opacity:0;pointer-events:none;
  transition:transform .42s cubic-bezier(.32,.72,0,1),opacity .2s,bottom .25s;
}
.aibar.on{transform:translateY(0);opacity:1;pointer-events:auto}
.aitarget{display:flex;gap:6px;padding:0 4px 9px}
.aichip{
  height:30px;padding:0 13px;border-radius:15px;border-curve:continuous;
  background:var(--fill-1);color:var(--label-2);
  font:590 13px/1 var(--sf);letter-spacing:-.08px;display:flex;align-items:center;gap:6px;
  transition:background .16s,color .16s;
}
.aichip.on{background:var(--blue);color:#fff}
.aichip[disabled]{opacity:.35}
.aichip svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.airow{display:flex;align-items:flex-end;gap:8px}
#aiInput{
  flex:1;border:0;outline:0;background:transparent;resize:none;overflow:hidden;
  font:400 17px/1.3 var(--sf);letter-spacing:-.41px;color:var(--label);
  padding:8px 4px 8px 10px;max-height:120px;-webkit-user-select:text;user-select:text;
}
#aiInput::placeholder{color:var(--label-3)}
.aisend{
  width:38px;height:38px;flex:none;border-radius:19px;background:var(--blue);color:#fff;
  display:grid;place-items:center;transition:opacity .16s,transform .12s;
}
.aisend:active{transform:scale(.9)}
.aisend[disabled]{opacity:.3}
.aisend svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.aisend.busy svg{display:none}
.aisend.busy::after{
  content:'';width:17px;height:17px;border-radius:50%;
  border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.aihints{display:flex;gap:6px;overflow-x:auto;padding:9px 4px 0;scrollbar-width:none}
.aihints::-webkit-scrollbar{display:none}
.aihint{
  flex:none;height:30px;padding:0 13px;border-radius:15px;border-curve:continuous;
  background:var(--fill-1);color:var(--label-2);font:400 13px/1 var(--sf);letter-spacing:-.08px;
  display:flex;align-items:center;white-space:nowrap;
}
.aihint:active{background:var(--fill-2)}
.aibtn{position:relative}
.aibtn svg{color:var(--blue)}

/* ===================== action sheet ===================== */
.asheet{
  position:fixed;left:0;right:0;bottom:0;z-index:37;
  padding:0 8px calc(env(safe-area-inset-bottom) + 8px);
  transform:translateY(110%);transition:transform .42s cubic-bezier(.32,.72,0,1);
  pointer-events:none;
}
.asheet.on{transform:translateY(0);pointer-events:auto}
.asheet .grp{
  background:var(--material-thick);
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  border-radius:14px;border-curve:continuous;overflow:hidden;margin-top:8px;
}
.asheet .head{padding:16px 16px 14px;text-align:center}
.asheet .head strong{display:block;font:590 13px/1.35 var(--sf);letter-spacing:-.08px;color:var(--label-2)}
.asheet .head span{display:block;margin-top:3px;font:400 13px/1.35 var(--sf);color:var(--label-3)}
.asheet .head + .opt{box-shadow:inset 0 var(--hairline) 0 var(--separator)}
.asheet .opt{
  width:100%;min-height:57px;padding:10px 16px;display:flex;align-items:center;gap:14px;
  font:400 20px/1.2 var(--sf);letter-spacing:-.45px;color:var(--blue);text-align:left;
}
.asheet .opt + .opt{box-shadow:inset 0 var(--hairline) 0 var(--separator)}
.asheet .opt:active{background:var(--fill-1)}
.asheet .opt .lbl{display:flex;flex-direction:column;gap:2px}
.asheet .opt .lbl b{font:400 20px/1.2 var(--sf);letter-spacing:-.45px}
.asheet .opt .lbl small{font:400 13px/1.25 var(--sf);letter-spacing:-.08px;color:var(--label-3)}
.asheet .opt svg{width:24px;height:24px;flex:none}
.asheet .cancel{
  width:100%;min-height:57px;font:590 20px/1 var(--sf);letter-spacing:-.45px;color:var(--blue);
}
.asheet .cancel:active{background:var(--fill-1)}

/* ===================== empty state ===================== */
.empty{
  position:fixed;left:0;right:0;top:50%;transform:translateY(-58%);text-align:center;
  pointer-events:none;z-index:5;transition:opacity .45s;padding:0 40px;
}
.empty svg{width:44px;height:44px;stroke:var(--label-3);stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round;margin:0 auto 14px;display:block}
.empty h1{font:700 22px/1.25 var(--sf);letter-spacing:-.45px;color:var(--label-2);margin:0 0 6px}
.empty p{font:400 15px/1.4 var(--sf);letter-spacing:-.24px;color:var(--label-3);margin:0}
.empty.gone{opacity:0}

/* ===================== toast ===================== */
.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 82px);transform:translate(-50%,12px);
  z-index:35;border-radius:16px;border-curve:continuous;padding:11px 18px;
  font:590 15px/1 var(--sf);letter-spacing:-.24px;color:var(--label);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .28s cubic-bezier(.32,.72,0,1);
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ===================== editor de texto ===================== */
#txt{
  position:fixed;z-index:36;border:0;outline:0;background:transparent;resize:none;overflow:hidden;
  font-family:var(--hand);line-height:1.25;padding:0;margin:0;white-space:pre;display:none;
  caret-color:var(--blue);-webkit-user-select:text;user-select:text;
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="stage"><canvas id="c"></canvas></div>

<div class="empty" id="empty">
  <svg viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>
  <h1>Quadro em branco</h1>
  <p>Um dedo desenha. Dois dedos movem e ampliam.</p>
</div>

<!-- ================= NAV ================= -->
<div class="nav">
  <div class="navtitle">Rabisco</div>
  <div class="capsule mat" role="group">
    <button class="navbtn" id="undo" disabled aria-label="Desfazer"></button>
    <span class="divider"></span>
    <button class="navbtn" id="redo" disabled aria-label="Refazer"></button>
  </div>
  <span class="spacer"></span>
  <div class="capsule mat">
    <button class="navbtn aibtn" id="aiBtn" aria-label="Assistente"></button>
    <span class="divider"></span>
    <button class="navbtn" id="menuBtn" aria-label="Mais"></button>
  </div>
</div>

<div class="hud mat" id="hud">100%</div>

<!-- ================= MENU ================= -->
<div class="scrim" id="menuScrim"></div>
<div class="menu" id="menu">
  <button data-act="fit">Enquadrar tudo</button>
  <div class="sep"></div>
  <button data-act="reset">Zoom 100%</button>
  <div class="sep"></div>
  <button data-act="all">Selecionar tudo</button>
  <div class="sepblock"></div>
  <button data-act="ai">Assistente</button>
  <div class="sepblock"></div>
  <button data-act="copy">Copiar seleção</button>
  <div class="sep"></div>
  <button data-act="paste">Colar</button>
  <div class="sep"></div>
  <button data-act="grid"><span id="gridLabel">Ocultar grade</span></button>
  <div class="sepblock"></div>
  <button data-act="export">Exportar…</button>
  <div class="sep"></div>
  <button data-act="json">Salvar quadro</button>
  <div class="sep"></div>
  <button data-act="open">Abrir quadro</button>
  <div class="sepblock"></div>
  <button data-act="clear" class="destructive">Apagar tudo</button>
</div>

<!-- ================= EDIT MENU ================= -->
<div class="edit mat" id="edit">
  <button data-act="label" aria-label="Escrever dentro"></button>
  <span class="divider"></span>
  <button data-act="style" aria-label="Estilo"></button>
  <span class="divider"></span>
  <button data-act="dup" aria-label="Duplicar"></button>
  <span class="divider"></span>
  <button data-act="front" aria-label="Trazer para frente"></button>
  <span class="divider"></span>
  <button data-act="del" class="destructive" aria-label="Apagar"></button>
</div>

<!-- ================= FORMAS ================= -->
<div class="pop mat" id="shapePop"></div>

<!-- ================= DOCK ================= -->
<div class="dock mat" id="dock"></div>

<!-- ================= SHEET ================= -->
<div class="scrim dim" id="sheetScrim"></div>
<div class="sheet" id="sheet">
  <div class="grab" id="grab"><i></i></div>
  <div class="sheethead"><h2>Estilo</h2><button id="sheetDone">OK</button></div>
  <div class="sheetbody">

    <div class="grouplabel">Traço</div>
    <div class="card">
      <div class="cell"><div class="palette" id="strokes"></div></div>
      <div class="cell"><div class="seg" id="strokeWidth"></div></div>
      <div class="cell"><div class="seg" id="strokeStyle"></div></div>
    </div>

    <div class="grouplabel" id="edgeLabel">Bordas</div>
    <div class="card" id="edgeCard">
      <div class="cell"><div class="seg" id="edges"></div></div>
    </div>

    <div class="grouplabel" id="arrowLabel">Tipo de seta</div>
    <div class="card" id="arrowCard">
      <div class="cell"><div class="seg" id="arrowType"></div></div>
    </div>

    <div class="grouplabel" id="fillLabel">Preenchimento</div>
    <div class="card" id="fillCard">
      <div class="cell"><div class="palette" id="fills"></div></div>
      <div class="cell" id="fillStyleCell"><div class="seg" id="fillStyle"></div></div>
    </div>

function mulberry32(a){
  return function(){

function normalize(el){
  if (el.points) return el;
  if (el.w < 0){ el.x += el.w; el.w = -el.w; }
  if (el.h < 0){ el.y += el.h; el.h = -el.h; }

}

function bounds(el){
  if (el.points){
    const abs = LINEAR.includes(el.type) ? resolvedPoints(el) : el.points.map(q=>[el.x+q[0], el.y+q[1]]);
    let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;
    for (const p of abs){ a=Math.min(a,p[0]);b=Math.min(b,p[1]);c=Math.max(c,p[0]);d=Math.max(d,p[1]); }
    return {x:a, y:b, w:Math.max(c-a,1), h:Math.max(d-b,1)};
  }
  const x = el.w<0 ? el.x+el.w : el.x, y = el.h<0 ? el.y+el.h : el.y;
  return {x, y, w:Math.abs(el.w)||1, h:Math.abs(el.h)||1};
}

  let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;
  for (const e of list){ const g=bounds(e); a=Math.min(a,g.x);b=Math.min(b,g.y);c=Math.max(c,g.x+g.w);d=Math.max(d,g.y+g.h); }

const nn = v => Number.isFinite(v) ? Math.round(v*100)/100 : 0;

function PB(){
  let d = '';
  return {
    m(x,y){ d += `M${nn(x)} ${nn(y)}`; },
    l(x,y){ d += `L${nn(x)} ${nn(y)}`; },
    q(cx,cy,x,y){ d += `Q${nn(cx)} ${nn(cy)} ${nn(x)} ${nn(y)}`; },
    c(a,b,c2,d2,x,y){ d += `C${nn(a)} ${nn(b)} ${nn(c2)} ${nn(d2)} ${nn(x)} ${nn(y)}`; },
    z(){ d += 'Z'; },
    get d(){ return d; },
  };
}

function smooth(p, pts){
  if (pts.length < 2) return;
  p.m(pts[0][0], pts[0][1]);
  for (let i=1;i<pts.length-1;i++){
    const mx=(pts[i][0]+pts[i+1][0])/2, my=(pts[i][1]+pts[i+1][1])/2;
    p.q(pts[i][0], pts[i][1], mx, my);
  }
  const n = pts[pts.length-1]; p.l(n[0], n[1]);
}
function roughSeg(p, x1,y1,x2,y2, r, rnd){
  const len = Math.hypot(x2-x1, y2-y1);
  const amp = Math.min(r*(0.6 + Math.min(len,300)/300*0.9), 12);
  const j = () => (rnd()-0.5)*amp*2;
  p.m(x1+j()*.5, y1+j()*.5);
  p.c(x1+(x2-x1)*0.3+j(), y1+(y2-y1)*0.3+j(),
      x1+(x2-x1)*0.7+j(), y1+(y2-y1)*0.7+j(),
      x2+j()*.5, y2+j()*.5);
}
function roughPoly(p, pts, r, rnd){
  if (r === 0){ smooth(p, pts); return; }
  for (let k=0;k<2;k++)
    for (let i=0;i<pts.length-1;i++)
      roughSeg(p, pts[i][0],pts[i][1], pts[i+1][0],pts[i+1][1], r, rnd);
}
function roughEllipse(p, cx,cy,rx,ry, r, rnd){
  const n = clamp(Math.round((rx+ry)/7), 10, 40), passes = r===0?1:2;
  for (let k=0;k<passes;k++){
    const pts=[], a0 = r===0?0:rnd()*Math.PI*2;
    for (let i=0;i<=n;i++){
      const a = a0 + (i/n)*Math.PI*2;
      pts.push([cx+Math.cos(a)*rx + (r?(rnd()-0.5)*r*2:0),
                cy+Math.sin(a)*ry + (r?(rnd()-0.5)*r*2:0)]);
    }
    pts.push(pts[1]); smooth(p, pts);
  }
}

/* elipse exata como 4 cúbicas — mesma curva em canvas, svg e pdf */
const KAPPA = 0.5522847498307936;
function ellipseD(cx,cy,rx,ry){
  const ox=rx*KAPPA, oy=ry*KAPPA, p=PB();

  p.c(cx-rx,cy-oy, cx-ox,cy-ry, cx,cy-ry);
  p.c(cx+ox,cy-ry, cx+rx,cy-oy, cx+rx,cy);
  p.c(cx+rx,cy+oy, cx+ox,cy+ry, cx,cy+ry);
  p.c(cx-ox,cy+ry, cx-rx,cy+oy, cx-rx,cy);
  p.z();
  return p.d;
}
/* contorno "limpo" — usado para preencher e para recortar a hachura */
function polyOf(el){

    return [[g.x,g.y],[g.x+g.w,g.y],[g.x+g.w,g.y+g.h],[g.x,g.y+g.h]];
  if (el.type==='diamond')
    return [[g.x+g.w/2,g.y],[g.x+g.w,g.y+g.h/2],[g.x+g.w/2,g.y+g.h],[g.x,g.y+g.h/2]];
  return null;
}
function solidD(el){
  const g = bounds(el);
  if (el.type==='ellipse') return ellipseD(g.x+g.w/2, g.y+g.h/2, g.w/2, g.h/2);

  const r = cornerRadius(el), p = PB();
  if (r <= 0.5){
    p.m(pts[0][0],pts[0][1]);
    for (let i=1;i<pts.length;i++) p.l(pts[i][0],pts[i][1]);
    p.z(); return p.d;
  }
  const cs = corners(pts, r);
  p.m(cs[0].out[0], cs[0].out[1]);
  for (let i=0;i<cs.length;i++){
    const nx = cs[(i+1)%cs.length];
    p.l(nx.in[0], nx.in[1]);
    p.q(nx.c[0], nx.c[1], nx.out[0], nx.out[1]);
  }
  p.z(); return p.d;
}
function hachureD(el){
  const g = bounds(el), rnd = mulberry32(el.seed ^ 0x5f), p = PB();
  const gap = 9, span = g.w + g.h;
  for (const dir of (el.fillStyle==='cross' ? [1,-1] : [1]))
    for (let i=-span; i<span; i+=gap)
      roughSeg(p, g.x+i, g.y-4, g.x+i+dir*(g.h+8), g.y+g.h+4, 1.2, rnd);
  return p.d;
}
function dash(el){
  const u = Math.max(el.strokeWidth,1.6);
  if (el.strokeStyle==='dashed') return [u*4, u*3.2];
  if (el.strokeStyle==='dotted') return [0.1, u*2.6];
  return [];
}

/* ---- setas ancoradas ---------------------------------------------------- */
function insideShape(el, p, tol=0){
  const g = bounds(el);
  const cx = g.x+g.w/2, cy = g.y+g.h/2;
  if (el.type==='ellipse')
    return ((p.x-cx)/(g.w/2+tol))**2 + ((p.y-cy)/(g.h/2+tol))**2 <= 1;
  if (el.type==='diamond')
    return Math.abs(p.x-cx)/(g.w/2+tol) + Math.abs(p.y-cy)/(g.h/2+tol) <= 1;
  return p.x>=g.x-tol && p.x<=g.x+g.w+tol && p.y>=g.y-tol && p.y<=g.y+g.h+tol;
}
/* forma sob o dedo que aceita ancoragem */
function pickBindable(p, excludeId){
  const tol = 10/S.zoom;
  for (let i=S.els.length-1;i>=0;i--){
    const el = S.els[i];
    if (el.id===excludeId || !BINDABLE.includes(el.type)) continue;
    if (insideShape(el, p, tol)) return el;
  }
  return null;
}
const bindTarget = (b) => b && S.els.find(e => e.id===b.id && BINDABLE.includes(e.type));

/* ---- ponto de âncora cravado ---------------------------------------------
   A âncora guarda a posição do encosto NA BORDA da forma, normalizada sobre
   os semi-eixos (-1..1 a partir do centro). Como é normalizada, mover ou
   redimensionar a forma leva o ponto junto, proporcionalmente.

   A versão anterior mirava o centro a partir do ponto vizinho: o encosto
   deslizava sozinho quando a outra ponta se mexia, e arrastar a ponta
   ancorada não movia nada. Aqui o ponto é fixo — nada além da própria forma
   o desloca. */

/* projeção de um ponto sobre um segmento */
function projSeg(p, a, b){
  const dx=b[0]-a[0], dy=b[1]-a[1], L=dx*dx+dy*dy;
  let t = L ? ((p.x-a[0])*dx + (p.y-a[1])*dy)/L : 0; t = clamp(t,0,1);
  return {x:a[0]+dx*t, y:a[1]+dy*t};
}
/* ponto da BORDA mais próximo de p */
function boundaryPoint(shape, p){
  const g = bounds(shape), cx = g.x+g.w/2, cy = g.y+g.h/2;
  if (shape.type === 'ellipse'){
    let dx = p.x-cx, dy = p.y-cy;
    if (!dx && !dy) dy = -1;
    const k = 1/Math.hypot(dx/(g.w/2 || 1), dy/(g.h/2 || 1));
    return {x:cx+dx*k, y:cy+dy*k};
  }
  const poly = shape.type === 'diamond'
    ? [[cx,g.y],[g.x+g.w,cy],[cx,g.y+g.h],[g.x,cy]]
    : [[g.x,g.y],[g.x+g.w,g.y],[g.x+g.w,g.y+g.h],[g.x,g.y+g.h]];
  let best = null, bd = Infinity;
  for (let i=0;i<poly.length;i++){
    const q = projSeg(p, poly[i], poly[(i+1)%poly.length]);
    const d = Math.hypot(p.x-q.x, p.y-q.y);
    if (d < bd){ bd = d; best = q; }
  }
  return best;
}
/* âncora a partir de onde o dedo está */
function bindingAt(shape, p){
  const g = bounds(shape), a = boundaryPoint(shape, p);
  return {
    id: shape.id,
    fx: (a.x - (g.x+g.w/2)) / (g.w/2 || 1),
    fy: (a.y - (g.y+g.h/2)) / (g.h/2 || 1),
  };
}
/* Onde a seta encosta. Com fx/fy é resolução direta — sem bissecção, sem
   depender do outro extremo. A folga sai pela normal aproximada (centro→ponto). */
function bindPoint(shape, from, b){
  const g = bounds(shape), cx = g.x+g.w/2, cy = g.y+g.h/2;
  if (b && b.fx !== undefined && (b.fx || b.fy)){
    const ax = cx + b.fx*g.w/2, ay = cy + b.fy*g.h/2;
    const dx = ax-cx, dy = ay-cy, L = Math.hypot(dx,dy) || 1;
    return [ax + dx/L*GAP, ay + dy/L*GAP];
  }
  /* cenas antigas, sem ponto cravado: mira o centro a partir do vizinho */
  const c = {x:cx, y:cy};
  if (insideShape(shape, {x:from[0], y:from[1]})) return [c.x, c.y];
  let lo=0, hi=1;
  for (let i=0;i<24;i++){
    const k=(lo+hi)/2;
    const q={x:from[0]+(c.x-from[0])*k, y:from[1]+(c.y-from[1])*k};
    if (insideShape(shape,q)) hi=k; else lo=k;
  }
  const bx = from[0]+(c.x-from[0])*hi, by = from[1]+(c.y-from[1])*hi;
  const dx = c.x-from[0], dy = c.y-from[1], L = Math.hypot(dx,dy) || 1;
  return [bx - dx/L*GAP, by - dy/L*GAP];
}

/* Direção de saída de um cotovelo: normal do lado mais próximo */
function headingAt(shape, pt){
  if (!shape) return null;
  const g = bounds(shape), cx = g.x+g.w/2, cy = g.y+g.h/2;
  return Math.abs(pt[0]-cx)/(g.w/2||1) >= Math.abs(pt[1]-cy)/(g.h/2||1) ? 'h' : 'v';
}
function elbowRoute(a, b, ha, hb, bend){
  const dx = b[0]-a[0], dy = b[1]-a[1];
  if (Math.abs(dx) < 1 || Math.abs(dy) < 1) return [a,b];
  const startH = ha ? ha==='h' : (hb ? hb!=='h' : Math.abs(dx) >= Math.abs(dy));
  const k = bend || 0;                     /* separa o trecho comum de setas irmãs */
  const pts = startH
    ? [a, [a[0]+dx/2+k, a[1]], [a[0]+dx/2+k, b[1]], b]
    : [a, [a[0], a[1]+dy/2+k], [b[0], a[1]+dy/2+k], b];
  /* remove pontos coincidentes */
  return pts.filter((q,i) => i===0 || Math.hypot(q[0]-pts[i-1][0], q[1]-pts[i-1][1]) > 0.5);
}

/* Pontos absolutos já com ancoragem e roteamento aplicados. */
function resolvedPoints(el){
  if (!el.points) return null;
  let pts = el.points.map(q=>[el.x+q[0], el.y+q[1]]);
  if (!LINEAR.includes(el.type) || pts.length < 2) return pts;

  const sb = bindTarget(el.startBinding), eb = bindTarget(el.endBinding);
  if (sb) pts[0] = bindPoint(sb, pts[1], el.startBinding);
  if (eb) pts[pts.length-1] = bindPoint(eb, pts[pts.length-2], el.endBinding);

  if (el.arrowType === 'elbow'){
    const a = pts[0], b = pts[pts.length-1];
    return elbowRoute(a, b, headingAt(sb, a), headingAt(eb, b), el.bend || 0);
  }
  return pts;
}

/* ---- cantos arredondados ------------------------------------------------ */
function cornerRadius(el){
  if (el.edges !== 'round' || !['rect','diamond'].includes(el.type)) return 0;
  const g = bounds(el);
  return Math.min(Math.min(g.w, g.h) * 0.25, 32);
}
/* para cada vértice: ponto de entrada, o próprio vértice (controle) e ponto de saída */
function corners(pts, r){
  const n = pts.length, out = [];
  for (let i=0;i<n;i++){
    const p=pts[i], pv=pts[(i-1+n)%n], nx=pts[(i+1)%n];
    const d1=Math.hypot(p[0]-pv[0], p[1]-pv[1])||1, d2=Math.hypot(nx[0]-p[0], nx[1]-p[1])||1;
    const r1=Math.min(r, d1/2), r2=Math.min(r, d2/2);
    out.push({
      in:[p[0]+(pv[0]-p[0])*r1/d1, p[1]+(pv[1]-p[1])*r1/d1],
      c:p,
      out:[p[0]+(nx[0]-p[0])*r2/d2, p[1]+(nx[1]-p[1])*r2/d2],
    });
  }
  return out;
}
/* polígono fechado com cantos arredondados e traço "abaulado" */
function roughRoundPoly(p, pts, r, rough, rnd){
  const cs = corners(pts, r), passes = rough===0?1:2;
  const j = () => rough ? (rnd()-0.5)*rough*1.6 : 0;
  const bow = (x1,y1,x2,y2) => p.c(
    x1+(x2-x1)*0.33+j(), y1+(y2-y1)*0.33+j(),
    x1+(x2-x1)*0.67+j(), y1+(y2-y1)*0.67+j(), x2, y2);
  for (let k=0;k<passes;k++){
    let cur = [cs[0].out[0]+j(), cs[0].out[1]+j()];
    p.m(cur[0], cur[1]);
    for (let i=0;i<cs.length;i++){
      const nx = cs[(i+1)%cs.length];
      const ip = [nx.in[0]+j(), nx.in[1]+j()];
      bow(cur[0],cur[1], ip[0],ip[1]);
      const op = [nx.out[0]+j(), nx.out[1]+j()];
      p.q(nx.c[0], nx.c[1], op[0], op[1]);
      cur = op;
    }
  }
}
/* polilinha aberta com cantos arredondados — usada no cotovelo */
function roughRoundLine(p, pts, r, rough, rnd){
  const passes = rough===0?1:2;
  const j = () => rough ? (rnd()-0.5)*rough*1.2 : 0;
  for (let k=0;k<passes;k++){
    p.m(pts[0][0]+j(), pts[0][1]+j());
    for (let i=1;i<pts.length-1;i++){
      const a=pts[i-1], c=pts[i], b=pts[i+1];
      const d1=Math.hypot(c[0]-a[0],c[1]-a[1])||1, d2=Math.hypot(b[0]-c[0],b[1]-c[1])||1;
      const r1=Math.min(r,d1/2), r2=Math.min(r,d2/2);
      p.l(c[0]+(a[0]-c[0])*r1/d1, c[1]+(a[1]-c[1])*r1/d1);
      p.q(c[0], c[1], c[0]+(b[0]-c[0])*r2/d2, c[1]+(b[1]-c[1])*r2/d2);
    }
    const e = pts[pts.length-1];
    p.l(e[0]+j(), e[1]+j());
  }
}
/* curva suave com jitter por passada */
function roughCurve(p, pts, rough, rnd){
  const passes = rough===0?1:2;
  for (let k=0;k<passes;k++){
    const j = () => rough ? (rnd()-0.5)*rough*1.5 : 0;
    smooth(p, pts.map(q=>[q[0]+j(), q[1]+j()]));
  }
}

/* ---- ligação programática: escolhe o LADO, não o ponto mais próximo -------
   `bindingAt` sozinho gruda no ponto mais perto do alvo, o que joga setas para
   as quinas e faz irmãs saírem quase do mesmo lugar. Aqui o lado vem da direção
   relativa entre os centros, e `spread` distribui as irmãs ao longo dele. */
function sideOf(A, B){
  const ga = bounds(A), gb = bounds(B);
  const dx = (gb.x+gb.w/2)-(ga.x+ga.w/2), dy = (gb.y+gb.h/2)-(ga.y+ga.h/2);
  return Math.abs(dx)/(ga.w/2 || 1) >= Math.abs(dy)/(ga.h/2 || 1)
    ? {axis:'x', s: dx>=0 ? 1 : -1}
    : {axis:'y', s: dy>=0 ? 1 : -1};
}
/* Marcha pelo raio que sai do CENTRO na direção pedida e para na borda.
   Projetar o ponto mais próximo (boundaryPoint) não serve aqui: num losango,
   dois pontos abaixo do centro projetam ambos no vértice de baixo, e as setas
   irmãs saem do mesmo lugar. O raio respeita o deslocamento lateral. */
function anchorOn(shape, side, spread){
  const g = bounds(shape), cx = g.x+g.w/2, cy = g.y+g.h/2;
  const d = side.axis === 'x' ? {x:side.s, y:spread} : {x:spread, y:side.s};
  const far = {x: cx + d.x*g.w*2, y: cy + d.y*g.h*2};
  let lo = 0, hi = 1;
  for (let i=0;i<24;i++){
    const t = (lo+hi)/2;
    const q = {x: cx+(far.x-cx)*t, y: cy+(far.y-cy)*t};
    if (insideShape(shape, q)) lo = t; else hi = t;
  }
  return {
    id: shape.id,
    fx: (cx+(far.x-cx)*lo - cx) / (g.w/2 || 1),
    fy: (cy+(far.y-cy)*lo - cy) / (g.h/2 || 1),
  };
}

/* ---- rótulo ancorado (bound text) ------------------------------------- */
function wrapText(text, fontSize, maxW){
  mctx.font = `${fontSize}px ${HAND}`;
  const wd = t => mctx.measureText(t).width;
  const lines = [];
  for (const para of text.split('\n')){
    if (para === ''){ lines.push(''); continue; }
    let line = '';
    for (let word of para.split(' ')){
      /* palavra maior que a caixa: quebra no caractere */
      while (wd(word) > maxW && word.length > 1){
        let cut = 1;
        while (cut < word.length && wd(word.slice(0, cut+1)) <= maxW) cut++;
        if (line){ lines.push(line); line = ''; }
        lines.push(word.slice(0, cut));
        word = word.slice(cut);
      }
      const test = line ? line + ' ' + word : word;
      if (wd(test) <= maxW || !line) line = test;
      else { lines.push(line); line = word; }
    }
    lines.push(line);
  }
  return lines;
}

/* Quebra o texto na largura útil e CRESCE o contêiner se não couber em altura.
   Idempotente: pode ser chamado no render, no hit-test e na exportação. */
function layoutLabel(el){
  if (!el.text || !LABELABLE.includes(el.type)) return null;
  const [fx, fy] = INNER[el.type];
  let g = bounds(el);
  const maxW = Math.max(g.w*fx - LP*2, el.fontSize);
  const lines = wrapText(el.text, el.fontSize, maxW);
  const lh = el.fontSize*1.25;
  const th = lines.length*lh;
  const needH = (th + LP*2)/fy;
  if (needH > g.h + 0.5){ el.h = needH; g = bounds(el); }   /* só cresce, nunca encolhe */
  return { lines, lh, th, maxW, cx:g.x + g.w/2, top:g.y + g.h/2 - th/2 };
}
function drawLabel(el, L){
  if (!L || el.id === S.editingLabelId) return;
  /* os preenchimentos são todos pastéis claros: sobre eles a tinta NÃO inverte
     no modo escuro, senão vira texto branco em fundo claro */
  const c = el.labelColor || INK;
  ctx.fillStyle = el.bgColor !== 'transparent' ? c : RES(c);
  ctx.font = `${el.fontSize}px ${HAND}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  L.lines.forEach((ln,i) => ctx.fillText(ln, L.cx, L.top + i*L.lh));
  ctx.textAlign = 'left';
}

/* ---- geometria completa de um elemento, em coordenadas de cena ---- */
function geom(el){
  const g = bounds(el);
  const out = { g, stroke:'', clip:'', hatch:'', fillKind:null };
  if (el.type === 'text') return out;

  if (['rect','ellipse','diamond'].includes(el.type)){
    out.clip = solidD(el);
    if (el.bgColor !== 'transparent'){
      if (el.fillStyle === 'solid') out.fillKind = 'solid';
      else { out.fillKind = 'hatch'; out.hatch = hachureD(el); }
    }
  }

  const rnd = mulberry32(el.seed), r = el.roughness, p = PB();
  const rad = cornerRadius(el);

  if (el.type==='rect' || el.type==='diamond'){
    const pts = polyOf(el);
    if (rad > 0.5) roughRoundPoly(p, pts, rad, r, rnd);
    else roughPoly(p, [...pts, pts[0]], r, rnd);
  } else if (el.type==='ellipse'){
    roughEllipse(p, g.x+g.w/2, g.y+g.h/2, g.w/2, g.h/2, r, rnd);
  } else if (el.type==='draw'){
    const abs = el.points.map(q=>[el.x+q[0], el.y+q[1]]);
    if (abs.length === 1) return { ...out, stroke: ellipseD(abs[0][0], abs[0][1], el.strokeWidth*.5, el.strokeWidth*.5) };
    smooth(p, abs);
  } else if (LINEAR.includes(el.type)){
    const abs = resolvedPoints(el);
    if (el.arrowType === 'elbow' && abs.length > 2) roughRoundLine(p, abs, ELBOW_R, r, rnd);
    else if (el.arrowType === 'curved' && abs.length > 2) roughCurve(p, abs, r, rnd);
    else roughPoly(p, abs, r, rnd);

    if (el.type==='arrow' && abs.length>=2){
      const [ax,ay]=abs[abs.length-2], [bx,by]=abs[abs.length-1];
      const a = Math.atan2(by-ay,bx-ax);
      const L = clamp(Math.hypot(bx-ax,by-ay)*0.28, 10, 34);
      roughSeg(p, bx,by, bx-Math.cos(a-0.42)*L, by-Math.sin(a-0.42)*L, r, rnd);
      roughSeg(p, bx,by, bx-Math.cos(a+0.42)*L, by-Math.sin(a+0.42)*L, r, rnd);
    }
  }
  out.stroke = p.d;
  return out;
}

function drawEl(el){
  ctx.save();
  ctx.globalAlpha = el.opacity;
  const L = layoutLabel(el);     /* pode crescer el.h — roda antes de geom() */
  const G = geom(el);

  if (el.type==='text'){
    ctx.fillStyle = RES(el.strokeColor);
    ctx.font = `${el.fontSize}px ${HAND}`;
    ctx.textBaseline = 'top';
    const lh = el.fontSize*1.25;
    el.text.split('\n').forEach((ln,i) => ctx.fillText(ln, G.g.x, G.g.y+i*lh));
    ctx.restore(); return;
  }

  if (G.fillKind === 'solid'){
    ctx.fillStyle = el.bgColor;
    ctx.fill(new Path2D(G.clip));
  } else if (G.fillKind === 'hatch'){
    ctx.save();
    ctx.clip(new Path2D(G.clip));
    ctx.strokeStyle = el.bgColor;
    ctx.lineWidth = Math.max(1.4, el.strokeWidth*0.62);
    ctx.lineCap = 'round';
    ctx.stroke(new Path2D(G.hatch));
    ctx.restore();
  }

  if (G.stroke){
    ctx.strokeStyle = RES(el.strokeColor);
    ctx.lineWidth = el.strokeWidth;
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.setLineDash(dash(el));
    ctx.stroke(new Path2D(G.stroke));
  }
  ctx.setLineDash([]);
  drawLabel(el, L);
  ctx.restore();
}

/* =========================================================================
   4. RENDER
   ========================================================================= */
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 3);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  paint();
}
const paint = () => { dirty = true; };
function frame(){ if (dirty){ dirty=false; render(); } requestAnimationFrame(frame); }

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = cssVar('--paper') || '#fff';
  ctx.fillRect(0,0,W,H);
  if (S.grid && S.zoom > 0.45) drawGrid();

  ctx.save();
  ctx.translate(S.off.x, S.off.y); ctx.scale(S.zoom, S.zoom);
  for (const el of S.els) if (el.id !== S.editingId) drawEl(el);
  if (S.draft) drawEl(S.draft);
  ctx.restore();

  drawOverlay();
  document.getElementById('empty').classList.toggle('gone', S.els.length>0 || !!S.draft);
}
function drawGrid(){
  const step = 22*S.zoom; if (step < 9) return;
  const ox = S.off.x%step, oy = S.off.y%step;
  ctx.fillStyle = cssVar('--dot');
  const rad = clamp(1.15*S.zoom, .6, 1.7);
  for (let x=ox; x<W+step; x+=step)
    for (let y=oy; y<H+step; y+=step){ ctx.beginPath(); ctx.arc(x,y,rad,0,Math.PI*2); ctx.fill(); }
}

const HR = 11;    /* raio visual do handle de caixa */
const PR = 13;    /* ponta de seta */
const MR = 9;     /* ponto médio */

/* Alças de um elemento linear, em coordenadas de tela.
   `i` é o índice no array BRUTO de pontos, não no resolvido. */
function linearHandles(el){
  const pts = resolvedPoints(el), n = el.points.length, out = [];
  out.push({kind:'pt', i:0,   ...toScreen(pts[0][0], pts[0][1])});
  out.push({kind:'pt', i:n-1, ...toScreen(pts[pts.length-1][0], pts[pts.length-1][1])});
  if (el.arrowType !== 'elbow' && pts.length === n)
    for (let i=0;i<pts.length-1;i++){
      const mx=(pts[i][0]+pts[i+1][0])/2, my=(pts[i][1]+pts[i+1][1])/2;
      out.push({kind:'mid', i, ...toScreen(mx,my)});
    }
  return out;
}
const selectedLinear = () => {
  if (S.sel.length !== 1) return null;
  const el = S.els.find(e=>e.id===S.sel[0]);
  return el && LINEAR.includes(el.type) ? el : null;
};
function handles(g){
  const a = toScreen(g.x,g.y), b = toScreen(g.x+g.w, g.y+g.h);
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
  return [
    {k:'nw',x:a.x,y:a.y},{k:'n',x:mx,y:a.y},{k:'ne',x:b.x,y:a.y},
    {k:'w',x:a.x,y:my},{k:'e',x:b.x,y:my},
    {k:'sw',x:a.x,y:b.y},{k:'s',x:mx,y:b.y},{k:'se',x:b.x,y:b.y},
  ];
}
function drawOverlay(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const blue = cssVar('--blue') || '#007AFF';
  const card = cssVar('--bg-card') || '#fff';

  if (S.marquee){
    const a = toScreen(S.marquee.x,S.marquee.y);
    const b = toScreen(S.marquee.x+S.marquee.w, S.marquee.y+S.marquee.h);
    ctx.fillStyle = 'rgba(0,122,255,.14)'; ctx.strokeStyle = blue; ctx.lineWidth = 1;
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.roundRect(a.x,a.y,b.x-a.x,b.y-a.y, 6); ctx.fill(); ctx.stroke();
  }

  /* forma candidata a receber a ponta que está sendo arrastada */
  if (S.bindHint){
    const t = S.els.find(e=>e.id===S.bindHint);
    if (t){
      const tg = bounds(t);
      const a = toScreen(tg.x-4/S.zoom, tg.y-4/S.zoom);
      const b = toScreen(tg.x+tg.w+4/S.zoom, tg.y+tg.h+4/S.zoom);
      ctx.strokeStyle = blue; ctx.lineWidth = 2.5; ctx.setLineDash([]);
      ctx.globalAlpha = .55;
      ctx.beginPath(); ctx.roundRect(a.x,a.y,b.x-a.x,b.y-a.y, 8); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  const lin = selectedLinear();
  if (lin && !S.draft){
    ctx.setLineDash([]);
    for (const h of linearHandles(lin)){
      const rr = h.kind==='pt' ? PR/2 : MR/2;
      ctx.beginPath(); ctx.arc(h.x,h.y,rr,0,Math.PI*2);
      if (h.kind==='pt'){
        const bound = (h.i===0 ? lin.startBinding : lin.endBinding);
        ctx.fillStyle = bound ? blue : card; ctx.fill();
        ctx.lineWidth = 2.2; ctx.strokeStyle = blue; ctx.stroke();
      } else {
        ctx.fillStyle = blue; ctx.globalAlpha = .45; ctx.fill(); ctx.globalAlpha = 1;
      }
    }
    const gb = selBounds();
    if (gb) showEdit({x:toScreen(gb.x+gb.w/2, gb.y).x, y:toScreen(gb.x, gb.y-10/S.zoom).y});
    return;
  }

  const g = selBounds();
  if (!g || S.draft){ showEdit(null); return; }

  const pad = 7/S.zoom;
  const a = toScreen(g.x-pad, g.y-pad), b = toScreen(g.x+g.w+pad, g.y+g.h+pad);
  ctx.strokeStyle = blue; ctx.lineWidth = 1.5; ctx.setLineDash([]);
  ctx.beginPath(); ctx.roundRect(a.x,a.y,b.x-a.x,b.y-a.y, 3); ctx.stroke();

  if (S.sel.length === 1){
    ctx.shadowColor = 'rgba(0,0,0,.22)'; ctx.shadowBlur = 5; ctx.shadowOffsetY = 1;
    for (const h of handles({x:g.x-pad,y:g.y-pad,w:g.w+pad*2,h:g.h+pad*2})){
      ctx.beginPath(); ctx.arc(h.x,h.y,HR/2,0,Math.PI*2);
      ctx.fillStyle = card; ctx.fill();
      ctx.shadowColor = 'transparent';
      ctx.lineWidth = 2; ctx.strokeStyle = blue; ctx.stroke();
      ctx.shadowColor = 'rgba(0,0,0,.22)';
    }
    ctx.shadowColor='transparent'; ctx.shadowBlur=0; ctx.shadowOffsetY=0;
  }
  showEdit({x:(a.x+b.x)/2, y:a.y-12});
}

/* =========================================================================
   5. CÂMERA
   ========================================================================= */
const toScene  = (x,y) => ({x:(x-S.off.x)/S.zoom, y:(y-S.off.y)/S.zoom});
const toScreen = (x,y) => ({x:x*S.zoom+S.off.x, y:y*S.zoom+S.off.y});

let hudT;
function showHud(){
  const h = document.getElementById('hud');
  h.textContent = Math.round(S.zoom*100)+'%';
  h.classList.add('on');
  clearTimeout(hudT); hudT = setTimeout(()=>h.classList.remove('on'), 900);
}
function zoomAt(sx,sy,next){
  next = clamp(next, 0.1, 8);
  const p = toScene(sx,sy);
  S.zoom = next; S.off.x = sx - p.x*S.zoom; S.off.y = sy - p.y*S.zoom;
  showHud(); paint();
}

/* =========================================================================
   6. HIT-TEST
   ========================================================================= */
function distSeg(px,py,x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1, L=dx*dx+dy*dy;
  let t = L ? ((px-x1)*dx+(py-y1)*dy)/L : 0; t = clamp(t,0,1);
  return Math.hypot(px-(x1+dx*t), py-(y1+dy*t));
}
const insideBox = (g,p) => p.x>=g.x && p.y>=g.y && p.x<=g.x+g.w && p.y<=g.y+g.h;

function hit(el,p){
  const tol = 12/S.zoom, g = bounds(el);
  if (p.x<g.x-tol||p.y<g.y-tol||p.x>g.x+g.w+tol||p.y>g.y+g.h+tol) return false;
  if (el.type==='text') return true;
  if (el.points){
    const abs = LINEAR.includes(el.type) ? resolvedPoints(el) : el.points.map(q=>[el.x+q[0], el.y+q[1]]);
    for (let i=0;i<abs.length-1;i++)
      if (distSeg(p.x,p.y,abs[i][0],abs[i][1],abs[i+1][0],abs[i+1][1]) < tol) return true;
    return abs.length===1 && Math.hypot(p.x-abs[0][0],p.y-abs[0][1]) < tol;
  }
  const filled = el.bgColor !== 'transparent' || !!el.text;   /* rótulo torna a forma sólida ao toque */
  const cx = g.x+g.w/2, cy = g.y+g.h/2;
  if (el.type==='rect'){
    if (filled) return insideBox(g,p);
    const near=(a,b)=>Math.abs(a-b)<tol;
    const inX = p.x>g.x-tol && p.x<g.x+g.w+tol, inY = p.y>g.y-tol && p.y<g.y+g.h+tol;
    return (inY&&(near(p.x,g.x)||near(p.x,g.x+g.w))) || (inX&&(near(p.y,g.y)||near(p.y,g.y+g.h)));
  }
  if (el.type==='ellipse'){
    const k = ((p.x-cx)/(g.w/2+tol))**2 + ((p.y-cy)/(g.h/2+tol))**2;
    const kin = ((p.x-cx)/Math.max(g.w/2-tol,1))**2 + ((p.y-cy)/Math.max(g.h/2-tol,1))**2;
    return filled ? k<=1 : (k<=1 && kin>=1);
  }
  if (el.type==='diamond'){
    const k = Math.abs(p.x-cx)/(g.w/2+tol) + Math.abs(p.y-cy)/(g.h/2+tol);
    const kin = Math.abs(p.x-cx)/Math.max(g.w/2-tol,1) + Math.abs(p.y-cy)/Math.max(g.h/2-tol,1);
    return filled ? k<=1 : (k<=1 && kin>=1);
  }
  return false;
}
/* Interior vazio de uma forma sem preenchimento.
   Só vale na 2ª passada: qualquer traço ou forma preenchida sob o dedo ganha. */
function hitLoose(el, p){
  if (!LABELABLE.includes(el.type)) return false;
  const g = bounds(el);
  /* forma que cobre quase a tela toda funciona como moldura — continua vazada,
     senão fica impossível laçar uma seleção dentro dela */
  if (g.w*S.zoom > W*0.9 && g.h*S.zoom > H*0.9) return false;
  return insideShape(el, p);
}
/* Duas passadas: primeiro o alvo preciso (traço, forma preenchida, rótulo);
   só se não houver nada ali é que o interior vazio conta. */
function pick(p){
  for (let i=S.els.length-1;i>=0;i--) if (hit(S.els[i],p)) return S.els[i];
  for (let i=S.els.length-1;i>=0;i--) if (hitLoose(S.els[i],p)) return S.els[i];
  return null;
}

/* =========================================================================
   7. GESTOS
   ========================================================================= */
const ptrs = new Map();
let mode=null, anchor=null, startTap=0, tapPos=null, lastTapAt=0, lastTapPos=null;

cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, {x:e.clientX,y:e.clientY});
  closeMenu(); closeShapePop();
  if (S.editingId || S.editingLabelId){ ptrs.delete(e.pointerId); ta.blur(); return; }

  if (ptrs.size === 2){ startPinch(); return; }
  if (ptrs.size > 2) return;

  const sp = {x:e.clientX,y:e.clientY}, p = toScene(sp.x, sp.y);
  startTap = performance.now(); tapPos = sp;

  if (S.tool==='hand'){ mode='pan'; anchor={sp, off:{...S.off}}; return; }
  if (S.tool==='eraser'){ mode='erase'; erase(p); return; }
  if (S.tool==='text'){
    const t = pick(p);
    if (t && LABELABLE.includes(t.type)) openLabel(t); else openText(p, t);
    return;
  }

  if (S.tool==='select'){
    /* alças de ponta/meio têm prioridade sobre as da caixa */
    const lin = selectedLinear();
    if (lin){
      /* pontas ganham alvo maior que os médios: errar a ponta por 2px
         caía no pick() e arrastava o corpo inteiro */
      const cand = linearHandles(lin)
        .map(h => ({h, d:Math.hypot(h.x-sp.x, h.y-sp.y)}))
        .filter(o => o.d < (o.h.kind==='pt' ? 30 : 20))
        .sort((a,b) => (a.h.kind===b.h.kind ? a.d-b.d : a.h.kind==='pt' ? -1 : 1));
      const h = cand.length ? cand[0].h : null;
      if (h){
        let idx = h.i;
        if (h.kind === 'mid'){
          const pts = resolvedPoints(lin);
          const mx=(pts[h.i][0]+pts[h.i+1][0])/2, my=(pts[h.i][1]+pts[h.i+1][1])/2;
          lin.points.splice(h.i+1, 0, [mx-lin.x, my-lin.y]);
          idx = h.i+1;
        }
        mode='point'; anchor={id:lin.id, i:idx, last:lin.points.length-1};
        paint(); return;
      }
    }
    const g = selBounds();
    if (g && S.sel.length===1 && !lin){
      const pad = 7/S.zoom;
      const h = handles({x:g.x-pad,y:g.y-pad,w:g.w+pad*2,h:g.h+pad*2})
                .find(h => Math.hypot(h.x-sp.x, h.y-sp.y) < 22);   /* hitbox > visual */
      if (h){ mode='resize'; anchor={k:h.k, g:{...g}, snap:S.sel.map(id=>structuredClone(S.els.find(e=>e.id===id)))}; return; }
    }
    const el = pick(p);
    if (el){
      if (!S.sel.includes(el.id)) S.sel=[el.id];
      mode='move'; anchor={p, snap:S.sel.map(id=>structuredClone(S.els.find(e=>e.id===id)))};
    } else {
      S.sel=[]; mode='marquee'; anchor={p}; S.marquee={x:p.x,y:p.y,w:0,h:0};
    }
    paint(); return;
  }

  const el = newEl(S.tool, p.x, p.y);
  if (S.tool==='draw') el.points=[[0,0]];
  if (LINEAR.includes(S.tool)){
    el.points=[[0,0],[0,0]];
    const t = pickBindable(p);            /* começou em cima de uma forma → ancora */
    if (t) el.startBinding = bindingAt(t, p);
  }
  S.draft = el; mode='draw'; anchor={p}; paint();
});

cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, {x:e.clientX,y:e.clientY});
  if (mode==='pinch'){ movePinch(); return; }
  if (ptrs.size > 1) return;

  const sp={x:e.clientX,y:e.clientY}, p=toScene(sp.x,sp.y);

  if (mode==='pan'){ S.off.x = anchor.off.x+(sp.x-anchor.sp.x); S.off.y = anchor.off.y+(sp.y-anchor.sp.y); paint(); return; }
  if (mode==='erase'){ erase(p); return; }
  if (mode==='draw'){
    const d = S.draft;
    if (d.type==='draw'){
      const lp = d.points[d.points.length-1], rp=[p.x-d.x, p.y-d.y];
      if (Math.hypot(rp[0]-lp[0], rp[1]-lp[1]) > 1.6/S.zoom) d.points.push(rp);
    } else if (d.points){
      d.points[1]=[p.x-d.x, p.y-d.y];
      if (LINEAR.includes(d.type)){
        const t = pickBindable(p, d.startBinding && d.startBinding.id);
        S.bindHint = t ? t.id : null;
        d.endBinding = t ? bindingAt(t, p) : null;
      }
    }
    else { d.w = p.x-d.x; d.h = p.y-d.y; }
    paint(); return;
  }
  if (mode==='move'){
    const dx=p.x-anchor.p.x, dy=p.y-anchor.p.y;
    anchor.snap.forEach(s => { const el=S.els.find(e=>e.id===s.id); el.x=s.x+dx; el.y=s.y+dy; });
    paint(); return;
  }
  if (mode==='point'){ movePoint(p); return; }
  if (mode==='resize'){ doResize(p); return; }
  if (mode==='marquee'){
    S.marquee = {x:Math.min(anchor.p.x,p.x), y:Math.min(anchor.p.y,p.y),
                 w:Math.abs(p.x-anchor.p.x), h:Math.abs(p.y-anchor.p.y)};
    S.sel = S.els.filter(el => {
      const g=bounds(el), m=S.marquee;
      return g.x<m.x+m.w && g.x+g.w>m.x && g.y<m.y+m.h && g.y+g.h>m.y;
    }).map(el=>el.id);
    paint(); return;
  }
});

function endPointer(e){
  ptrs.delete(e.pointerId);
  if (mode==='pinch'){
    if (!ptrs.size) mode=null;
    else if (ptrs.size===1){ mode='pan'; const o=[...ptrs.values()][0]; anchor={sp:{...o}, off:{...S.off}}; }
    return;
  }
  if (ptrs.size > 0) return;

  if (mode==='draw' && S.draft){
    const d = S.draft; S.draft=null; S.bindHint=null;
    const g = bounds(d);
    const anchored = !!(d.startBinding || d.endBinding);
    const tiny = d.points
      ? (!anchored && d.points.length<3 && g.w<4 && g.h<4)
      : (Math.abs(d.w)<5 && Math.abs(d.h)<5);
    if (!tiny){
      S.els.push(normalize(d));
      if (['rect','ellipse','diamond','line','arrow'].includes(d.type)){ S.sel=[d.id]; setTool('select'); }
      commit();
    }
  }
  if (mode==='resize') S.sel.forEach(id => { const el=S.els.find(e=>e.id===id); if (el) normalize(el); });
  if (mode==='point'){ S.bindHint = null; }
  if (mode==='move'||mode==='resize'||mode==='erase'||mode==='point') commit();
  if (mode==='marquee') S.marquee=null;

  if (tapPos && performance.now()-startTap < 260){
    const moved = Math.hypot(tapPos.x-(e.clientX||tapPos.x), tapPos.y-(e.clientY||tapPos.y));
    const now = performance.now();
    if (moved<12 && lastTapPos && now-lastTapAt<320 && Math.hypot(tapPos.x-lastTapPos.x,tapPos.y-lastTapPos.y)<26){
      const sc = toScene(tapPos.x, tapPos.y), el = pick(sc);
      if (el && el.type==='text') openText(sc, el);
      else if (el && LABELABLE.includes(el.type)) openLabel(el);
      lastTapAt = 0;
    } else { lastTapAt = now; lastTapPos = tapPos; }
  }
  mode=null; anchor=null; tapPos=null; paint();
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);

function pinchInfo(){
  const [a,b] = [...ptrs.values()];
  return {d:Math.hypot(a.x-b.x,a.y-b.y), cx:(a.x+b.x)/2, cy:(a.y+b.y)/2};
}
function startPinch(){
  if (mode==='draw') S.draft = null;
  mode='pinch';
  const i = pinchInfo();
  anchor = {d:i.d, cx:i.cx, cy:i.cy, zoom:S.zoom, off:{...S.off}};
  paint();
}
function movePinch(){
  if (ptrs.size<2) return;
  const i = pinchInfo();
  const k = clamp(anchor.zoom*(i.d/anchor.d), 0.1, 8);
  const sc = {x:(anchor.cx-anchor.off.x)/anchor.zoom, y:(anchor.cy-anchor.off.y)/anchor.zoom};
  S.zoom = k; S.off.x = i.cx - sc.x*k; S.off.y = i.cy - sc.y*k;
  showHud(); paint();
}
function doResize(p){
  const {k,g,snap} = anchor;
  let nx=g.x, ny=g.y, nw=g.w, nh=g.h;
  if (k.includes('e')) nw = p.x-g.x;
  if (k.includes('s')) nh = p.y-g.y;
  if (k.includes('w')){ nw = g.x+g.w-p.x; nx = p.x; }
  if (k.includes('n')){ nh = g.y+g.h-p.y; ny = p.y; }
  if (Math.abs(nw)<8 || Math.abs(nh)<8) return;
  const sx = g.w?nw/g.w:1, sy = g.h?nh/g.h:1;
  snap.forEach(s => {
    const el = S.els.find(e=>e.id===s.id);
    el.x = nx + (s.x-g.x)*sx; el.y = ny + (s.y-g.y)*sy;
    if (s.points) el.points = s.points.map(q=>[q[0]*sx, q[1]*sy]);
    else if (s.type==='text'){ el.fontSize = clamp(s.fontSize*Math.max(Math.abs(sx),Math.abs(sy)),8,200); measureText(el); }
    else { el.w = s.w*sx; el.h = s.h*sy; }
  });
  paint();
}
/* Arrastar a ponta de uma seta: reposiciona o ponto e (re)ancora ao vivo.
   Soltar longe de qualquer forma desprende — é o mesmo gesto nos dois sentidos. */
function movePoint(p){
  const el = S.els.find(e=>e.id===anchor.id); if (!el) return;
  el.points[anchor.i] = [p.x-el.x, p.y-el.y];

  const isEnd = anchor.i===0 || anchor.i===el.points.length-1;
  if (isEnd){
    const cur = anchor.i===0 ? el.startBinding : el.endBinding;
    let t = pickBindable(p, el.id);
    /* histerese: prender exige 10px, soltar exige sair de 22px.
       Sem isso a âncora pisca no limiar e o desprender vira acidente. */
    if (!t && cur){
      const prev = bindTarget(cur);
      if (prev && insideShape(prev, p, 22/S.zoom)) t = prev;
    }
    S.bindHint = t ? t.id : null;
    /* o foco vem de onde o dedo está: é isso que faz a ponta ancorada
       deslizar pela borda em vez de ficar presa no centro */
    const b = t ? bindingAt(t, p) : null;
    if (anchor.i===0) el.startBinding = b; else el.endBinding = b;
  }
  paint();
}

/* Clona um conjunto preservando as ligações internas.
   Âncora para uma forma FORA do conjunto continua apontando para a original —
   é o que faz sentido ao colar só a seta. */
function cloneGroup(els, dx, dy){
  const map = new Map();
  const copies = els.map(e => {
    const c = structuredClone(e);
    c.id = uid(); c.seed = (Math.random()*1e9)|0;
    map.set(e.id, c.id);
    return c;
  });
  for (const c of copies){
    c.x += dx; c.y += dy;
    for (const k of ['startBinding','endBinding']){
      if (!c[k]) continue;
      const inner = map.get(c[k].id);
      if (inner) c[k] = {...c[k], id:inner};
      else if (!S.els.some(e => e.id === c[k].id)) c[k] = null;
    }
  }
  return copies;
}

function dropBindings(ids){
  const gone = new Set(ids);
  for (const el of S.els){
    if (el.startBinding && gone.has(el.startBinding.id)) el.startBinding = null;
    if (el.endBinding && gone.has(el.endBinding.id)) el.endBinding = null;
  }
}
function erase(p){
  const doomed = S.els.filter(el => hit(el,p)).map(el=>el.id);
  if (!doomed.length) return;
  S.els = S.els.filter(el => !doomed.includes(el.id));
  dropBindings(doomed); S.sel=[]; paint();
}

/* =========================================================================
   8. TEXTO
   ========================================================================= */
const ta = document.getElementById('txt');
function measureText(el){
  ctx.font = `${el.fontSize}px ${HAND}`;
  const lines = el.text.split('\n');
  el.w = Math.max(...lines.map(l => ctx.measureText(l).width), el.fontSize*0.6);
  el.h = lines.length*el.fontSize*1.25;
}
function openText(p, existing){
  const el = existing && existing.type==='text'
    ? existing
    : Object.assign(newEl('text', p.x, p.y - S.style.fontSize*0.62), {text:''});
  S.editingId = el.id; S.sel = [];
  const g = bounds(el), sp = toScreen(g.x,g.y);
  ta.value = el.text;
  Object.assign(ta.style, {
    display:'block', left:sp.x+'px', top:sp.y+'px',
    fontSize:(el.fontSize*S.zoom)+'px', color:RES(el.strokeColor),
    width: Math.max(150, (el.w||150)*S.zoom+48)+'px',
    textAlign:'left', whiteSpace:'pre', lineHeight:'1.25', height:'auto',
  });
  ta._sync = null;
  autogrow(); paint();
  setTimeout(()=>{ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }, 30);

  ta._commit = () => {
    const txt = ta.value.replace(/\s+$/,'');
    ta.style.display='none'; S.editingId=null;
    if (!txt) S.els = S.els.filter(e=>e.id!==el.id);
    else {
      el.text = txt; measureText(el);
      if (!S.els.includes(el)) S.els.push(el);
      S.sel=[el.id];
    }
    commit(); setTool('select'); paint();
  };
}
const autogrow = () => { ta.style.height='auto'; ta.style.height = ta.scrollHeight+'px'; };

/* ---- rótulo dentro da forma (bound text) ---- */
function openLabel(el){
  S.editingLabelId = el.id; S.sel = [];
  el.labelColor = el.labelColor || INK;
  normalize(el);

  const place = () => {
    el.text = ta.value;
    const [fx] = INNER[el.type];
    const L = layoutLabel(el);
    const g = bounds(el);
    const availW = Math.max(g.w*fx - LP*2, el.fontSize);
    const th = L ? L.th : el.fontSize*1.25;
    const sp = toScreen(g.x + g.w/2 - availW/2, g.y + g.h/2 - th/2);
    Object.assign(ta.style, {
      display:'block', left:sp.x+'px', top:sp.y+'px',
      width:(availW*S.zoom)+'px', height:(th*S.zoom+2)+'px',
      fontSize:(el.fontSize*S.zoom)+'px', lineHeight:'1.25',
      textAlign:'center', whiteSpace:'pre-wrap', color:RES(el.labelColor),
    });
    paint();
  };

  ta.value = el.text || '';
  ta._sync = place;
  place();
  setTimeout(()=>{ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }, 30);

  ta._commit = () => {
    ta.style.display='none'; ta._sync=null; ta._commit=null;
    S.editingLabelId = null;
    el.text = ta.value.trim() ? ta.value.replace(/\s+$/,'') : '';
    layoutLabel(el);
    S.sel = [el.id];
    commit(); setTool('select'); paint();
  };
}

ta.addEventListener('input', () => { ta._sync ? ta._sync() : autogrow(); });
ta.addEventListener('blur', () => ta._commit && ta._commit());
ta.addEventListener('keydown', e => { if (e.key==='Escape') ta.blur(); });

/* =========================================================================
   9. UI
   ========================================================================= */

/* --- nav --- */
$('undo').innerHTML = ic('undo-2');
$('redo').innerHTML = ic('redo-2');
$('menuBtn').innerHTML = ic('ellipsis');
$('undo').onclick = undo;
$('redo').onclick = redo;
function syncNav(){ $('undo').disabled = !S.hist.length; $('redo').disabled = !S.redo.length; }

/* --- dock --- */
const dock = $('dock');

function setTool(t){
  S.tool = t;
  if (t !== 'select') S.sel = [];
  const isShape = SHAPES.some(([s])=>s===t);
  if (isShape) S.lastShape = t;
  [...dock.querySelectorAll('.tool')].forEach(b => {
    const on = b.dataset.tool==='shape' ? isShape : b.dataset.tool===t;
    b.classList.toggle('on', on);
  });
  const sb = dock.querySelector('[data-tool="shape"]');
  const iconName = isShape ? (SHAPES.find(([s])=>s===t)||[])[1] : 'shapes';
  sb.innerHTML = ic(iconName) + '<span class="caret"></span>';
  [...shapePop.children].forEach(b => b.classList.toggle('on', b.dataset.shape===t));
  syncSheetRows(); paint();
}

dock.addEventListener('click', e => {
  const pb = e.target.closest('#paletteBtn');
  if (pb){ openSheet(); return; }
  const b = e.target.closest('.tool'); if (!b) return;
  const t = b.dataset.tool;
  if (t === 'shape'){

function showEdit(pos){
  if (!pos || sheet.classList.contains('on') || exportSheet.classList.contains('on')){ edit.classList.remove('on'); return; }
  const one = S.sel.length===1 ? S.els.find(e=>e.id===S.sel[0]) : null;
  const canLabel = !!one && LABELABLE.includes(one.type);
  const lb = edit.querySelector('[data-act="label"]');
  if (lb){ lb.style.display = canLabel ? '' : 'none';
    if (lb.nextElementSibling) lb.nextElementSibling.style.display = canLabel ? '' : 'none'; }
  edit.style.left = clamp(pos.x, 130, W-130)+'px';
  edit.style.top  = clamp(pos.y, 118, H-150)+'px';
  edit.classList.add('on');
}
edit.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act==='del'){ S.els = S.els.filter(el => !S.sel.includes(el.id)); dropBindings(S.sel); S.sel=[]; commit(); }
  if (act==='dup'){
    const copies = S.sel.map(id => {
      const c = structuredClone(S.els.find(e=>e.id===id));
      c.id = uid(); c.seed=(Math.random()*1e9)|0; c.x+=18; c.y+=18; return c;
    });
    S.els.push(...copies); S.sel = copies.map(c=>c.id); commit();
  }
  if (act==='front'){
    const moved = S.els.filter(e=>S.sel.includes(e.id));
    S.els = S.els.filter(e=>!S.sel.includes(e.id)).concat(moved); commit();
  }
  if (act==='style'){ openSheet(); return; }
  if (act==='label'){
    const el = S.els.find(e=>e.id===S.sel[0]);
    if (el && LABELABLE.includes(el.type)) openLabel(el);
    return;
  }
  paint();
});

(() => {
  const grab = $('grab'); let y0=null;
  grab.addEventListener('pointerdown', e => { y0 = e.clientY; grab.setPointerCapture(e.pointerId); sheet.style.transition='none'; });
  grab.addEventListener('pointermove', e => {
    if (y0===null) return;
    sheet.style.transform = `translateY(${Math.max(0, e.clientY-y0)}px)`;
  });
  const end = e => {
    if (y0===null) return;
    const dy = e.clientY - y0; y0 = null;
    sheet.style.transition=''; sheet.style.transform='';
    if (dy > 90) closeSheet();
  };
  grab.addEventListener('pointerup', end);
  grab.addEventListener('pointercancel', end);
})();

function applyStyle(key, val, live){

  if (S.sel.length){
    S.sel.forEach(id => {
      const el = S.els.find(e=>e.id===id); if (!el) return;
      el[key] = val;
      if (key==='fontSize' && el.type==='text') measureText(el);
    });
    if (!live) commit();
  }
  syncSwatch(); paint();
}
function syncSwatch(){
  const ref = S.sel.length ? (S.els.find(e=>e.id===S.sel[0]) || S.style) : S.style;
  $('swatchDot').style.background = RES(ref.strokeColor);

function syncSheetRows(){
  const types = S.sel.length
    ? [...new Set(S.sel.map(id => (S.els.find(e=>e.id===id)||{}).type))]
    : [S.tool];
  const has = t => types.includes(t);
  const shapeish = has('rect')||has('ellipse')||has('diamond');
  const boxy = has('rect')||has('diamond');
  const linear = has('line')||has('arrow');
  $('fillLabel').style.display = shapeish ? '' : 'none';
  $('fillCard').style.display  = shapeish ? '' : 'none';
  $('edgeLabel').style.display = boxy ? '' : 'none';
  $('edgeCard').style.display  = boxy ? '' : 'none';
  $('arrowLabel').style.display = linear ? '' : 'none';
  $('arrowCard').style.display  = linear ? '' : 'none';
  const labelled = S.sel.some(id => { const e = S.els.find(x=>x.id===id); return e && e.text && LABELABLE.includes(e.type); });
  const showFont = has('text') || labelled;
  $('fontLabel').style.display = showFont ? '' : 'none';
  $('fontCard').style.display  = showFont ? '' : 'none';

function syncSheet(){
  syncSheetRows();
  const ref = S.sel.length ? (S.els.find(e=>e.id===S.sel[0]) || S.style) : S.style;
  const mark = (host,val) => [...$(host).children].forEach(b => b.classList.toggle('on', String(b.dataset.v)===String(val)));
  mark('strokes', ref.strokeColor); mark('fills', ref.bgColor);
  mark('strokeWidth', ref.strokeWidth); mark('strokeStyle', ref.strokeStyle);
  mark('fillStyle', ref.fillStyle); mark('roughness', ref.roughness);
  mark('fontSize', ref.fontSize);
  mark('edges', ref.edges || 'round'); mark('arrowType', ref.arrowType || 'straight');
  op.value = Math.round(ref.opacity*100);
  $('opVal').textContent = op.value+'%';

/* --- enquadrar / exportar --- */
function contentBox(els){
  els = els || S.els;
  let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;
  for (const e of els){ const g=bounds(e); a=Math.min(a,g.x);b=Math.min(b,g.y);c=Math.max(c,g.x+g.w);d=Math.max(d,g.y+g.h); }
  return {a,b,c,d};
}
function fit(){
  if (!S.els.length) return;
  const {a,b,c,d} = contentBox(), pad = 56;
  const k = clamp(Math.min((W-pad*2)/(c-a), (H-pad*2-160)/(d-b)), 0.1, 3);
  S.zoom = k; S.off.x = W/2 - (a+c)/2*k; S.off.y = H/2 - (b+d)/2*k;
  showHud(); paint();
}
const download = (href,name) => { const a=document.createElement('a'); a.href=href; a.download=name; a.click(); };

/* ---------------- exportadores: PNG (raster), SVG e PDF (vetor) ---------- */
const PAD = 36;
const hexRGB = (hex) => {
  const h = hex.replace('#','');
  const v = h.length===3 ? h.split('').map(c=>c+c).join('') : h;
  return [parseInt(v.slice(0,2),16)/255, parseInt(v.slice(2,4),16)/255, parseInt(v.slice(4,6),16)/255];
};

/* --- PNG: rasteriza no mesmo renderizador do canvas --- */
function exportPNG(){
  if (!S.els.length) return toast('Nada para exportar');
  S.els.forEach(layoutLabel);
  const {a,b,c,d} = contentBox(), sc = 3;
  const off = document.createElement('canvas');
  off.width = Math.ceil((c-a+PAD*2)*sc); off.height = Math.ceil((d-b+PAD*2)*sc);
  const oc = off.getContext('2d');
  oc.fillStyle = '#fff'; oc.fillRect(0,0,off.width,off.height);
  oc.setTransform(sc,0,0,sc,0,0); oc.translate(PAD-a, PAD-b);
  const realCtx=ctx, realZoom=S.zoom;
  ctx=oc; S.zoom=1; S.forceLight=true;
  try { S.els.forEach(drawEl); } finally { ctx=realCtx; S.zoom=realZoom; S.forceLight=false; }
  download(off.toDataURL('image/png'), 'rabisco.png');
  toast('PNG exportado');
}

/* --- SVG: o mesmo path data, agora como documento --- */
const esc = (t) => t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const FONT_STACK = "Bradley Hand, Chalkboard SE, Comic Sans MS, Segoe Print, cursive";

/* O SVG é o formato de intercâmbio: leva o desenho E a cena, num comentário.
   Quem abre num editor vê vetor; quem cola de volta recupera os elementos. */
function encodePayload(els){
  const json = JSON.stringify({type:'rabisco/scene', version:1, elements:els});
  return btoa(unescape(encodeURIComponent(json)));
}
function decodePayload(text){
  const m = typeof text === 'string' && text.match(/<!--\s*rabisco:scene\s+([A-Za-z0-9+/=]+)\s*-->/);
  if (!m) return null;
  try {
    const data = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    return Array.isArray(data.elements) ? data.elements : null;
  } catch { return null; }
}

function buildSVG(els){
  els = els || S.els;
  els.forEach(layoutLabel);              /* estabiliza alturas antes de medir a cena */
  const {a,b,c,d} = contentBox(els);
  const w = nn(c-a+PAD*2), h = nn(d-b+PAD*2);
  const defs = [], body = [];

  els.forEach((el, i) => {
    const G = geom(el);
    const op = el.opacity < 1 ? ` opacity="${nn(el.opacity)}"` : '';

    if (el.type === 'text'){
      const lh = el.fontSize*1.25;
      const lines = el.text.split('\n').map((ln,k) =>
        `<text x="${nn(G.g.x)}" y="${nn(G.g.y + k*lh + el.fontSize*0.8)}" ` +
        `font-family="${FONT_STACK}" font-size="${nn(el.fontSize)}" ` +
        `fill="${el.strokeColor}">${esc(ln)}</text>`).join('');
      body.push(`<g${op}>${lines}</g>`);
      return;
    }

    const parts = [];
    if (G.fillKind === 'solid'){
      parts.push(`<path d="${G.clip}" fill="${el.bgColor}"/>`);
    } else if (G.fillKind === 'hatch'){
      const cid = `clip${i}`;
      defs.push(`<clipPath id="${cid}"><path d="${G.clip}"/></clipPath>`);
      parts.push(
        `<g clip-path="url(#${cid})"><path d="${G.hatch}" fill="none" ` +
        `stroke="${el.bgColor}" stroke-width="${nn(Math.max(1.4, el.strokeWidth*0.62))}" ` +
        `stroke-linecap="round"/></g>`);
    }
    if (G.stroke){
      const ds = dash(el);
      parts.push(
        `<path d="${G.stroke}" fill="none" stroke="${el.strokeColor}" ` +
        `stroke-width="${nn(el.strokeWidth)}" stroke-linecap="round" stroke-linejoin="round"` +
        (ds.length ? ` stroke-dasharray="${ds.map(nn).join(' ')}"` : '') + `/>`);
    }
    const L = layoutLabel(el);
    if (L) parts.push(L.lines.map((ln,k) =>
      `<text x="${nn(L.cx)}" y="${nn(L.top + k*L.lh + el.fontSize*0.8)}" text-anchor="middle" ` +
      `font-family="${FONT_STACK}" font-size="${nn(el.fontSize)}" ` +
      `fill="${el.labelColor || INK}">${esc(ln)}</text>`).join(''));
    body.push(`<g${op}>${parts.join('')}</g>`);
  });

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" ` +
    `viewBox="0 0 ${w} ${h}">` +
    `<!-- rabisco:scene ${encodePayload(els)} -->` +
    `<rect width="${w}" height="${h}" fill="#FFFFFF"/>` +
    (defs.length ? `<defs>${defs.join('')}</defs>` : '') +
    `<g transform="translate(${nn(PAD-a)} ${nn(PAD-b)})">${body.join('')}</g></svg>`;
}

function exportSVG(){
  if (!S.els.length) return toast('Nada para exportar');
  const blob = new Blob([buildSVG()], {type:'image/svg+xml;charset=utf-8'});
  download(URL.createObjectURL(blob), 'rabisco.svg');
  toast('SVG exportado');
}

/* --- PDF: converte o path data para operadores do content stream --- */
/* Só usamos M/L/Q/C/Z; Q vira cúbica porque PDF não tem quadrática. */
function dToPdf(d, tx){
  let out = '', cx = 0, cy = 0;
  const re = /([MLQCZ])([^MLQCZ]*)/g;
  let m;
  while ((m = re.exec(d))){
    const cmd = m[1];
    const a = m[2].trim().split(/[\s,]+/).filter(Boolean).map(Number);
    if (cmd === 'M'){ [cx,cy] = [a[0],a[1]]; const P = tx(cx,cy); out += `${P[0]} ${P[1]} m\n`; }
    else if (cmd === 'L'){ [cx,cy] = [a[0],a[1]]; const P = tx(cx,cy); out += `${P[0]} ${P[1]} l\n`; }
    else if (cmd === 'C'){
      const P1=tx(a[0],a[1]), P2=tx(a[2],a[3]), P3=tx(a[4],a[5]);
      out += `${P1[0]} ${P1[1]} ${P2[0]} ${P2[1]} ${P3[0]} ${P3[1]} c\n`;
      [cx,cy] = [a[4],a[5]];
    } else if (cmd === 'Q'){
      const x1 = cx + 2/3*(a[0]-cx),  y1 = cy + 2/3*(a[1]-cy);
      const x2 = a[2] + 2/3*(a[0]-a[2]), y2 = a[3] + 2/3*(a[1]-a[3]);
      const P1=tx(x1,y1), P2=tx(x2,y2), P3=tx(a[2],a[3]);
      out += `${P1[0]} ${P1[1]} ${P2[0]} ${P2[1]} ${P3[0]} ${P3[1]} c\n`;
      [cx,cy] = [a[2],a[3]];
    } else if (cmd === 'Z'){ out += 'h\n'; }
  }
  return out;
}

/* Helvetica + WinAnsi cobre o português; a fonte manuscrita não é embarcada. */
const pdfStr = (t) => '(' + [...t].map(ch => {
  const c = ch.charCodeAt(0);
  if (ch === '(' || ch === ')' || ch === '\\') return '\\' + ch;
  return c < 256 ? ch : '?';
}).join('') + ')';

function buildPDF(){
  S.els.forEach(layoutLabel);
  const {a,b,c,d} = contentBox();
  const K = 0.75;                                   /* 96dpi px → 72dpi pt */
  const wpx = c-a+PAD*2, hpx = d-b+PAD*2;
  const PW = nn(wpx*K), PH = nn(hpx*K);
  const tx = (x,y) => [nn((x-a+PAD)*K), nn((hpx-(y-b+PAD))*K)];

  const alphas = new Set([1]);
  S.els.forEach(el => alphas.add(el.opacity));
  const alphaList = [...alphas];
  const gsName = (o) => `/GS${alphaList.indexOf(o)}`;

  let cs = `q\n1 1 1 rg\n0 0 ${PW} ${PH} re\nf\nQ\n`;

  for (const el of S.els){
    const G = geom(el);
    const [r,g,bl] = hexRGB(el.strokeColor);
    cs += `q\n${gsName(el.opacity)} gs\n`;

    if (el.type === 'text'){
      const [fr,fg,fb] = hexRGB(el.strokeColor);
      const lh = el.fontSize*1.25;
      cs += `${nn(fr)} ${nn(fg)} ${nn(fb)} rg\n`;
      el.text.split('\n').forEach((ln,i) => {
        const P = tx(G.g.x, G.g.y + i*lh + el.fontSize*0.8);
        cs += `BT\n/F1 ${nn(el.fontSize*K)} Tf\n1 0 0 1 ${P[0]} ${P[1]} Tm\n${pdfStr(ln)} Tj\nET\n`;
      });
      cs += 'Q\n'; continue;
    }

    if (G.fillKind === 'solid'){
      const [br,bg,bb] = hexRGB(el.bgColor);
      cs += `${nn(br)} ${nn(bg)} ${nn(bb)} rg\n${dToPdf(G.clip, tx)}f\n`;
    } else if (G.fillKind === 'hatch'){
      const [br,bg,bb] = hexRGB(el.bgColor);
      cs += `q\n${dToPdf(G.clip, tx)}W n\n` +
            `${nn(br)} ${nn(bg)} ${nn(bb)} RG\n` +
            `${nn(Math.max(1.4, el.strokeWidth*0.62)*K)} w\n1 J\n` +
            `${dToPdf(G.hatch, tx)}S\nQ\n`;
    }

    if (G.stroke){
      const ds = dash(el).map(v => nn(v*K));
      cs += `${nn(r)} ${nn(g)} ${nn(bl)} RG\n${nn(el.strokeWidth*K)} w\n1 J\n1 j\n` +
            `[${ds.join(' ')}] 0 d\n${dToPdf(G.stroke, tx)}S\n`;
    }

    const L = layoutLabel(el);
    if (L){
      const [lr,lg,lb2] = hexRGB(el.labelColor || INK);
      mctx.font = `${el.fontSize}px ${HAND}`;
      cs += `${nn(lr)} ${nn(lg)} ${nn(lb2)} rg\n[] 0 d\n`;
      L.lines.forEach((ln,i) => {
        const lw = mctx.measureText(ln).width;            /* PDF não centraliza sozinho */
        const P = tx(L.cx - lw/2, L.top + i*L.lh + el.fontSize*0.8);
        cs += `BT\n/F1 ${nn(el.fontSize*K)} Tf\n1 0 0 1 ${P[0]} ${P[1]} Tm\n${pdfStr(ln)} Tj\nET\n`;
      });
    }
    cs += 'Q\n';
  }

  const gsDict = alphaList.map((o,i) => `/GS${i} <</Type/ExtGState/CA ${nn(o)} /ca ${nn(o)}>>`).join(' ');
  const objs = [
    `<</Type/Catalog/Pages 2 0 R>>`,
    `<</Type/Pages/Kids[3 0 R]/Count 1>>`,
    `<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${PW} ${PH}]` +
      `/Resources<</Font<</F1 5 0 R>>/ExtGState<<${gsDict}>>>>/Contents 4 0 R>>`,
    `<</Length ${cs.length}>>\nstream\n${cs}endstream`,
    `<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>`,
  ];

  let pdf = '%PDF-1.4\n';
  const offsets = [];
  objs.forEach((o,i) => { offsets.push(pdf.length); pdf += `${i+1} 0 obj\n${o}\nendobj\n`; });
  const xref = pdf.length;
  pdf += `xref\n0 ${objs.length+1}\n0000000000 65535 f \n` +
    offsets.map(o => String(o).padStart(10,'0') + ' 00000 n \n').join('');
  pdf += `trailer\n<</Size ${objs.length+1}/Root 1 0 R>>\nstartxref\n${xref}\n%%EOF`;

  /* Latin-1: 1 byte por caractere, então os offsets do xref batem */
  const bytes = new Uint8Array(pdf.length);
  for (let i=0;i<pdf.length;i++) bytes[i] = pdf.charCodeAt(i) & 0xFF;
  return bytes;
}

let localClip = null;      /* espelho interno: o clipboard do sistema pode estar bloqueado */

function selectedEls(){
  return S.sel.map(id => S.els.find(e=>e.id===id)).filter(Boolean);
}
function copySelection(){
  const els = selectedEls();
  if (!els.length) return toast('Nada selecionado');
  const svg = buildSVG(els);
  localClip = svg;
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(svg).catch(()=>{});
  toast(`${els.length} ${els.length===1?'item copiado':'itens copiados'}`);
}
function placeCopies(els){
  if (!els.length) return;
  /* cola deslocado; se o resultado cair fora da tela, centraliza na viewport */
  let dx = 24/S.zoom, dy = 24/S.zoom;
  const {a,b,c,d} = contentBox(els);
  const tl = toScreen(a+dx, b+dy), br = toScreen(c+dx, d+dy);
  if (br.x < 40 || br.y < 40 || tl.x > W-40 || tl.y > H-140){
    const cen = toScene(W/2, (H-120)/2);
    dx = cen.x - (a+c)/2; dy = cen.y - (b+d)/2;
  }
  const copies = cloneGroup(els, dx, dy);
  S.els.push(...copies);
  S.sel = copies.map(c=>c.id);
  setTool('select'); commit(); paint();
}
function pasteClipboard(text){
  const els = decodePayload(text) || decodePayload(localClip);
  if (!els || !els.length) return toast('Nada para colar');
  placeCopies(els.map(el => ({edges:'sharp', arrowType:'straight', startBinding:null, endBinding:null, ...el})));
  toast(`${els.length} ${els.length===1?'item colado':'itens colados'}`);
}
function duplicateSelection(){
  const els = selectedEls();
  if (!els.length) return;
  const copies = cloneGroup(els, 18, 18);
