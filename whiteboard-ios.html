/* =========================================================================
   ASSISTENTE — gera OPERAÇÕES sobre a cena, não texto.
   O alvo é a seleção quando existe algo selecionado; senão, o quadro todo.
   ========================================================================= */
/* ---- vocabulário compacto -------------------------------------------------
   Nomes curtos em vez de hex: 1 token em vez de 4, e o modelo não erra dígito. */
const C_STROKE = {ink:INK, red:'#FF3B30', green:'#34C759', blue:'#007AFF', orange:'#FF9500', purple:'#AF52DE'};
const C_FILL   = {none:'transparent', pink:'#FFD8D6', mint:'#C9F0D4', sky:'#CFE6FF', sand:'#FFEBC2', lilac:'#EBD9FF'};
const F_SIZE   = {sm:16, md:22, lg:32, xl:48};
const NAME_OF  = (map, v) => Object.keys(map).find(k => map[k] === v);

const SYS = `Editor de quadro branco. Responda SÓ com linhas de comando. Sem markdown, sem explicação.

+ref tipo "texto" [attr]   cria (o app calcula tamanho e posição)
a>b [attr]                 seta de a para b (ref novo ou id existente)
~id attr                              altera
-id                                   apaga
!nota curta

tipos: rect diamond ellipse text
attr: stroke=red|green|blue|orange|purple  fill=pink|mint|sky|sand|lilac
      hatch cross dash dot sharp thin bold rough0 rough2 size=sm|lg|xl
      elbow curve (só em setas)

Regras
- Nunca escreva coordenadas nem tamanhos. O app posiciona, e ele acerta mais que você.
- Uma aresta por par. Não repita ligação.
- Não escreva valor que já é padrão.
- Decisão=diamond. Sucesso=fill=mint, erro=fill=pink, atenção=fill=sand.
- Máx 18 linhas.

Ex:
+a rect "Pedido recebido"
+b diamond "Estoque ok?"
+c rect "Separar" fill=mint
+d rect "Backorder" fill=pink
a>b
b>c elbow
b>d elbow
!Fluxo criado`;

/* ---- parser: uma linha por operação --------------------------------------
   Linha malformada é descartada sozinha. Se a resposta for cortada no meio,
   o que chegou inteiro ainda se aplica — com JSON, uma chave faltando perde tudo. */
function attrToken(a, t){
  let m;
  if ((m = t.match(/^stroke=(\w+)$/)) && C_STROKE[m[1]]) a.strokeColor = C_STROKE[m[1]];
  else if ((m = t.match(/^fill=(\w+)$/)) && C_FILL[m[1]]){ a.bgColor = C_FILL[m[1]]; a.fillStyle = a.fillStyle || 'solid'; }
  else if ((m = t.match(/^size=(\w+)$/)) && F_SIZE[m[1]]) a.fontSize = F_SIZE[m[1]];
  else if (t === 'hatch') a.fillStyle = 'hachure';
  else if (t === 'cross') a.fillStyle = 'cross';
  else if (t === 'dash')  a.strokeStyle = 'dashed';
  else if (t === 'dot')   a.strokeStyle = 'dotted';
  else if (t === 'sharp') a.edges = 'sharp';
  else if (t === 'round') a.edges = 'round';
  else if (t === 'thin')  a.strokeWidth = 1.4;
  else if (t === 'bold')  a.strokeWidth = 4.6;
  else if (t === 'rough0') a.roughness = 0;
  else if (t === 'rough2') a.roughness = 2.8;
  else if (t === 'elbow') a.arrowType = 'elbow';
  else if (t === 'curve') a.arrowType = 'curved';
  return a;
}
const parseAttrs = (str) => (str||'').trim().split(/\s+/).filter(Boolean).reduce(attrToken, {});

function parseOps(text){
  const ops = [], notes = [];
  for (let line of String(text).split('\n')){
    line = line.trim();
    if (!line || line.startsWith('```')) continue;

    if (line[0] === '!'){ notes.push(line.slice(1).trim()); continue; }
    if (line[0] === '-'){ ops.push({op:'del', id:line.slice(1).trim()}); continue; }
    if (line[0] === '~'){
      const m = line.slice(1).match(/^(\S+)\s*(.*)$/);
      if (m) ops.push({op:'set', id:m[1], attrs:parseAttrs(m[2])});
      continue;
    }
    if (line[0] === '+'){
      const m = line.match(/^\+(\S+)\s+(\S+)\s*([\s\S]*)$/);
      if (!m) continue;
      let rest = m[3], text = '';
      /* aspas sem fechamento = linha cortada no meio: descarta */
      if ((rest.match(/"/g) || []).length % 2) continue;
      rest = rest.replace(/"([^"]*)"/, (_, t) => { text = t; return ' '; });
      let pos = null, size = null; const attrs = {};
      for (const t of rest.trim().split(/\s+/).filter(Boolean)){
        let q;
        /* posição e tamanho vindos do modelo são descartados de propósito:
           era a maior fonte de caixa sobreposta e texto vazando */
        if (/^@-?[\d.]+,-?[\d.]+$/.test(t) || /^\d+x\d+$/.test(t)) continue;
        attrToken(attrs, t);
      }
      ops.push({op:'add', ref:m[1], type:m[2], text, pos, size, attrs});
      continue;
    }
    const e = line.match(/^([\w-]+)\s*>\s*([\w-]+)\s*(.*)$/);
    if (e) ops.push({op:'edge', from:e[1], to:e[2], attrs:parseAttrs(e[3])});
  }
  return {ops, note: notes.join(' ')};
}

/* ---- a cena, em linhas ---- */
function sceneToLines(els){
  return els.slice(0, 40).map(el => {
    if (LINEAR.includes(el.type)){
      const f = el.startBinding && el.startBinding.id, t = el.endBinding && el.endBinding.id;
      if (!f || !t) return null;
      return `${el.id} ${f}>${t}${el.arrowType!=='straight' ? ' '+(el.arrowType==='elbow'?'elbow':'curve') : ''}`;
    }
    const g = bounds(el), r = v => Math.round(v/5)*5;
    const at = [];
    if (el.strokeColor !== INK) at.push('stroke=' + NAME_OF(C_STROKE, el.strokeColor));
    if (el.bgColor !== 'transparent') at.push('fill=' + NAME_OF(C_FILL, el.bgColor));
    if (el.edges === 'sharp' && el.type !== 'ellipse') at.push('sharp');
    return `${el.id} ${el.type} @${r(g.x)},${r(g.y)} ${r(g.w)}x${r(g.h)}` +
           (el.text ? ` "${el.text.replace(/\n/g,' ').slice(0,60)}"` : '') +
           (at.length ? ' '+at.join(' ') : '');
  }).filter(Boolean).join('\n');
}
function viewportRect(){
  const a = toScene(20, 110), b = toScene(W-20, H-190);
  return {x:Math.round(a.x), y:Math.round(a.y), w:Math.round(b.x-a.x), h:Math.round(b.y-a.y)};
}

/* ---- dimensionar e posicionar: trabalho do app, não do modelo -------------
   Modelo é bom em estrutura e ruim em coordenada. Ele diz quem liga em quem;
   quem sabe medir texto e detectar colisão é quem tem measureText e bounds. */
function sizeNode(el){
  if (el.type === 'text'){ measureText(el); return; }
  mctx.font = `${el.fontSize}px ${HAND}`;
  const one = mctx.measureText(el.text || '').width;
  let w = one <= 190 ? Math.max(150, one + 44) : clamp(one*0.58 + 44, 190, 290);
  if (el.type === 'diamond') w = clamp(w*1.5, 190, 330);
  el.w = Math.round(w);
  el.h = el.type === 'diamond' ? 130 : 92;
  layoutLabel(el);                       /* cresce a altura conforme a quebra */
}
const overlaps = (a,b,pad=16) =>
  a.x < b.x+b.w+pad && a.x+a.w+pad > b.x && a.y < b.y+b.h+pad && a.y+a.h+pad > b.y;

function autoLayout(nodes, edges, rect){
  if (!nodes.length) return;
  const ids = new Set(nodes.map(n => n.id));
  const preds = new Map(nodes.map(n => [n.id, []]));
  const anchors = [];
  for (const e of edges){
    const fi = ids.has(e.from), ti = ids.has(e.to);
    if (fi && ti) preds.get(e.to).push(e.from);
    else if (ti || fi){
      const out = S.els.find(x => x.id === (ti ? e.from : e.to));
      if (out && !ids.has(out.id)) anchors.push(out);
    }
  }

  /* camada = maior caminho a partir de uma raiz */
  const layer = new Map();
  const depth = (id, seen) => {
    if (layer.has(id)) return layer.get(id);
    if (seen.has(id)) return 0;
    seen.add(id);
    const ps = preds.get(id);
    const d = ps.length ? Math.max(...ps.map(p => depth(p, seen))) + 1 : 0;
    layer.set(id, d); return d;
  };
  nodes.forEach(n => depth(n.id, new Set()));

  const vertical = rect.h >= rect.w;      /* retrato → fluxo de cima para baixo */
  const GL = 86, GS = 34;
  const groups = [];
  nodes.forEach(n => (groups[layer.get(n.id)] ||= []).push(n));

  let cursor = 0;
  for (const g of groups){
    if (!g) continue;
    const span = g.reduce((a,e) => a + (vertical ? e.w : e.h) + GS, -GS);
    let off = -span/2;
    for (const e of g){
      if (vertical){ e.x = off; e.y = cursor; off += e.w + GS; }
      else          { e.y = off; e.x = cursor; off += e.h + GS; }
    }
    cursor += Math.max(...g.map(e => vertical ? e.h : e.w)) + GL;
  }

  /* leva o bloco para perto de quem ele liga, ou para a área visível */
  const bb = () => {
    let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;
    for (const e of nodes){ const g=bounds(e); a=Math.min(a,g.x);b=Math.min(b,g.y);c=Math.max(c,g.x+g.w);d=Math.max(d,g.y+g.h); }
    return {x:a,y:b,w:c-a,h:d-b};
  };
  const move = (dx,dy) => nodes.forEach(e => { e.x+=dx; e.y+=dy; });

  let box = bb();
  if (anchors.length){
    let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;
    for (const e of anchors){ const g=bounds(e); a=Math.min(a,g.x);b=Math.min(b,g.y);c=Math.max(c,g.x+g.w);d=Math.max(d,g.y+g.h); }
    move(vertical ? a-box.x : c+GL-box.x, vertical ? d+GL-box.y : b-box.y);
  } else {
    move(rect.x + 24 - box.x, rect.y + 24 - box.y);
  }

  /* empurra até não bater em nada que já existia */
  const others = S.els.filter(e => !ids.has(e.id));
  for (let i=0; i<40; i++){
    box = bb();
    if (!others.some(o => overlaps(box, bounds(o)))) break;
    move(vertical ? box.w + GL : 0, vertical ? 0 : box.h + GL);
  }
}

/* o teclado do iOS empurra a barra para cima */
if (window.visualViewport){

/* ---- o que o modelo vê ---- */
function sceneSummary(els){
  return els.slice(0, 60).map(el => {
    const g = bounds(el);
    const o = {id:el.id, type:el.type,
               x:Math.round(g.x), y:Math.round(g.y), w:Math.round(g.w), h:Math.round(g.h)};
    if (el.text) o.text = el.text;
    if (el.bgColor !== 'transparent') o.bgColor = el.bgColor;
    if (el.strokeColor !== INK) o.strokeColor = el.strokeColor;
    if (el.edges === 'round') o.edges = 'round';
    if (LINEAR.includes(el.type)){
      o.arrowType = el.arrowType;
      if (el.startBinding) o.from = el.startBinding.id;
      if (el.endBinding) o.to = el.endBinding.id;
    }
    return o;
  });
}
function viewportRect(){
  const a = toScene(20, 110), b = toScene(W-20, H-190);
  return {x:Math.round(a.x), y:Math.round(a.y), w:Math.round(b.x-a.x), h:Math.round(b.y-a.y)};
}

/* ---- aplicar as operações ---- */
function applyOps(ops){
  const refs = new Map(), added = [], auto = [];

  for (const o of ops){
    if (o.op !== 'add') continue;
    const t = ['rect','diamond','ellipse','text'].includes(o.type) ? o.type : 'rect';
    const e = newEl(t, 0, 0);
    e.text = String(o.text || '');
    if (t !== 'text') e.edges = 'round';
    Object.assign(e, o.attrs);
    sizeNode(e);                       /* tamanho vem do texto medido, sempre */
    if (o.ref) refs.set(o.ref, e.id);
    S.els.push(e); added.push(e.id);
    auto.push(e);
  }

  const id = k => (refs.get(k) || k);
  const find = k => S.els.find(x => x.id === id(k));
  const edges = ops.filter(o => o.op === 'edge');

  if (auto.length) autoLayout(auto, edges.map(e => ({from:id(e.from), to:id(e.to)})), viewportRect());

  /* planeja todas as arestas antes de criar: a distribuição depende de quantas
     setas dividem o mesmo lado do mesmo nó */
  const plan = [];
  for (const o of edges){
    const A = find(o.from), B = find(o.to);
    if (!A || !B || A.id === B.id) continue;
    plan.push({o, A, B, sa:sideOf(A,B), sb:sideOf(B,A)});
  }
  const slot = new Map();
  const key = (id, sd) => `${id}|${sd.axis}${sd.s}`;
  for (const p of plan){
    for (const [n, sd] of [[p.A, p.sa], [p.B, p.sb]]){
      const k = key(n.id, sd);
      const arr = slot.get(k) || []; arr.push(p); slot.set(k, arr);
    }
  }
  const spreadOf = (n, sd, p) => {
    const arr = slot.get(key(n.id, sd)) || [p];
    if (arr.length < 2) return 0;
    return ((arr.indexOf(p)+1)/(arr.length+1) - 0.5) * 1.1;
  };

  for (const p of plan){
    const {o, A, B, sa, sb} = p;
    const e = newEl('arrow', 0, 0);
    Object.assign(e, o.attrs);

    e.startBinding = anchorOn(A, sa, spreadOf(A, sa, p));
    e.endBinding   = anchorOn(B, sb, spreadOf(B, sb, p));

    const ga = bounds(A), gb = bounds(B);
    const ca = {x:ga.x+ga.w/2, y:ga.y+ga.h/2}, cb = {x:gb.x+gb.w/2, y:gb.y+gb.h/2};
    e.x = ca.x; e.y = ca.y;
    e.points = [[0,0],[cb.x-ca.x, cb.y-ca.y]];

    /* alinhado no eixo do lado → reta; desalinhado → cotovelo */
    if (!o.attrs.arrowType){
      const off = sa.axis === 'x' ? Math.abs(cb.y-ca.y) : Math.abs(cb.x-ca.x);
      e.arrowType = off < 24 ? 'straight' : 'elbow';
    }
    /* irmãs saindo do mesmo lado ganham desvios diferentes no trecho comum */
    const sib = slot.get(key(A.id, sa)) || [];
    e.bend = sib.length > 1 ? (sib.indexOf(p) - (sib.length-1)/2) * 30 : 0;

    S.els.push(e); added.push(e.id);
  }

  for (const o of ops){
    if (o.op === 'set'){
      const el = find(o.id); if (!el) continue;
      Object.assign(el, o.attrs);
      if (el.type === 'text') measureText(el); else layoutLabel(el);
    }
    if (o.op === 'del'){
      const el = find(o.id); if (!el) continue;
      S.els = S.els.filter(x => x.id !== el.id);
      dropBindings([el.id]);
    }
  }
  return added;
}

/* A cena vai em linhas, não em JSON: ~40% menos tokens e nada de aspas em chave.
   Quando o alvo é a seleção, mandamos só ela + o que estiver ancorado nela. */
function buildUserMsg(prompt, target){
  const v = viewportRect();
  const lines = sceneToLines(target);
  return `visivel @${v.x},${v.y} ${v.w}x${v.h}\n` +
         (lines ? `${S.aiTarget==='selection' ? 'selecao' : 'quadro'}:\n${lines}\n` : 'quadro vazio\n') +
         (S.aiTarget==='selection' ? 'Altere só o que está acima.\n' : '') +
         `\n${prompt}`;
}

async function runAI(){
  const prompt = aiInput.value.trim();
  if (!prompt || aiBusy) return;
  let target = S.els;
  if (S.aiTarget === 'selection' && S.sel.length){
    const sel = selectedEls(), ids = new Set(sel.map(e=>e.id));
    /* setas ancoradas na seleção entram junto: sem elas o modelo não vê as ligações */
    const linked = S.els.filter(e => LINEAR.includes(e.type) && !ids.has(e.id) &&
      ((e.startBinding && ids.has(e.startBinding.id)) || (e.endBinding && ids.has(e.endBinding.id))));
    target = sel.concat(linked);
  }

  aiBusy = true; aiSend.classList.add('busy'); aiSend.disabled = true;
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:1000,
        system: SYS,
        messages:[{ role:'user', content: buildUserMsg(prompt, target) }],
      }),
    });
    if (!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    const text = (data.content || []).filter(c => c.type==='text').map(c => c.text).join('\n');
    const out = parseOps(text);
    if (!out.ops.length) throw new Error('sem operações');

    const added = applyOps(out.ops.slice(0, 24));
    S.sel = added;
    if (added.length) setTool('select');
    commit(); paint();
    if (added.length && offscreen(added)) fitTo(added);
    closeAI(); aiInput.value=''; aiGrow();
    toast(out.note ? out.note.slice(0,60) : 'Pronto');
  } catch (err) {
    toast('Não consegui: ' + (err.message || 'erro'));
  } finally {
    aiBusy = false; aiSend.classList.remove('busy'); aiGrow();
  }
}

function offscreen(ids){
  const els = ids.map(id => S.els.find(e=>e.id===id)).filter(Boolean);
  if (!els.length) return false;
  const {a,b,c,d} = contentBox(els);
  const tl = toScreen(a,b), br = toScreen(c,d);
  return br.x < 30 || br.y < 110 || tl.x > W-30 || tl.y > H-180;
}
function fitTo(ids){
  const els = ids.map(id => S.els.find(e=>e.id===id)).filter(Boolean);
  if (!els.length) return;
  const {a,b,c,d} = contentBox(els), pad = 60;
  const k = clamp(Math.min((W-pad*2)/Math.max(c-a,1), (H-pad*2-200)/Math.max(d-b,1)), 0.1, 2);
  S.zoom = k; S.off.x = W/2-(a+c)/2*k; S.off.y = (H-90)/2-(b+d)/2*k;
  showHud(); paint();
}

let toastT;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('on'), 1700);
}

/* --- teclado (dev/desktop) --- */
addEventListener('keydown', e => {
  if (document.activeElement === ta || document.activeElement === aiInput) return;
  if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openAI(); return; }
  const k = e.key.toLowerCase();
  const map = {v:'select',h:'hand',p:'draw',r:'rect',d:'diamond',o:'ellipse',a:'arrow',l:'line',t:'text',e:'eraser'};
  if (map[k] && !e.metaKey && !e.ctrlKey) return setTool(map[k]);
  const cmd = e.metaKey || e.ctrlKey;
  if (cmd && k==='z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
  if (cmd && k==='c'){ e.preventDefault(); copySelection(); return; }
  if (cmd && k==='v'){ e.preventDefault(); pasteClipboard(null); return; }
  if (cmd && k==='d'){ e.preventDefault(); duplicateSelection(); return; }
  if (cmd && k==='a'){ e.preventDefault(); S.sel = S.els.map(x=>x.id); if (S.sel.length) setTool('select'); paint(); return; }
  if ((k==='backspace'||k==='delete') && S.sel.length){
    S.els = S.els.filter(el => !S.sel.includes(el.id)); dropBindings(S.sel); S.sel=[]; commit(); paint();
  }
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  if (e.ctrlKey) zoomAt(e.clientX, e.clientY, S.zoom*(1-e.deltaY*0.01));
  else { S.off.x -= e.deltaX; S.off.y -= e.deltaY; paint(); }
}, {passive:false});

/* =========================================================================
   10. BOOT
   ========================================================================= */
addEventListener('resize', resize);
document.addEventListener('gesturestart', e => e.preventDefault());
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { syncSwatch(); paint(); });
resize(); setTool('draw'); syncSheet(); syncNav(); frame();
})();
</script>
